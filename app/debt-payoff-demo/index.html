<style>

<body>
<div id="demoBar" class="demo" hidden>Demo with sample data · Nothing is saved: reload to start over · <a id="buyLink" href="#">Get the full app</a></div>
<div class="app">
 <nav class="side" aria-label="Main">
  <div class="brand">Debt Payoff<small>by The Lemon Plans</small></div>
  <button class="navbtn" data-view="home"><span class="i">◎</span>Plan</button>
  <button class="navbtn" data-view="debts"><span class="i">▤</span>Debts</button>
  <button class="navbtn" data-view="schedule"><span class="i">▦</span>Months</button>
  <button class="navbtn" data-view="progress"><span class="i">★</span>Progress</button>
  <button class="navbtn" data-view="settings"><span class="i">⚙</span>Settings</button>
 </nav>
 <button class="themetog" id="themeTog" type="button"></button>
 <main id="main" tabindex="-1"></main>
</div>
<button class="fab" id="fab" aria-label="Log a payment" title="Log a payment">+</button>
<dialog id="dlg"><form method="dialog" class="dlg" id="dlgForm"></form></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
const DEMO = true;
const BUY_URL = "https://thelemonplans.gumroad.com/l/debt-payoff-app";
const KEY = DEMO ? "lp-debt-payoff-demo" : "lp-debt-payoff-v1";
const MAXM = 600; // 50 years: past this, the plan "never" ends
const METHODS = { snowball: "Snowball", avalanche: "Avalanche", custom: "Custom order" };
const METHOD_TXT = { snowball: "Smallest balance first. Quick wins keep you going.", avalanche: "Highest interest rate first. Usually saves the most money.", custom: "Your own order. Use the ↑ ↓ arrows on the Debts page." };

/* ---------- dates ---------- */
const iso = d => { const z = new Date(d); return z.getFullYear() + "-" + String(z.getMonth() + 1).padStart(2, "0") + "-" + String(z.getDate()).padStart(2, "0"); };
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d || 1); };
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const thisMonth = () => iso(today()).slice(0, 7);
const monthDate = i => { const s = parse(S.start); return new Date(s.getFullYear(), s.getMonth() + i - 1, 1); }; // i = 1 is the start month
const fmtM = d => d.toLocaleDateString("en-US", { month: "short", year: "numeric" });
const fmtML = d => d.toLocaleDateString("en-US", { month: "long", year: "numeric" });
const fmtD = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const yrs = n => { const y = Math.floor(n / 12), m = n % 12; return [y ? y + (y === 1 ? " year" : " years") : "", m ? m + (m === 1 ? " month" : " months") : ""].filter(Boolean).join(" ") || "0 months"; };

/* ---------- state ---------- */
function blank() { return { v: 1, app: "debt-payoff", currency: "$", theme: "light", accent: "green", extra: 0, method: "snowball", start: thisMonth(), debts: [], payments: [] }; }
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1 && Array.isArray(s.debts)) return s; } catch (e) {}
  return DEMO ? sample() : blank();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("Couldn't save in this browser"); } }
const uid = () => Math.random().toString(36).slice(2, 9);
let S = load();

function sample() {
  const s = blank();
  s.extra = 250; s.method = "snowball";
  s.debts = [
    ["Rewards Credit Card", 6200, 5400, 24.99, 160], ["Store Credit Card", 1500, 1180, 29.99, 45], ["Car Loan", 22000, 15750, 6.9, 410],
    ["Student Loan", 28000, 24300, 5.5, 275], ["Medical Bill", 1200, 820, 0, 50], ["Personal Loan", 8000, 6900, 11.9, 240]
  ].map(([name, orig, balance, apr, min]) => ({ id: uid(), name, orig, balance, apr, min }));
  const t = today(), d = n => iso(new Date(t.getFullYear(), t.getMonth() - 1, n));
  const id = n => s.debts.find(x => x.name === n).id;
  s.payments = [["Medical Bill", 300, 3, "Extra payment"], ["Rewards Credit Card", 160, 15, ""], ["Store Credit Card", 45, 3, ""], ["Car Loan", 410, 20, ""], ["Student Loan", 275, 1, ""], ["Personal Loan", 240, 25, ""]]
    .map(([n, a, day, note]) => ({ id: uid(), debt: id(n), amount: a, date: d(day), note, applied: false }));
  return s;
}

/* ---------- the math (whole cents, interest = balance × APR ÷ 12, rounded to the cent) ---------- */
const cents = v => Math.round((Number(v) || 0) * 100);
const interestOf = (bal, apr) => Math.round(bal * (Number(apr) || 0) / 1200 + 1e-9);
function priority(list, method) {
  const idx = list.map((d, i) => i);
  if (method === "snowball") idx.sort((a, b) => list[a].bal - list[b].bal || a - b);
  else if (method === "avalanche") idx.sort((a, b) => (Number(list[b].apr) || 0) - (Number(list[a].apr) || 0) || a - b);
  return idx;
}
// Every month: each debt grows by its interest, gets its minimum, and the rest of the fixed monthly budget
// (all starting minimums + extra) goes to the first debt in priority order. Freed-up minimums roll over.
function simulate(debts, extra, method) {
  const list = debts.map(d => ({ id: d.id, name: d.name, bal: cents(d.balance), apr: Number(d.apr) || 0, min: cents(d.min) })).filter(d => d.bal > 0);
  const order = priority(list, method);
  const budget = list.reduce((s, d) => s + d.min, 0) + Math.max(0, cents(extra));
  const months = [], payoff = {}, interest = {}, paid = {};
  list.forEach(d => { interest[d.id] = 0; paid[d.id] = 0; });
  let total = list.reduce((s, d) => s + d.bal, 0), m = 0;
  while (total > 0 && m < MAXM) {
    m++;
    const owed = list.map(d => d.bal + (d.bal > 0 ? interestOf(d.bal, d.apr) : 0));
    const minPaid = list.map((d, i) => Math.min(d.min, owed[i]));
    let left = Math.max(0, budget - minPaid.reduce((a, b) => a + b, 0));
    const pay = minPaid.slice();
    for (const i of order) { const x = Math.max(0, Math.min(owed[i] - minPaid[i], left)); pay[i] += x; left -= x; }
    let mi = 0, mp = 0; const row = { m, pay: {}, bal: {} };
    list.forEach((d, i) => {
      const it = owed[i] - d.bal; mi += it; mp += pay[i]; interest[d.id] += it; paid[d.id] += pay[i];
      d.bal = Math.max(0, owed[i] - pay[i]); row.pay[d.id] = pay[i]; row.bal[d.id] = d.bal;
      if (d.bal === 0 && payoff[d.id] == null && (owed[i] > 0)) payoff[d.id] = m;
    });
    total = list.reduce((s, d) => s + d.bal, 0);
    row.interest = mi; row.payment = mp; row.total = total; months.push(row);
  }
  const done = total === 0;
  return { done, months: done ? m : Infinity, rows: months, payoff, interest, paid, budget,
    totalInterest: months.reduce((s, r) => s + r.interest, 0), totalPaid: months.reduce((s, r) => s + r.payment, 0),
    start: list.reduce((s, d) => s + cents(debts.find(x => x.id === d.id).balance), 0),
    order: order.map(i => list[i].id) };
}
// Minimums only: each debt pays just its own minimum, nothing rolls over.
function minOnly(debts) {
  let months = 0, interest = 0, never = false; const curve = [];
  debts.forEach(d => {
    let bal = cents(d.balance), min = cents(d.min), apr = Number(d.apr) || 0, m = 0;
    if (bal <= 0) return;
    if (min <= interestOf(bal, apr)) { never = true; }
    while (bal > 0 && m < MAXM) { m++; const it = interestOf(bal, apr); interest += it; bal = Math.max(0, bal + it - Math.min(min, bal + it)); curve[m] = (curve[m] || 0) + bal; }
    if (bal > 0) never = true;
    months = Math.max(months, m);
  });
  return { never, months: never ? Infinity : months, interest, curve };
}
// Smallest whole-dollar extra that pays everything off within 50 years
function neededExtra(debts, method) {
  let lo = 0, hi = 100;
  while (!simulate(debts, hi, method).done) { hi *= 2; if (hi > 1e7) return null; }
  while (hi - lo > 1) { const md = Math.floor((lo + hi) / 2); if (simulate(debts, md, method).done) hi = md; else lo = md; }
  return hi;
}
const shortDebts = () => S.debts.filter(d => cents(d.balance) > 0 && cents(d.min) <= interestOf(cents(d.balance), d.apr));
let _cache = null, _ck = "";
function plan() {
  const k = JSON.stringify([S.debts, S.extra, S.method]);
  if (k !== _ck) { _ck = k; _cache = { cur: simulate(S.debts, S.extra, S.method), snow: simulate(S.debts, S.extra, "snowball"), aval: simulate(S.debts, S.extra, "avalanche"), mins: minOnly(S.debts) }; }
  return _cache;
}

/* ---------- formatting ---------- */
function money(v, dec) {
  const n = Math.round(Math.abs(v) * 100) / 100, neg = v < 0 && n > 0 ? "-" : "";
  const d = dec ?? (Math.round(n * 100) % 100 ? 2 : 0);
  return neg + S.currency + n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
}
const mc = (c, dec) => money(c / 100, dec); // cents
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1800); }
const debtName = id => (S.debts.find(d => d.id === id) || { name: "Deleted debt" }).name;

/* ---------- theme ---------- */
function applyTheme() {
  // the app starts light. "auto" was the old default, so it becomes light; "device" is the Auto chosen in Settings.
  if (!["light", "dark", "device"].includes(S.theme)) S.theme = "light";

function compareTable(P) {

  const m = P.mins;
  return `<div class="tscroll"><table class="cmp"><tr><th>Method</th><th>Debt-free</th><th>Months</th><th>Interest</th><th>Saved</th></tr>
   <tr><td>Minimums only</td><td>${m.never ? "Never" : fmtM(monthDate(m.months))}</td><td>${m.never ? "—" : m.months}</td><td>${m.never ? "—" : mc(m.interest, 0)}</td><td></td></tr>
   ${r("Snowball", "snowball", P.snow, S.method === "snowball")}${r("Avalanche", "avalanche", P.aval, S.method === "avalanche")}
   ${S.method === "custom" ? r("Custom order", "custom", P.cur, true) : ""}</table></div>`;

const axisMoney = c => { const v = c / 100; return v >= 1000 ? S.currency + (Math.round(v / 100) / 10).toLocaleString("en-US") + "k" : S.currency + Math.round(v); };
function chartSVG(P) {
  const narrow = matchMedia("(max-width:860px)").matches, c = P.cur, W = narrow ? 360 : 560, H = narrow ? 240 : 300, L = 52, R = 10, T = 10, B = 26;
  const planPts = [c.start].concat(c.rows.map(r => r.total));
  const minPts = [c.start]; for (let i = 1; i < P.mins.curve.length; i++) minPts.push(P.mins.curve[i] || 0);
  let n = c.done ? Math.max(c.months, Math.min(minPts.length - 1, c.months * 2.5)) : Math.min(MAXM, 120);
  n = Math.max(6, Math.round(n));
  const all = planPts.slice(0, n + 1).concat(minPts.slice(0, n + 1)), max = Math.max(1, ...all);
  const x = i => L + (W - L - R) * i / n, y = v => T + (H - T - B) * (1 - v / max);
  const line = pts => pts.slice(0, n + 1).map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v ?? 0).toFixed(1)).join(" ");
  let grid = "";
  for (let k = 0; k <= 4; k++) { const v = max * k / 4; grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${axisMoney(v)}</text>`; }
  const step = (n <= 24 ? 6 : n <= 60 ? 12 : n <= 180 ? 36 : 60) * (narrow && n > 24 ? 2 : 1);
  for (let i = 0; i <= n; i += step) grid += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${i === 0 ? "Now" : monthDate(i).toLocaleDateString("en-US", { month: "short", year: "2-digit" })}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Total balance over time">${grid}<path d="${line(minPts)}" fill="none" stroke="var(--chart2)" stroke-width="2.5" stroke-dasharray="6 5"/><path d="${line(planPts)}" fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linejoin="round"/></svg>`;
}

function csvText() {

  const cf = document.getElementById("curF"); cf.onsubmit = e => { e.preventDefault(); S.currency = cf.currency.value.trim() || "$"; save(); toast("Saved"); render(); };
  document.getElementById("exp").onclick = () => { download("debt-payoff-backup-" + iso(today()) + ".json", JSON.stringify(S, null, 1), "application/json"); toast("Backup downloaded"); };
  document.getElementById("imp").onchange = e => { const file = e.target.files[0]; if (!file) return; file.text().then(t => { const d = JSON.parse(t); if (d.v !== 1 || d.app !== "debt-payoff" || !Array.isArray(d.debts) || !Array.isArray(d.payments)) throw 0; S = Object.assign(blank(), d); save(); toast("Backup restored"); go("home"); }).catch(() => toast("That file isn't a Debt Payoff backup")); };
  document.getElementById("csv2").onclick = () => activeDebts().length ? exportCSV() : toast("Add a debt first");
  document.getElementById("loadSample").onclick = () => confirmDlg("Load sample data?", "This replaces what you have now with 6 sample debts. Download a backup first if you want to keep your data.", "Load sample", () => { S = sample(); save(); go("home"); });
  document.getElementById("wipe").onclick = () => confirmDlg("Erase everything?", "This deletes all your debts and payments from this browser. It can't be undone.", "Erase", () => { S = blank(); save(); go("home"); });
}

/* ---------- dialogs ---------- */
const D = () => document.getElementById("dlg"), F = () => document.getElementById("dlgForm");
function openDlg(html, onSubmit, after) {
  F().innerHTML = html; F().onsubmit = e => { if (e.submitter && e.submitter.value === "cancel") return; e.preventDefault(); if (onSubmit(new FormData(F())) !== false) { D().close(); save(); render(); } };
  D().showModal(); after && after(); const first = F().querySelector("input:not([type=hidden]),select"); first && first.focus();
}
const btns = (del) => `<div class="actions">${del ? `<button type="button" class="btn danger" id="delBtn" style="margin-right:auto">Delete</button>` : ""}<button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn" value="ok">Save</button></div>`;

function debtDlg(id) {
  const d = S.debts.find(x => x.id === id) || { name: "", balance: "", apr: "", min: "", orig: "" };
  openDlg(`<h2>${id ? "Edit debt" : "Add a debt"}</h2>
   <div class="field"><label>Name</label><input name="name" required value="${esc(d.name)}" placeholder="Visa, car loan, student loan…"></div>
   <div class="two"><div class="field"><label>Current balance</label><input name="balance" type="number" step="0.01" min="0" inputmode="decimal" required value="${d.balance}"></div>
   <div class="field"><label>Interest rate (APR %)</label><input name="apr" type="number" step="0.01" min="0" max="100" inputmode="decimal" value="${d.apr}" placeholder="24.99"></div></div>
   <div class="two"><div class="field"><label>Minimum payment / month</label><input name="min" type="number" step="0.01" min="0" inputmode="decimal" required value="${d.min}"></div>
   <div class="field"><label>Starting balance <small>(for progress)</small></label><input name="orig" type="number" step="0.01" min="0" inputmode="decimal" value="${d.orig}" placeholder="Same as balance"></div></div>
   <p id="dwarn" class="warnbox" hidden></p>
   ${btns(!!id)}`, fd => {
    const bal = Math.max(0, +fd.get("balance") || 0);
    const o = { id: d.id || uid(), name: fd.get("name").trim() || "Debt", balance: bal, apr: Math.max(0, +fd.get("apr") || 0), min: Math.max(0, +fd.get("min") || 0), orig: Math.max(bal, +fd.get("orig") || 0) };
    if (id) S.debts[S.debts.findIndex(x => x.id === id)] = o; else S.debts.push(o); toast(id ? "Debt updated" : "Debt added");
  }, () => {
    const f = F(), w = document.getElementById("dwarn");
    const chk = () => { const b = cents(f.balance.value), it = interestOf(b, f.apr.value); const bad = b > 0 && f.min.value !== "" && cents(f.min.value) <= it; w.hidden = !bad; if (bad) w.innerHTML = `⚠ <b>This minimum doesn't cover the interest.</b> The balance adds about ${mc(it)} of interest a month, so paying ${money(+f.min.value || 0)} it never goes down. Your plan can still pay it off with the extra payment.`; };
    ["balance", "apr", "min"].forEach(n => f[n].oninput = chk); chk();
    const del = document.getElementById("delBtn"); if (del) del.onclick = () => { D().close(); confirmDlg("Delete " + esc(d.name) + "?", "Its payments stay in the log. This can't be undone.", "Delete", () => { S.debts = S.debts.filter(x => x.id !== id); save(); render(); toast("Debt deleted"); }); };
  });
}
function payDlg(id) {
  if (!S.debts.length) { toast("Add a debt first"); return; }
  const p = S.payments.find(x => x.id === id) || { debt: (plan().cur.order[0] || S.debts[0].id), amount: "", date: iso(today()), note: "", applied: true };
  const isNew = !id;
  openDlg(`<h2>${id ? "Edit payment" : "Log a payment"}</h2>
   <div class="field"><label>Debt</label><select name="debt">${S.debts.map(d => `<option value="${d.id}" ${p.debt === d.id ? "selected" : ""}>${esc(d.name)} (${money(d.balance)})</option>`).join("")}</select></div>
   <div class="field"><label>Amount paid</label><input name="amount" type="number" step="0.01" min="0" inputmode="decimal" required value="${p.amount}" style="font-size:28px;font-weight:800"></div>
   <div class="two"><div class="field"><label>Date</label><input name="date" type="date" value="${p.date}"></div><div class="field"><label>Note (optional)</label><input name="note" value="${esc(p.note)}" placeholder="Extra payment, tax refund…"></div></div>
   <label style="display:flex;gap:10px;align-items:center;margin-bottom:10px;font-weight:650"><input type="checkbox" name="applied" ${p.applied ? "checked" : ""} style="width:20px;height:20px"> Lower this debt's balance by this amount</label>
   ${btns(!isNew)}`, fd => {
    const o = { id: p.id || uid(), debt: fd.get("debt"), amount: Math.abs(+fd.get("amount")) || 0, date: fd.get("date") || iso(today()), note: fd.get("note").trim(), applied: !!fd.get("applied") };
    if (!o.amount) { toast("Enter an amount"); return false; }
    if (!isNew) undoPay(p);
    applyPay(o);
    if (isNew) S.payments.push(o); else S.payments[S.payments.findIndex(x => x.id === id)] = o;
    const d = S.debts.find(x => x.id === o.debt);
    toast(d && cents(d.balance) <= 0 ? d.name + " is paid off! 🎉" : "Payment logged");
  }, () => { const del = document.getElementById("delBtn"); if (del) del.onclick = () => { undoPay(p); S.payments = S.payments.filter(x => x.id !== id); save(); D().close(); render(); toast("Payment deleted"); }; });
}
function applyPay(p) { const d = S.debts.find(x => x.id === p.debt); if (p.applied && d) d.balance = Math.max(0, (cents(d.balance) - cents(p.amount)) / 100); }
function undoPay(p) { const d = S.debts.find(x => x.id === p.debt); if (p.applied && d) d.balance = (cents(d.balance) + cents(p.amount)) / 100; }
function confirmDlg(title, text, ok, fn) {
  openDlg(`<h2>${title}</h2><p class="sub">${text}</p><div class="actions"><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn danger" value="ok">${ok}</button></div>`, () => false);
  F().onsubmit = e => { e.preventDefault(); D().close(); if (e.submitter && e.submitter.value === "ok") fn(); };
}

/* ---------- wiring ---------- */
function wire() {
  M().querySelectorAll("[data-editdebt]").forEach(b => b.onclick = () => debtDlg(b.dataset.editdebt));
  M().querySelectorAll("[data-editpay]").forEach(b => b.onclick = () => payDlg(b.dataset.editpay));
}
document.querySelectorAll(".navbtn").forEach(b => b.onclick = () => go(b.dataset.view));
document.getElementById("fab").onclick = () => S.debts.length ? payDlg() : debtDlg();
if (DEMO) {
  document.getElementById("demoBar").hidden = false; document.getElementById("buyLink").href = BUY_URL;
  // Demo: nothing is saved (reload = back to the sample) and backup/restore/CSV are only in the full app.
  try { localStorage.removeItem(KEY); } catch (e) {}
  save = function () {};
  document.addEventListener("click", ev => {
    const el = ev.target.closest("button, label, a, input[type=file]");
    if (el && el.id !== "buyLink" && /csv|backup|restore/i.test(el.textContent + " " + (el.id || ""))) {
      ev.preventDefault(); ev.stopPropagation(); toast("Backup, restore and CSV export are in the full app");
    }
  }, true);
}
window.__lp = { simulate, minOnly, neededExtra, plan, csvText, interestOf, get S() { return S; } };
go("home");
</script>
<script>/*mobile-actions-fix*/
(() => {
  const MQ = matchMedia("(max-width:860px)");
  const RARE = /\b(csv|export|print|pdf|clear sample|backup|restore|import)\b/i;
  const ADD = /(^|\s)\+|\b(add|new|log|record)\b/i;
  const main = document.getElementById("main"); if (!main) return;
  const txt = b => (b.textContent || "") + " " + (b.getAttribute("aria-label") || "");
  const vis = e => e && !e.hidden && getComputedStyle(e).display !== "none";
  let openMenu = null;
  function closeMenu(focus) {
    if (!openMenu) return; const m = openMenu; openMenu = null;
    m.menu.hidden = true; m.btn.setAttribute("aria-expanded", "false"); if (focus) m.btn.focus();
  }
  function items(m) { return [...m.querySelectorAll('[role="menuitem"]')].filter(vis); }
  function openM(w, i) {
    closeMenu(); const menu = w.querySelector(".mact-menu"), btn = w.querySelector(".mact-morebtn");
    menu.hidden = false; btn.setAttribute("aria-expanded", "true"); openMenu = { menu, btn };
    const it = items(menu); if (it.length) it[i < 0 ? it.length - 1 : 0].focus();
  }
  function head() {
    const h = main.firstElementChild;
    return h && (h.classList.contains("tablebar") || h.classList.contains("top")) ? h : null;
  }
  function apply() {
    const h = head(), mobile = MQ.matches;
    const hasAdd = !!h && [...h.querySelectorAll("button,a.btn")].some(b => vis(b) && ADD.test(txt(b)));
    document.documentElement.classList.toggle("mact-nofab", mobile && hasAdd);
    if (mobile && h && !h.dataset.mact) {
      h.dataset.mact = "1";
      const title = h.firstElementChild;
      const acts = [...h.querySelectorAll("button.btn,a.btn")].filter(b => !title.contains(b) && !b.closest(".mact-bar"));
      if (acts.length) {
        const pri = [...acts].reverse().find(b => !b.classList.contains("ghost") && !b.classList.contains("small"));
        const rest = acts.filter(b => b !== pri);
        let rare = rest.filter(b => RARE.test(txt(b)));
        if (rare.length < 2 || rare.length === rest.length && !pri) rare = [];
        const sec = rest.filter(b => !rare.includes(b));
        const bar = document.createElement("div"); bar.className = "mact-bar";
        if (pri) { pri.classList.add("mact-pri"); bar.append(pri); }
        if (sec.length || rare.length) {
          const g = document.createElement("div"); g.className = "mact-grid"; g.append(...sec);
          if (rare.length) {
            const w = document.createElement("div"); w.className = "mact-more";
            const id = "mactMenu" + Math.random().toString(36).slice(2, 7);
            w.innerHTML = `<button type="button" class="btn ghost mact-morebtn" aria-haspopup="menu" aria-expanded="false" aria-controls="${id}" aria-label="More actions">⋯ More</button><div class="mact-menu" id="${id}" role="menu" aria-label="More actions" hidden></div>`;
            const menu = w.lastElementChild;
            rare.forEach(b => { b.setAttribute("role", "menuitem"); b.tabIndex = -1; menu.append(b); });
            g.append(w);
          }
          bar.append(g);
        }
        const old = [...h.children].filter(c => c !== title && !c.children.length && !c.textContent.trim());
        title.after(bar); old.forEach(c => c.remove());
        h.classList.add("mact-head");
      }
    }
    pad();
  }
  function pad() {
    if (!MQ.matches) return;
    let top = innerHeight;
    document.querySelectorAll("body>*,.app>*").forEach(e => {
      if (e === main || e.tagName === "DIALOG" || !vis(e)) return;
      const cs = getComputedStyle(e); if (cs.position !== "fixed" || cs.pointerEvents === "none" || +cs.opacity === 0) return;
      const r = e.getBoundingClientRect(); if (r.height && r.top > innerHeight / 2) top = Math.min(top, r.top);
    });
    const pb = Math.max(96, Math.ceil(innerHeight - top + 16)) + "px";
    if (document.documentElement.style.getPropertyValue("--mact-pb") !== pb) document.documentElement.style.setProperty("--mact-pb", pb);
  }
  new MutationObserver(apply).observe(main, { childList: true });
  const fab = document.getElementById("fab");
  if (fab) new MutationObserver(pad).observe(fab, { attributes: true, attributeFilter: ["hidden", "style", "class"] });
  addEventListener("resize", pad);
  MQ.addEventListener("change", () => { closeMenu(); if (typeof render === "function") render(); else apply(); setTimeout(pad, 50); });
  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest(".mact-morebtn");
    if (b) { const w = b.parentElement; if (openMenu && openMenu.btn === b) closeMenu(); else openM(w, 0); return; }
    if (openMenu && !openMenu.menu.contains(e.target)) closeMenu();
    else if (openMenu && e.target.closest('[role="menuitem"]')) closeMenu();
  });
  document.addEventListener("keydown", e => {
    const b = e.target.closest && e.target.closest(".mact-morebtn");
    if (b && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); openM(b.parentElement, e.key === "ArrowUp" ? -1 : 0); return; }
    if (!openMenu) return;
    const it = items(openMenu.menu), i = it.indexOf(document.activeElement);
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeMenu(true); }
    else if (e.key === "Tab") closeMenu();
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const n = it.length; if (n) it[(i + (e.key === "ArrowDown" ? 1 : -1) + n) % n].focus(); }
    else if (e.key === "Home" || e.key === "End") { e.preventDefault(); if (it.length) it[e.key === "Home" ? 0 : it.length - 1].focus(); }
  }, true);
  apply(); addEventListener("load", pad); setTimeout(pad, 300);
})();
</script>

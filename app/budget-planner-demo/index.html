<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F5F4A">
<title>Budget Planner App · The Lemon Plans</title>
<style>
:root{--bg:#F5F4EF;--card:#FFFFFF;--ink:#1F2937;--muted:#6B7280;--line:#E4E2D9;--soft:#ECF3EF;--accent:#1F5F4A;--accent-ink:#fff;--fill:#2E7D5B;--fill2:#F2C94C;--glass:#DCEAE2;--good:#2E7D5B;--warn:#B7791F;--bad:#B91C1C;--goodbg:#E6F2EC;--warnbg:#FBF0D9;--badbg:#FBE4E1;--g-needs:#2E7D5B;--g-wants:#E0A526;--g-savings:#3B82B8;--g-debt:#C2553F;--shadow:0 10px 30px rgba(31,41,55,.07);--r:18px}
:root[data-theme="dark"]{--bg:#0F1613;--card:#17201C;--ink:#E5ECE8;--muted:#9AA8A1;--line:#26332D;--soft:#1D2A24;--accent:#6FCB9F;--accent-ink:#0A1A12;--fill:#3E9B70;--fill2:#D9B13F;--glass:#22352C;--good:#5CC497;--warn:#E3B45C;--bad:#F07A6E;--goodbg:#173027;--warnbg:#33291A;--badbg:#3A2020;--g-needs:#4FB083;--g-wants:#E3B445;--g-savings:#62A3D6;--g-debt:#E07A64;--shadow:0 10px 30px rgba(0,0,0,.35)}
:root[data-accent="ocean"]{--accent:#1F5A85;--fill:#3B82B8;--glass:#DCE7F1;--soft:#E9F0F6}:root[data-accent="ocean"][data-theme="dark"]{--accent:#7DB8E8;--accent-ink:#0B1622;--fill:#3B7DB0;--glass:#1F2E3B;--soft:#1B2630}
:root[data-accent="coral"]{--accent:#B0452C;--fill:#E07A5F;--glass:#F6E1DA;--soft:#F7ECE7}:root[data-accent="coral"][data-theme="dark"]{--accent:#F4A18A;--accent-ink:#2A0F08;--fill:#D06A4F;--glass:#3A2620;--soft:#2B201C}
:root[data-accent="plum"]{--accent:#6B4C9A;--fill:#9479C4;--glass:#E9E2F3;--soft:#EEEAF5}:root[data-accent="plum"][data-theme="dark"]{--accent:#B9A0E6;--accent-ink:#170F24;--fill:#7E62AE;--glass:#2E2840;--soft:#231F30}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh;position:relative}
nav.side{padding:22px 12px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:var(--bg)}
.brand{font-weight:800;font-size:18px;padding:0 10px 18px;letter-spacing:-.3px;line-height:1.2}
.brand small{display:block;font-weight:600;font-size:12px;color:var(--muted);letter-spacing:.2px;margin-top:2px}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:650;color:var(--muted);text-align:left}
.navbtn .i{width:22px;text-align:center;font-size:17px}
.navbtn[aria-current="page"]{background:var(--soft);color:var(--ink)}
main{padding:26px 30px 120px;max-width:1180px;width:100%;min-width:0}
main:focus{outline:none}
h1{font-size:27px;margin:0 0 4px;letter-spacing:-.6px}
h2{font-size:18px;margin:0 0 12px;letter-spacing:-.2px}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1.4fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g2e{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.lab{font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.big{font-size:44px;font-weight:850;letter-spacing:-1.6px;line-height:1.05;margin:6px 0 4px;color:var(--accent)}
.big.neg{color:var(--bad)}
.mid{font-size:25px;font-weight:800;letter-spacing:-.6px;margin-top:4px}
.mid.neg{color:var(--bad)}
.meta{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-weight:750;font-size:12.5px;white-space:nowrap}
.ok{background:var(--goodbg);color:var(--good)}.tight{background:var(--warnbg);color:var(--warn)}.short{background:var(--badbg);color:var(--bad)}.done{background:var(--good);color:#fff}.plain{background:var(--soft);color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt{width:56px;flex:none;font-size:12.5px;font-weight:750;color:var(--muted);line-height:1.2}
.dt b{display:block;font-size:17px;color:var(--ink)}
.amt{font-weight:800;white-space:nowrap;text-align:right}
.amt.pos{color:var(--good)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:13px;padding:11px 17px;font-weight:800;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.small{padding:7px 12px;border-radius:10px;font-size:13.5px}
.btn.danger{background:var(--badbg);color:var(--bad)}
.icon{border:0;background:var(--soft);border-radius:10px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center;font-size:14px;flex:none}
.bar{height:9px;border-radius:999px;background:var(--glass);overflow:hidden}.bar i{display:block;height:100%;background:var(--fill);border-radius:999px}
.bar i.over{background:var(--bad)}
.fab{position:fixed;right:26px;bottom:26px;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:32px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.25);cursor:pointer;z-index:20}
.themetog{position:absolute;top:22px;right:28px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer;z-index:10;padding:0;transition:color .15s,border-color .15s}
.themetog:hover,.themetog:focus-visible{color:var(--ink);border-color:var(--muted)}
.themetog svg{width:18px;height:18px;display:block}
main h1{padding-right:48px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top .sub{margin:0}
@media (min-width:861px){.top{padding-right:56px}}
.mpick{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.mpick button{border:0;background:var(--soft);border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:18px;font-weight:800;line-height:1}
.mpick b{min-width:140px;text-align:center;font-size:15px}
@media (max-width:860px){.themetog{top:14px;right:14px;width:36px;height:36px}}
.empty{color:var(--muted);text-align:center;padding:22px 10px}
.hint{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--ink)}
.kv{display:flex;justify-content:space-between;padding:6px 0;color:var(--muted);gap:10px}.kv b{color:var(--ink);text-align:right;white-space:nowrap}
.kv.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;color:var(--ink);font-weight:800}
.tablebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.filters select,.filters input{padding:9px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);min-width:0;max-width:100%}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
table.t thead th{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
table.t tr.sum td{font-weight:800;border-top:2px solid var(--line)}
table.t tr.hd td{font-weight:800;color:var(--accent);font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;padding-top:14px}
table.t td.z{color:var(--muted)}
table.t td.neg{color:var(--bad);font-weight:750}
table.t th.now{background:var(--fill2);color:#1F2933;border-radius:6px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-weight:700}.chart .ax{stroke:var(--line)}
.chart .gi{fill:var(--fill)}.chart .ge{fill:var(--fill2)}.chart .gp{fill:var(--glass)}.chart .gl{stroke:var(--ink);stroke-width:2;fill:none}.chart .gd{fill:var(--ink)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);font-weight:700;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.gdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;flex:none}
.g-income{background:var(--accent)}.g-needs{background:var(--g-needs)}.g-wants{background:var(--g-wants)}.g-savings{background:var(--g-savings)}.g-debt{background:var(--g-debt)}
.ltb{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ltb .msg{flex:1;min-width:220px}
.split{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--glass);margin:10px 0 8px}
.split i{display:block;height:100%}
/* budget rows */
.bhead,.brow{display:grid;grid-template-columns:minmax(0,1.6fr) 118px 110px 110px minmax(90px,1fr) 128px;gap:10px;align-items:center}
.bhead{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:800;padding:0 0 6px;border-bottom:1px solid var(--line)}
.bhead span,.brow .n{text-align:right}
.bhead span:first-child{text-align:left}
.brow{padding:8px 0;border-bottom:1px solid var(--line)}
.brow.tot{border-bottom:0;font-weight:800;background:var(--soft);border-radius:10px;padding:8px 8px;margin-top:6px}
.brow .cname{border:0;background:none;padding:0;text-align:left;font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brow .cname:hover{color:var(--accent);text-decoration:underline}
.brow input{width:100%;padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:right;font-weight:750;min-width:0}
.brow input:focus{outline:2px solid var(--accent);outline-offset:1px}
.brow .n{white-space:nowrap;font-weight:700}
.brow .n.neg{color:var(--bad)}
.brow .st{text-align:right}
.brow .st .pill{font-size:11.5px;padding:3px 9px}
.addcat{margin-top:10px}
.gtitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.gtitle h2{margin:0;display:flex;align-items:center}
/* bills grid */
.bgrid td.c{text-align:center;font-weight:800;color:var(--good)}
.bgrid td.c.late{color:var(--bad)}
.paybtn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:750;cursor:pointer;white-space:nowrap;font-size:13px}
.paybtn[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.goal{display:flex;gap:16px;align-items:center}
.ring circle{fill:none;stroke-width:11}.ring .tr{stroke:var(--glass)}.ring .pr{stroke:var(--fill);stroke-linecap:round}
.ring text{fill:var(--ink);font-weight:850;font-size:22px}
dialog{border:0;border-radius:22px;padding:0;background:var(--card);color:var(--ink);width:min(520px,94vw);box-shadow:0 30px 80px rgba(0,0,0,.35);max-height:92vh}
dialog::backdrop{background:rgba(10,14,18,.45)}
.dlg{padding:22px}
.field{display:grid;gap:5px;margin-bottom:12px;min-width:0}
.field label,.field .fl{font-size:12.5px;font-weight:750;color:var(--muted)}
.field input,.field select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);min-width:0}
/*field-fix*/.field{align-content:start}.field input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=color]),.field select{height:48px;line-height:1.25}.field input[type=date]{display:block;min-width:0}
/*field-fix-2*/@supports (grid-template-rows:subgrid){.two>.field{grid-row:span 3;grid-template-rows:subgrid;row-gap:6px}}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px}
.field small{color:var(--muted);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;cursor:pointer;font-weight:650;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tick{display:flex;gap:10px;align-items:center;font-weight:650;cursor:pointer;margin:2px 0 12px}
.tick input{width:18px;height:18px;accent-color:var(--accent)}
.demo{background:#F2C94C;color:#1F2933;padding:10px 16px;text-align:center;font-weight:700;font-size:14px}
.demo a{color:#1F2933}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.foot{color:var(--muted);font-size:12px;margin-top:30px}
.flag{color:var(--bad);font-weight:800}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.bhead,.brow{grid-template-columns:minmax(0,1.4fr) 104px 96px 96px 120px}.brow .bc,.bhead .bc{display:none}}
@media (max-width:860px){
 .app{grid-template-columns:1fr}
 nav.side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;z-index:30;display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:var(--card)}
 .brand{display:none}
 .navbtn{flex-direction:column;gap:2px;font-size:10px;padding:6px 1px;justify-content:center;align-items:center;text-align:center;min-width:0}
 .navbtn .i{font-size:18px}
 main{padding:20px 14px 150px}
 .g2,.g3,.g2e{grid-template-columns:1fr}
 .big{font-size:36px}
 .fab{bottom:86px;right:18px}
 .toast{bottom:160px}
 .card{padding:15px}
 .top{padding-right:44px}
 .mpick b{min-width:118px;font-size:14px}
 .bhead{display:none}
 .brow{grid-template-columns:minmax(0,1fr) 96px;row-gap:4px}
 .brow .n,.brow .st{text-align:left;font-size:13px}
 .brow .n.a::before{content:"Actual ";color:var(--muted);font-weight:600}
 .brow .n.l::before{content:"Left ";color:var(--muted);font-weight:600}
 .brow .bc{display:block!important;grid-column:1 / -1}
 .brow.tot .bc{display:none!important}
 .g4 .mid{font-size:21px}
 .row.bill{flex-wrap:wrap;row-gap:6px}
 .row.bill .grow{flex:1 1 calc(100% - 68px)}
 .row.bill .pill{margin-left:68px}
 .row.bill .amt{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/*mobile-actions-fix*/
@media (max-width:860px){
 #main{padding-bottom:var(--mact-pb,180px)!important}
 html.mact-nofab .fab{display:none!important}
 .mact-head{display:block!important;padding-right:0!important}
 .mact-bar{display:grid;gap:8px;margin-top:14px;width:100%}
 .mact-bar .btn{width:100%;min-height:44px;margin:0;white-space:normal;text-align:center;line-height:1.2}
 .mact-bar>.mact-pri{min-height:50px;font-size:16px}
 .mact-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .mact-grid>:last-child:nth-child(odd){grid-column:1/-1}
 .mact-more{position:relative;display:grid}
 .mact-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;display:grid;gap:2px;padding:6px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.18)}
 .mact-menu[hidden]{display:none}
 .mact-menu .btn{background:transparent;justify-content:flex-start;text-align:left;border-radius:10px}
 .mact-menu .btn:hover,.mact-menu .btn:focus-visible{background:var(--soft)}
}
/*lp-brand*/
.lp-brandbar{display:none}
.brand .lp-lemon{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:5px}
.brand .lp-lemon svg,.lp-brandbar svg{width:100%;height:100%;display:block}
@media (max-width:860px){
 .lp-brandbar{display:flex;align-items:center;gap:7px;padding:12px 64px 0 18px;font:600 13px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--muted);letter-spacing:.1px;min-width:0}
 .lp-brandbar .lp-lemon{width:18px;height:18px;flex:none}
 .lp-brandbar b{color:var(--ink,var(--text,inherit));font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
 .lp-brandbar span{white-space:nowrap;opacity:.85}
}
@media print{.lp-brandbar{display:none!important}}
</style>
</head>
<body>
<div id="demoBar" class="demo" hidden>Demo with sample data · Nothing is saved: reload to start over · <a id="buyLink" href="#">Get the full app</a></div>
<div class="lp-brandbar" id="lpBrand" aria-hidden="true"></div>
<div class="app">
 <nav class="side" aria-label="Main">
  <div class="brand">Budget Planner<small>Monthly &amp; yearly · by The Lemon Plans</small></div>
  <button class="navbtn" data-view="home"><span class="i">◉</span>Dashboard</button>
  <button class="navbtn" data-view="budget"><span class="i">▦</span>Budget</button>
  <button class="navbtn" data-view="tx"><span class="i">⇅</span>Spending</button>
  <button class="navbtn" data-view="bills"><span class="i">▤</span>Bills</button>
  <button class="navbtn" data-view="goals"><span class="i">◎</span>Goals</button>
  <button class="navbtn" data-view="year"><span class="i">▥</span>Year</button>
  <button class="navbtn" data-view="settings"><span class="i">⚙</span>Settings</button>
 </nav>
 <button class="themetog" id="themeTog" type="button"></button>
 <main id="main" tabindex="-1"></main>
</div>
<button class="fab" id="fab" aria-label="Add a transaction" title="Add a transaction">+</button>
<dialog id="dlg"><form method="dialog" class="dlg" id="dlgForm"></form></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
const DEMO = true;

function status(group, p, a) {
  if (!p && !a) return null;
  if (group === "income") return a >= p ? ["Received", "done"] : [mc(p - a, 0) + " expected", "plain"];
  if (group === "savings" || group === "debt") return a >= p ? ["Done", "done"] : [mc(p - a, 0) + " to go", "plain"];
  if (a > p) return ["Over by " + mc(a - p, 0), "short"];
  if (!p) return null;
  if (a === p) return ["On budget", "ok"];
  return a >= 0.9 * p ? ["Almost at limit", "tight"] : ["On track", "ok"];
}
function year(y = VM.y) {
  const months = Array.from({ length: 12 }, (_, i) => month(y, i + 1));
  const avg = (arr, test) => { const n = arr.filter(test).length; return n ? Math.round(arr.reduce((s, v) => s + v, 0) / n) : 0; };
  const row = (vals, budget, inc) => { const tot = vals.reduce((s, v) => s + v, 0); return { vals, tot, budget, left: inc ? tot - budget : budget - tot }; };
  const groups = {}; GROUPS.forEach(g => { const r = row(months.map(x => x.grp[g.key].act), months.reduce((s, x) => s + x.grp[g.key].plan, 0), g.key === "income"); r.avg = avg(r.vals, v => v !== 0); groups[g.key] = r; });
  const out = row(months.map(x => x.actOut), months.reduce((s, x) => s + x.planOut, 0)); out.avg = avg(out.vals, v => v !== 0);
  const left = row(months.map(x => x.left), months.reduce((s, x) => s + x.toBudget, 0), true); left.avg = avg(left.vals, v => v !== 0);
  const cats = {}; S.cats.forEach(c => { const r = row(months.map(x => x.cat[c.id].act), months.reduce((s, x) => s + x.cat[c.id].plan, 0), c.group === "income"); r.avg = avg(r.vals, v => v > 0); cats[c.id] = r; });
  return { y, months, groups, out, left, cats };
}
// Savings goals: everything ever logged in the goal's savings category counts, plus what was saved before
function goalInfo(g, now = today()) {
  const saved = cents(g.before) + S.tx.filter(t => g.cat && t.cat === g.cat).reduce((s, t) => s + cents(t.amount), 0), target = cents(g.target);
  const left = Math.max(0, target - saved), pct = target > 0 ? Math.min(1, saved / target) : 0;
  let monthsLeft = null, per = null, st;
  if (left === 0 && target > 0) st = "reached";
  else if (!g.date) st = "nodate";
  else { const d = parse(g.date); monthsLeft = (d.getFullYear() - now.getFullYear()) * 12 + d.getMonth() - now.getMonth(); if (monthsLeft <= 0) st = "passed"; else { st = "saving"; per = Math.ceil(left / monthsLeft); } }
  return { saved, target, left, pct, monthsLeft, per, st };
}
// Bills: paid, late (due day passed and not marked), due soon (7 days) or upcoming
function billDay(b, y, m) { return Math.min(Math.max(1, Math.round(Number(b.day) || 1)), dim(y, m)); }
function billStatus(b, y = VM.y, m = VM.m, now = today()) {
  if ((S.paid[ymKey(y, m)] || []).includes(b.id)) return { k: "paid", t: "Paid" };
  const due = new Date(y, m - 1, billDay(b, y, m)), diff = Math.round((due - now) / 86400000);
  if (diff < 0) return { k: "late", t: "Late" };
  if (diff === 0) return { k: "soon", t: "Due today" };
  if (diff <= 7) return { k: "soon", t: "Due in " + diff + " day" + (diff === 1 ? "" : "s") };
  return { k: "up", t: "Upcoming" };
}
function billTotals(y = VM.y, m = VM.m) {
  const tot = S.bills.reduce((s, b) => s + cents(b.amount), 0), paid = S.bills.filter(b => billStatus(b, y, m).k === "paid").reduce((s, b) => s + cents(b.amount), 0);
  return { tot, paid, left: tot - paid, late: S.bills.filter(b => billStatus(b, y, m).k === "late").length };
}

function money(v, dec) {

}
const mc = (c, dec) => money(c / 100, dec);
const mcs = c => mc(c, c % 100 === 0 ? 0 : 2);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function groupChart(R) {
  const W = 520, H = 210, gs = OUT, max = Math.max(1, ...gs.map(g => Math.max(R.grp[g].plan, R.grp[g].act))), bw = W / gs.length, base = H - 26;
  const y = v => base - (base - 18) * Math.max(0, v) / max;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Budget and actual by group">
   <line class="ax" x1="0" x2="${W}" y1="${base}" y2="${base}"/>
   ${gs.map((g, i) => { const x0 = i * bw + bw * .2, w = bw * .28, p = R.grp[g].plan, a = R.grp[g].act;
     return `<rect class="gp" x="${x0.toFixed(1)}" y="${y(p).toFixed(1)}" width="${w.toFixed(1)}" height="${(base - y(p)).toFixed(1)}" rx="4"><title>${gName(g)} budget ${mc(p, 0)}</title></rect>
     <rect style="fill:var(--g-${g})" x="${(x0 + w + 4).toFixed(1)}" y="${y(a).toFixed(1)}" width="${w.toFixed(1)}" height="${(base - y(a)).toFixed(1)}" rx="4"><title>${gName(g)} actual ${mc(a, 0)}</title></rect>
     <text x="${(i * bw + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${gName(g).replace(" payments", "")}</text>`; }).join("")}
  </svg>`;
}

   <div class="msg"><b>${esc(msg)}</b><div class="meta">Planned income ${mc(R.planIncome, 0)} − planned spending, saving and debt ${mc(R.planOut, 0)}</div></div></div>`;
}

    .filter(x => x.st && (x.st[1] === "short" || x.st[1] === "tight")).sort((a, b) => (b.r.act - b.r.plan) - (a.r.act - a.r.plan)).slice(0, 5);

  </div>
  ${R.uncat ? `<p class="hint" style="margin-top:14px">⚠ ${R.uncat} transaction${R.uncat === 1 ? "" : "s"} this month (${mc(R.uncatAmt)}) ${R.uncat === 1 ? "has" : "have"} no category, so ${R.uncat === 1 ? "it isn't" : "they aren't"} counted. <button class="btn small ghost" data-go="tx">Fix in Spending</button></p>` : ""}

    <div class="split" aria-label="Where your income went">${OUT.map(g => `<i class="g-${g}" style="width:${R.income > 0 ? Math.min(100, R.grp[g].act / R.income * 100).toFixed(1) : 0}%" title="${gName(g)}"></i>`).join("")}</div>

   <div class="card"><h2>Watch these</h2>${watch.length ? watch.map(x => `<div class="row"><div class="grow"><div class="name">${esc(x.c.name)}</div>${barHTML(x.r.act, x.r.plan, x.st[1] === "short")}</div><div class="amt">${mc(x.r.act, 0)}<div class="meta">of ${mc(x.r.plan, 0)}</div></div></div>`).join("") : `<div class="empty">Nothing over budget. Nice work. 🍋</div>`}</div>
  </div>

   <div class="card"><div class="tablebar"><h2 style="margin:0">Savings goals</h2><button class="btn small ghost" data-go="goals">All goals</button></div>

function tx() {

  let list = S.tx.filter(t => t.date && t.date.slice(0, 7) === key);

  M().innerHTML = topbar("Spending & income", "Every transaction this month. Amounts are positive; the category decides where it counts.", mpick()) + `
  <div class="grid g4"><div class="card"><div class="lab">Income</div><div class="mid">${mc(R.income)}</div></div><div class="card"><div class="lab">Spent</div><div class="mid">${mc(R.spent)}</div></div><div class="card"><div class="lab">Saved</div><div class="mid">${mc(R.saved)}</div></div><div class="card"><div class="lab">Debt paid</div><div class="mid">${mc(R.debt)}</div></div></div>

const q = v => /[",\n\r]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v), f2 = c => (c / 100).toFixed(2);
function csvText(kind) {
  const out = (head, rows) => [head, ...rows].map(r => r.map(q).join(",")).join("\r\n") + "\r\n";
  if (kind === "transactions") return out(["Date", "Description", "Category", "Group", "Amount", "Notes"], S.tx.slice().sort((a, b) => a.date.localeCompare(b.date)).map(t => [t.date, t.desc, catName(t.cat), catById(t.cat) ? gName(groupOf(t.cat)) : "", f2(cents(t.amount)), t.note]));
  if (kind === "month") {
    const R = month(), rows = [];
    GROUPS.forEach(g => { rows.push([g.name]); catsIn(g.key).forEach(c => { const r = R.cat[c.id], st = status(g.key, r.plan, r.act); rows.push([c.name, f2(r.plan), f2(r.act), f2(g.key === "income" ? r.act - r.plan : r.plan - r.act), st ? st[0] : ""]); }); const T = R.grp[g.key]; rows.push(["Total " + g.name.toLowerCase(), f2(T.plan), f2(T.act), f2(g.key === "income" ? T.act - T.plan : T.plan - T.act), ""]); });
    rows.push([], ["Left to budget (planned)", f2(R.toBudget)], ["Left over (actual)", f2(R.left)]);
    return out([mlabel(R.y, R.m), "Planned", "Actual", "Left / difference", "Status"], rows);
  }
  const Y = year(), r = (n, x) => [n, ...x.vals.map(f2), f2(x.tot), f2(x.avg), f2(x.budget), f2(x.left)];
  const rows = [...GROUPS.map(g => r(g.name, Y.groups[g.key])), r("Total out", Y.out), r("Left over", Y.left), []];
  GROUPS.forEach(g => { rows.push([g.name]); catsIn(g.key).forEach(c => rows.push(r(c.name, Y.cats[c.id]))); });
  return out([String(Y.y), ...MON, "Total", "Avg / month", "Yearly budget", "Left"], rows);
}
function download(name, text, type) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function exportCSV(kind) { const n = kind === "transactions" ? "transactions" : kind === "month" ? "budget-" + ymKey(VM.y, VM.m) : "year-" + VM.y; download("budget-planner-" + n + ".csv", "﻿" + csvText(kind), "text/csv"); toast("CSV downloaded"); }

}
function billDlg(id) {

   <div class="field"><label>Bill</label><input name="name" required value="${esc(b.name)}" placeholder="Rent, Phone, Netflix…"></div>
   <div class="two"><div class="field"><label>Amount</label><input name="amount" type="number" step="0.01" min="0" inputmode="decimal" required value="${b.amount}" style="font-weight:800"></div><div class="field"><label>Due day of the month</label><input name="day" type="number" min="1" max="31" step="1" required value="${b.day}"><small>31 = last day in short months</small></div></div>
   <div class="field"><label>Budget category (optional)</label><select name="cat"><option value="">None</option>${catOpts(b.cat)}</select></div>

   ${btns(!!id)}`, fd => {

  }, () => delWire("bills", id, "Bill", () => Object.values(S.paid).forEach(a => { const i = a.indexOf(id); if (i >= 0) a.splice(i, 1); })));
}
function goalDlg(id) {
  const g = S.goals.find(v => v.id === id) || { name: "", cat: (catsIn("savings")[0] || {}).id || "", target: "", date: "", before: 0 };
  openDlg(`<h2>${id ? "Edit goal" : "New savings goal"}</h2>
   <div class="field"><label>Goal</label><input name="name" required value="${esc(g.name)}" placeholder="Emergency fund"></div>
   <div class="field"><label>Savings category</label><select name="cat"><option value="">None</option>${catOpts(g.cat, "savings")}</select><small>Money you log in this category counts toward the goal. Add categories in Budget › Savings.</small></div>
   <div class="two"><div class="field"><label>Target</label><input name="target" type="number" step="0.01" min="1" inputmode="decimal" required value="${g.target}" style="font-weight:800"></div><div class="field"><label>Target date</label><input name="date" type="date" value="${g.date}"></div></div>
   <div class="field"><label>Already saved before</label><input name="before" type="number" step="0.01" min="0" inputmode="decimal" value="${g.before}"></div>
   <p class="hint" id="gPrev" style="margin:0 0 10px"></p>
   ${btns(!!id)}`, fd => {
    const o = { id: g.id || uid(), name: fd.get("name").trim(), cat: fd.get("cat"), target: r2(num(fd, "target")), date: fd.get("date"), before: r2(num(fd, "before")) };
    if (id) S.goals[S.goals.findIndex(v => v.id === id)] = o; else S.goals.push(o);
    toast(id ? "Goal updated" : o.name + " added");
  }, () => {
    const f = F(), p = document.getElementById("gPrev"), chk = () => { const G = goalInfo({ cat: f.cat.value, target: f.target.value, date: f.date.value, before: f.before.value });
      p.innerHTML = G.st === "saving" ? `Save <b>${mc(G.per)}</b> a month for ${G.monthsLeft} month${G.monthsLeft === 1 ? "" : "s"} (${mc(G.saved)} saved so far)` : G.st === "reached" ? "✓ Already reached" : G.st === "passed" ? "That date has passed" : "Add a target date to see how much to save each month"; };
    ["target", "date", "before"].forEach(k => f[k].oninput = chk); f.cat.onchange = chk; chk();
    delWire("goals", id, "Goal");
  });
}
function confirmDlg(title, text, ok, fn) {
  openDlg(`<h2>${title}</h2><p class="sub">${text}</p><div class="actions"><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn danger" value="ok">${ok}</button></div>`, () => false);
  F().onsubmit = e => { e.preventDefault(); D().close(); if (e.submitter && e.submitter.value === "ok") fn(); };
}

/* ---------- wiring ---------- */
function wire() {
  const pm = document.getElementById("prevM"), nm = document.getElementById("nextM");
  if (pm) pm.onclick = () => shiftMonth(-1); if (nm) nm.onclick = () => shiftMonth(1);
  M().querySelectorAll("[data-edittx]").forEach(b => b.onclick = () => txDlg(b.dataset.edittx));
  M().querySelectorAll("[data-editcat]").forEach(b => b.onclick = () => catDlg(b.dataset.editcat));
  M().querySelectorAll("[data-editbill]").forEach(b => b.onclick = () => billDlg(b.dataset.editbill));
  M().querySelectorAll("[data-editgoal]").forEach(b => b.onclick = () => goalDlg(b.dataset.editgoal));
  M().querySelectorAll("[data-go]").forEach(b => b.onclick = () => { if (b.dataset.go === "tx") TF = { cat: "_none", q: "" }; go(b.dataset.go); });
}
document.querySelectorAll(".navbtn").forEach(b => b.onclick = () => go(b.dataset.view));
document.getElementById("fab").onclick = () => VIEW === "bills" ? billDlg() : VIEW === "goals" ? goalDlg() : txDlg();
if (DEMO) {
  document.getElementById("demoBar").hidden = false; document.getElementById("buyLink").href = BUY_URL;
  // Demo: nothing is saved (reload = back to the sample) and backup/restore/CSV are only in the full app.
  try { localStorage.removeItem(KEY); } catch (e) {}
  save = function () {};
  document.addEventListener("click", ev => {
    const el = ev.target.closest("button, label, a, input[type=file]");
    if (el && el.id !== "buyLink" && /csv|backup|restore/i.test(el.textContent + " " + (el.id || ""))) {
      ev.preventDefault(); ev.stopPropagation(); toast("Backup, restore and CSV export are in the full app");
    }
  }, true);
}
window.__lp = { month, year, goalInfo, billStatus, billTotals, planned, status, csvText, sample, get VM() { return VM; }, set VM(v) { VM = v; }, get S() { return S; }, set S(v) { S = v; } };
go("home");
</script>
<script>/*mobile-actions-fix*/
(() => {
  const MQ = matchMedia("(max-width:860px)");
  const RARE = /\b(csv|export|print|pdf|clear sample|backup|restore|import)\b/i;
  const ADD = /(^|\s)\+|\b(add|new|log|record)\b/i;
  const main = document.getElementById("main"); if (!main) return;
  const txt = b => (b.textContent || "") + " " + (b.getAttribute("aria-label") || "");
  const vis = e => e && !e.hidden && getComputedStyle(e).display !== "none";
  let openMenu = null;
  function closeMenu(focus) {
    if (!openMenu) return; const m = openMenu; openMenu = null;
    m.menu.hidden = true; m.btn.setAttribute("aria-expanded", "false"); if (focus) m.btn.focus();
  }
  function items(m) { return [...m.querySelectorAll('[role="menuitem"]')].filter(vis); }
  function openM(w, i) {
    closeMenu(); const menu = w.querySelector(".mact-menu"), btn = w.querySelector(".mact-morebtn");
    menu.hidden = false; btn.setAttribute("aria-expanded", "true"); openMenu = { menu, btn };
    const it = items(menu); if (it.length) it[i < 0 ? it.length - 1 : 0].focus();
  }
  function head() {
    const h = main.firstElementChild;
    return h && (h.classList.contains("tablebar") || h.classList.contains("top")) ? h : null;
  }
  function apply() {
    const h = head(), mobile = MQ.matches;
    const hasAdd = !!h && [...h.querySelectorAll("button,a.btn")].some(b => vis(b) && ADD.test(txt(b)));
    document.documentElement.classList.toggle("mact-nofab", mobile && hasAdd);
    if (mobile && h && !h.dataset.mact) {
      h.dataset.mact = "1";
      const title = h.firstElementChild;
      const acts = [...h.querySelectorAll("button.btn,a.btn")].filter(b => !title.contains(b) && !b.closest(".mact-bar"));
      if (acts.length) {
        const pri = [...acts].reverse().find(b => !b.classList.contains("ghost") && !b.classList.contains("small"));
        const rest = acts.filter(b => b !== pri);
        let rare = rest.filter(b => RARE.test(txt(b)));
        if (rare.length < 2 || rare.length === rest.length && !pri) rare = [];
        const sec = rest.filter(b => !rare.includes(b));
        const bar = document.createElement("div"); bar.className = "mact-bar";
        if (pri) { pri.classList.add("mact-pri"); bar.append(pri); }
        if (sec.length || rare.length) {
          const g = document.createElement("div"); g.className = "mact-grid"; g.append(...sec);
          if (rare.length) {
            const w = document.createElement("div"); w.className = "mact-more";
            const id = "mactMenu" + Math.random().toString(36).slice(2, 7);
            w.innerHTML = `<button type="button" class="btn ghost mact-morebtn" aria-haspopup="menu" aria-expanded="false" aria-controls="${id}" aria-label="More actions">⋯ More</button><div class="mact-menu" id="${id}" role="menu" aria-label="More actions" hidden></div>`;
            const menu = w.lastElementChild;
            rare.forEach(b => { b.setAttribute("role", "menuitem"); b.tabIndex = -1; menu.append(b); });
            g.append(w);
          }
          bar.append(g);
        }
        const old = [...h.children].filter(c => c !== title && !c.children.length && !c.textContent.trim());
        title.after(bar); old.forEach(c => c.remove());
        h.classList.add("mact-head");
      }
    }
    pad();
  }
  function pad() {
    if (!MQ.matches) return;
    let top = innerHeight;
    document.querySelectorAll("body>*,.app>*").forEach(e => {
      if (e === main || e.tagName === "DIALOG" || !vis(e)) return;
      const cs = getComputedStyle(e); if (cs.position !== "fixed" || cs.pointerEvents === "none" || +cs.opacity === 0) return;
      const r = e.getBoundingClientRect(); if (r.height && r.top > innerHeight / 2) top = Math.min(top, r.top);
    });
    const pb = Math.max(96, Math.ceil(innerHeight - top + 16)) + "px";
    if (document.documentElement.style.getPropertyValue("--mact-pb") !== pb) document.documentElement.style.setProperty("--mact-pb", pb);
  }
  new MutationObserver(apply).observe(main, { childList: true });
  const fab = document.getElementById("fab");
  if (fab) new MutationObserver(pad).observe(fab, { attributes: true, attributeFilter: ["hidden", "style", "class"] });
  addEventListener("resize", pad);
  MQ.addEventListener("change", () => { closeMenu(); if (typeof render === "function") render(); else apply(); setTimeout(pad, 50); });
  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest(".mact-morebtn");
    if (b) { const w = b.parentElement; if (openMenu && openMenu.btn === b) closeMenu(); else openM(w, 0); return; }
    if (openMenu && !openMenu.menu.contains(e.target)) closeMenu();
    else if (openMenu && e.target.closest('[role="menuitem"]')) closeMenu();
  });
  document.addEventListener("keydown", e => {
    const b = e.target.closest && e.target.closest(".mact-morebtn");
    if (b && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); openM(b.parentElement, e.key === "ArrowUp" ? -1 : 0); return; }
    if (!openMenu) return;
    const it = items(openMenu.menu), i = it.indexOf(document.activeElement);
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeMenu(true); }
    else if (e.key === "Tab") closeMenu();
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const n = it.length; if (n) it[(i + (e.key === "ArrowDown" ? 1 : -1) + n) % n].focus(); }
    else if (e.key === "Home" || e.key === "End") { e.preventDefault(); if (it.length) it[e.key === "Home" ? 0 : it.length - 1].focus(); }
  }, true);
  apply(); addEventListener("load", pad); setTimeout(pad, 300);
})();
</script>

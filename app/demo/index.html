<body>
<div id="demoBar" class="demo" hidden>Demo with sample data · Nothing is saved: reload to start over · <a id="buyLink" href="#">Get the full app</a></div>
<div class="lp-brandbar" id="lpBrand" aria-hidden="true"></div>
<div class="app">
 <nav class="side" aria-label="Main">
  <div class="brand">Safe to Spend<small>by The Lemon Plans</small></div>
  <button class="navbtn" data-view="home"><span class="i">◎</span>Home</button>
  <button class="navbtn" data-view="bills"><span class="i">▤</span>Bills</button>
  <button class="navbtn" data-view="spending"><span class="i">⇣</span>Spending</button>
  <button class="navbtn" data-view="goals"><span class="i">★</span>Goals</button>
  <button class="navbtn" data-view="paychecks"><span class="i">▦</span>Paychecks</button>
  <button class="navbtn" data-view="settings"><span class="i">⚙</span>Settings</button>
 </nav>
 <button class="themetog" id="themeTog" type="button"></button>
 <main id="main" tabindex="-1"></main>
</div>
<button class="fab" id="fab" aria-label="Add spending" title="Add spending">+</button>
<dialog id="dlg"><form method="dialog" class="dlg" id="dlgForm"></form></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
const DEMO = true;
const BUY_URL = "https://thelemonplans.gumroad.com/l/safe-to-spend-budget-app";
const KEY = DEMO ? "lp-safe-to-spend-demo" : "lp-safe-to-spend-v1";
const DAY = 86400000;
const CATS = ["🛒 Groceries","⛽ Gas","🍔 Eating out","🏠 Home","🧸 Kids","💊 Health","🎉 Fun","👗 Shopping","🐾 Pets","🎁 Gifts","🚗 Transport","📦 Other"];
const BILLCATS = ["Housing","Utilities","Transportation","Insurance","Debt","Subscriptions","Phone & Internet","Health","Kids","Other"];

/* ---------- dates (local, no time zone surprises) ---------- */
const iso = d => { const z = new Date(d); return z.getFullYear() + "-" + String(z.getMonth() + 1).padStart(2, "0") + "-" + String(z.getDate()).padStart(2, "0"); };
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const dayIn = (y, m, d) => new Date(y, m, Math.min(d, dim(y, m)));
const fmtD = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
const fmtDW = d => d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });

/* ---------- state ---------- */
function blank() {
  return { v: 1, setup: false, currency: "$", theme: "light", accent: "green",
    pay: { freq: "biweekly", next: iso(addDays(today(), 7)), amount: 0, semi2: 15 },
    savingsPer: 0, bills: [], tx: [], goals: [], paid: {}, actual: {} };
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return s; } catch (e) {}
  return DEMO ? sample() : blank();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("Couldn't save in this browser"); } }
const uid = () => Math.random().toString(36).slice(2, 9);
let S = load();

function sample() {
  const s = blank(), t = today();
  s.setup = true;
  s.pay = { freq: "biweekly", next: iso(addDays(t, 6)), amount: 2200, semi2: 15 };
  s.savingsPer = 50;
  s.bills = [
    ["Rent", 1200, 1, "Housing", true], ["Car payment", 350, 5, "Transportation", true], ["Gym", 30, 8, "Health", true],
    ["Phone", 65, 12, "Phone & Internet", true], ["Internet", 70, 18, "Phone & Internet", false], ["Car insurance", 140, 20, "Insurance", true],
    ["Streaming", 15.99, 22, "Subscriptions", true], ["Credit card", 95, 25, "Debt", false], ["Electric", 110, 27, "Utilities", false]
  ].map(([name, amount, day, cat, auto]) => ({ id: uid(), name, amount, freq: "monthly", day, cat, auto }));
  s.goals = [
    { id: uid(), name: "Emergency fund", target: 3000, saved: 850, per: 75, emoji: "🛟" },
    { id: uid(), name: "Summer trip", target: 1200, saved: 300, per: 25, emoji: "🌴" }
  ];
  const p = periodOf(t, s);
  // keep the demo believable on any day: spending is ~40% of what this paycheck has left after bills and savings
  const bills = s.bills.reduce((a, b) => a + billDates(b, p.start, p.end).length * b.amount, 0);
  const plan = s.pay.amount - bills - 150, budget = Math.max(60, plan * 0.4);
  const items = [[0, .30, "🛒 Groceries", "Weekly groceries"], [1, .16, "⛽ Gas", ""], [2, .10, "🍔 Eating out", "Tacos"], [3, .08, "🎉 Fun", "Movie night"], [5, .22, "🛒 Groceries", ""], [6, .14, "🐾 Pets", "Dog food"]];
  billsPaidBefore(s, p, t);
  items.forEach(([o, f, c, n]) => { const d = addDays(p.start, o); if (d <= t) s.tx.push({ id: uid(), date: iso(d), amount: Math.round(budget * f * 100) / 100, cat: c, note: n, kind: "spend" }); });
  return s;
}

function billsPaidBefore(s, p, t) { s.bills.forEach(b => billDates(b, p.start, p.end).forEach(d => { if (d < t) s.paid[b.id + "|" + iso(d)] = 1; })); }
/* ---------- pay schedule ---------- */
function paydaysAround(ref, st = S, before = 3, after = 8) {
  const P = st.pay, anchor = parse(P.next), out = [];
  if (P.freq === "weekly" || P.freq === "biweekly") {
    const step = P.freq === "weekly" ? 7 : 14;
    const k = Math.floor((ref - anchor) / DAY / step);
    for (let i = k - before; i <= k + after; i++) out.push(addDays(anchor, i * step));
  } else if (P.freq === "semimonthly") {
    const d1 = anchor.getDate(), d2 = Number(P.semi2) || 15, a = Math.min(d1, d2), b = Math.max(d1, d2);
    for (let m = -before; m <= after; m++) {
      const y = ref.getFullYear(), mo = ref.getMonth() + m;
      out.push(dayIn(y, mo, a)); if (b !== a) out.push(dayIn(y, mo, b));
    }
  } else {
    const d1 = anchor.getDate();
    for (let m = -before; m <= after; m++) out.push(dayIn(ref.getFullYear(), ref.getMonth() + m, d1));
  }
  return out.sort((x, y) => x - y);
}
function periodOf(ref, st = S) {
  const pd = paydaysAround(ref, st);
  let start = pd[0], end = pd[1];
  for (let i = 0; i < pd.length - 1; i++) if (pd[i] <= ref && ref < pd[i + 1]) { start = pd[i]; end = pd[i + 1]; break; }
  return { start, end };
}
function nextPeriods(n) {
  const t = today(), pd = paydaysAround(t, S, 1, 14), out = [];
  for (let i = 0; i < pd.length - 1 && out.length < n; i++) if (pd[i + 1] > t) out.push({ start: pd[i], end: pd[i + 1] });
  return out;
}

/* ---------- bills in a period ---------- */
function billDates(b, start, end) {
  const out = [];
  if (b.freq === "monthly") {
    for (let m = -1; m <= 2; m++) { const d = dayIn(start.getFullYear(), start.getMonth() + m, b.day); if (d >= start && d < end) out.push(d); }
  } else if (b.freq === "weekly") {
    const a = parse(b.date || iso(start)); let k = Math.ceil((start - a) / DAY / 7); let d = addDays(a, k * 7);
    while (d < end) { if (d >= start) out.push(d); d = addDays(d, 7); }
  } else if (b.freq === "yearly") {
    const a = parse(b.date); for (const y of [start.getFullYear(), start.getFullYear() + 1]) { const d = dayIn(y, a.getMonth(), a.getDate()); if (d >= start && d < end) out.push(d); }
  } else if (b.freq === "once") {
    const d = parse(b.date); if (d >= start && d < end) out.push(d);
  }
  return out;
}
function dueIn(start, end) {
  const list = [];
  S.bills.forEach(b => billDates(b, start, end).forEach(d => list.push({ b, d, key: b.id + "|" + iso(d) })));
  return list.sort((x, y) => x.d - y.d);
}
const income = p => { const a = S.actual[iso(p.start)]; return a != null && a !== "" ? Number(a) : Number(S.pay.amount) || 0; };
const goalPer = () => S.goals.reduce((s, g) => s + (g.saved < g.target ? Number(g.per) || 0 : 0), 0);
const setAside = () => (Number(S.savingsPer) || 0) + goalPer();
function periodTx(p) { const a = iso(p.start), b = iso(p.end); return S.tx.filter(t => t.date >= a && t.date < b); }

function calc(p) {
  const due = dueIn(p.start, p.end), bills = due.reduce((s, x) => s + x.b.amount, 0);
  const tx = periodTx(p), spent = tx.filter(t => t.kind !== "extra").reduce((s, t) => s + t.amount, 0), extra = tx.filter(t => t.kind === "extra").reduce((s, t) => s + t.amount, 0);
  const inc = income(p), aside = setAside(), plan = inc + extra - bills - aside, safe = plan - spent;
  const t = today(), daysLeft = Math.max(1, Math.round((p.end - (t > p.start ? t : p.start)) / DAY));
  return { due, bills, spent, extra, inc, aside, plan, safe, daysLeft, perDay: safe / daysLeft, unpaid: due.filter(x => !S.paid[x.key]) };
}
const status = (v, inc) => v < 0 ? "short" : (v < Math.max(50, inc * 0.05) ? "tight" : "ok");
const statusText = (v, inc) => ({ ok: "On track", tight: "Tight", short: "Short by " + money(-v) })[status(v, inc)];

/* ---------- formatting ---------- */
function money(v, dec) {
  const n = Math.round(Math.abs(v) * 100) / 100, neg = v < 0 && n > 0 ? "-" : "";
  const d = dec ?? (Math.round(n * 100) % 100 ? 2 : 0);
  return neg + S.currency + n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
}

   <div class="field"><label>Category</label><select name="cat">${BILLCATS.map(c => `<option ${b.cat === c ? "selected" : ""}>${c}</option>`).join("")}</select></div></div>
   <label style="display:flex;gap:10px;align-items:center;margin-bottom:10px;font-weight:650"><input type="checkbox" name="auto" ${b.auto ? "checked" : ""} style="width:20px;height:20px"> Autopay</label>
   ${btns(!!id)}`, fd => {
    const o = { id: b.id || uid(), name: fd.get("name").trim(), amount: +fd.get("amount") || 0, freq: fd.get("freq"), day: +fd.get("day") || 1, date: fd.get("date"), cat: fd.get("cat"), auto: !!fd.get("auto") };
    if (id) S.bills[S.bills.findIndex(x => x.id === id)] = o; else S.bills.push(o); toast(id ? "Bill updated" : "Bill added");
  }, () => {
    const sync = () => { const v = F().freq.value; document.getElementById("fDay").hidden = v !== "monthly"; document.getElementById("fDate").hidden = v === "monthly"; };
    F().freq.onchange = sync; sync();
    const del = document.getElementById("delBtn"); if (del) del.onclick = () => { S.bills = S.bills.filter(x => x.id !== id); save(); D().close(); render(); toast("Bill deleted"); };
  });
}
function txDlg(id, kind) {
  const t = S.tx.find(x => x.id === id) || { amount: "", cat: CATS[0], note: "", date: iso(today()), kind: kind || "spend" };
  const extra = t.kind === "extra";
  openDlg(`<h2>${id ? "Edit" : extra ? "Add extra money" : "Add spending"}</h2>
   <div class="field"><label>Amount</label><input name="amount" type="number" step="0.01" min="0" inputmode="decimal" required value="${t.amount}" style="font-size:28px;font-weight:800"></div>
   ${extra ? "" : `<div class="field"><label>Category</label><div class="chips">${CATS.map(c => `<button type="button" class="chip" data-cat="${esc(c)}" aria-pressed="${t.cat === c}">${esc(c)}</button>`).join("")}</div><input type="hidden" name="cat" value="${esc(t.cat)}"></div>`}
   <div class="two"><div class="field"><label>Date</label><input name="date" type="date" value="${t.date}"></div><div class="field"><label>Note (optional)</label><input name="note" value="${esc(t.note)}" placeholder="${extra ? "Side job, refund…" : "Target, gas…"}"></div></div>
   ${btns(!!id)}`, fd => {
    const o = { id: t.id || uid(), amount: Math.abs(+fd.get("amount")) || 0, cat: fd.get("cat") || t.cat, note: fd.get("note").trim(), date: fd.get("date") || iso(today()), kind: t.kind };
    if (!o.amount) { toast("Enter an amount"); return false; }
    if (id) S.tx[S.tx.findIndex(x => x.id === id)] = o; else S.tx.push(o); toast(extra ? "Added" : "Logged");
  }, () => {
    F().querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { F().cat.value = b.dataset.cat; F().querySelectorAll("[data-cat]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    const del = document.getElementById("delBtn"); if (del) del.onclick = () => { S.tx = S.tx.filter(x => x.id !== id); save(); D().close(); render(); toast("Deleted"); };
  });
}
function goalDlg(id) {
  const g = S.goals.find(x => x.id === id) || { name: "", target: "", saved: 0, per: "", emoji: "🎯" };
  openDlg(`<h2>${id ? "Edit goal" : "Add a goal"}</h2>
   <div class="two"><div class="field"><label>Name</label><input name="name" required value="${esc(g.name)}" placeholder="Emergency fund"></div><div class="field"><label>Emoji</label><input name="emoji" maxlength="4" value="${esc(g.emoji)}"></div></div>
   <div class="two"><div class="field"><label>Target</label><input name="target" type="number" step="0.01" min="0" required value="${g.target}"></div><div class="field"><label>Saved so far</label><input name="saved" type="number" step="0.01" min="0" value="${g.saved}"></div></div>
   <div class="field"><label>Set aside per paycheck</label><input name="per" type="number" step="0.01" min="0" value="${g.per}"></div>
   ${btns(!!id)}`, fd => {
    const o = { id: g.id || uid(), name: fd.get("name").trim(), emoji: fd.get("emoji") || "🎯", target: +fd.get("target") || 0, saved: +fd.get("saved") || 0, per: +fd.get("per") || 0 };
    if (id) S.goals[S.goals.findIndex(x => x.id === id)] = o; else S.goals.push(o); toast(id ? "Goal updated" : "Goal added");
  }, () => { const del = document.getElementById("delBtn"); if (del) del.onclick = () => { S.goals = S.goals.filter(x => x.id !== id); save(); D().close(); render(); toast("Goal deleted"); }; });
}
function addToGoal(id) {
  const g = S.goals.find(x => x.id === id);
  openDlg(`<h2>Add to ${esc(g.name)}</h2><div class="field"><label>Amount you moved to savings</label><input name="amt" type="number" step="0.01" min="0" required value="${g.per || ""}" style="font-size:28px;font-weight:800"></div>${btns(false)}`,
    fd => { g.saved = Math.round((g.saved + (+fd.get("amt") || 0)) * 100) / 100; toast(g.saved >= g.target ? "Goal reached! 🎉" : "Nice, " + money(g.target - g.saved) + " to go"); });
}
function actualDlg(ds) {
  const cur = S.actual[ds];
  openDlg(`<h2>Paycheck of ${fmtD(parse(ds))}</h2><p class="sub" style="margin-bottom:12px">Leave empty to use your usual ${money(S.pay.amount)}.</p>
   <div class="field"><label>Actual take-home</label><input name="v" type="number" step="0.01" min="0" value="${cur ?? ""}"></div>${btns(false)}`,
    fd => { const v = fd.get("v"); if (v === "") delete S.actual[ds]; else S.actual[ds] = +v; });
}
function confirmDlg(title, text, ok, fn) {
  openDlg(`<h2>${title}</h2><p class="sub">${text}</p><div class="actions"><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn danger" value="ok">${ok}</button></div>`, () => { fn(); return false; });
  F().onsubmit = e => { e.preventDefault(); D().close(); if (e.submitter && e.submitter.value === "ok") fn(); };
}

/* ---------- wiring ---------- */
function wire() {
  M().querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  M().querySelectorAll("[data-paid]").forEach(b => b.onclick = () => { const k = b.dataset.paid; if (S.paid[k]) delete S.paid[k]; else S.paid[k] = 1; save(); render(); });
  M().querySelectorAll("[data-editbill]").forEach(b => b.onclick = () => billDlg(b.dataset.editbill));
  M().querySelectorAll("[data-edittx]").forEach(b => b.onclick = () => txDlg(b.dataset.edittx));
  M().querySelectorAll("[data-editgoal]").forEach(b => b.onclick = () => goalDlg(b.dataset.editgoal));
  M().querySelectorAll("[data-addgoal]").forEach(b => b.onclick = () => addToGoal(b.dataset.addgoal));
  M().querySelectorAll("[data-actual]").forEach(b => b.onclick = () => actualDlg(b.dataset.actual));
}
document.querySelectorAll(".navbtn").forEach(b => b.onclick = () => go(b.dataset.view));
document.getElementById("fab").onclick = () => S.setup ? txDlg() : toast("Finish the 3 setup questions first");
if (DEMO) {
  document.getElementById("demoBar").hidden = false; document.getElementById("buyLink").href = BUY_URL;
  // Demo: nothing is saved (reload = back to the sample) and backup/restore/CSV are only in the full app.
  try { localStorage.removeItem(KEY); } catch (e) {}
  save = function () {};
  document.addEventListener("click", ev => {
    const el = ev.target.closest("button, label, a, input[type=file]");
    if (el && el.id !== "buyLink" && /csv|backup|restore/i.test(el.textContent + " " + (el.id || ""))) {
      ev.preventDefault(); ev.stopPropagation(); toast("Backup, restore and CSV export are in the full app");
    }
  }, true);
}
window.__lp = { calc, periodOf, nextPeriods, dueIn, get S() { return S; } };
go("home");
</script>
<script>/*mobile-actions-fix*/
(() => {
  const MQ = matchMedia("(max-width:860px)");
  const RARE = /\b(csv|export|print|pdf|clear sample|backup|restore|import)\b/i;
  const ADD = /(^|\s)\+|\b(add|new|log|record)\b/i;
  const main = document.getElementById("main"); if (!main) return;
  const txt = b => (b.textContent || "") + " " + (b.getAttribute("aria-label") || "");
  const vis = e => e && !e.hidden && getComputedStyle(e).display !== "none";
  let openMenu = null;
  function closeMenu(focus) {
    if (!openMenu) return; const m = openMenu; openMenu = null;
    m.menu.hidden = true; m.btn.setAttribute("aria-expanded", "false"); if (focus) m.btn.focus();
  }
  function items(m) { return [...m.querySelectorAll('[role="menuitem"]')].filter(vis); }
  function openM(w, i) {
    closeMenu(); const menu = w.querySelector(".mact-menu"), btn = w.querySelector(".mact-morebtn");
    menu.hidden = false; btn.setAttribute("aria-expanded", "true"); openMenu = { menu, btn };
    const it = items(menu); if (it.length) it[i < 0 ? it.length - 1 : 0].focus();
  }
  function head() {
    const h = main.firstElementChild;
    return h && (h.classList.contains("tablebar") || h.classList.contains("top")) ? h : null;
  }
  function apply() {
    const h = head(), mobile = MQ.matches;
    const hasAdd = !!h && [...h.querySelectorAll("button,a.btn")].some(b => vis(b) && ADD.test(txt(b)));
    document.documentElement.classList.toggle("mact-nofab", mobile && hasAdd);
    if (mobile && h && !h.dataset.mact) {
      h.dataset.mact = "1";
      const title = h.firstElementChild;
      const acts = [...h.querySelectorAll("button.btn,a.btn")].filter(b => !title.contains(b) && !b.closest(".mact-bar"));
      if (acts.length) {
        const pri = [...acts].reverse().find(b => !b.classList.contains("ghost") && !b.classList.contains("small"));
        const rest = acts.filter(b => b !== pri);
        let rare = rest.filter(b => RARE.test(txt(b)));
        if (rare.length < 2 || rare.length === rest.length && !pri) rare = [];
        const sec = rest.filter(b => !rare.includes(b));
        const bar = document.createElement("div"); bar.className = "mact-bar";
        if (pri) { pri.classList.add("mact-pri"); bar.append(pri); }
        if (sec.length || rare.length) {
          const g = document.createElement("div"); g.className = "mact-grid"; g.append(...sec);
          if (rare.length) {
            const w = document.createElement("div"); w.className = "mact-more";
            const id = "mactMenu" + Math.random().toString(36).slice(2, 7);
            w.innerHTML = `<button type="button" class="btn ghost mact-morebtn" aria-haspopup="menu" aria-expanded="false" aria-controls="${id}" aria-label="More actions">⋯ More</button><div class="mact-menu" id="${id}" role="menu" aria-label="More actions" hidden></div>`;
            const menu = w.lastElementChild;
            rare.forEach(b => { b.setAttribute("role", "menuitem"); b.tabIndex = -1; menu.append(b); });
            g.append(w);
          }
          bar.append(g);
        }
        const old = [...h.children].filter(c => c !== title && !c.children.length && !c.textContent.trim());
        title.after(bar); old.forEach(c => c.remove());
        h.classList.add("mact-head");
      }
    }
    pad();
  }
  function pad() {
    if (!MQ.matches) return;
    let top = innerHeight;
    document.querySelectorAll("body>*,.app>*").forEach(e => {
      if (e === main || e.tagName === "DIALOG" || !vis(e)) return;
      const cs = getComputedStyle(e); if (cs.position !== "fixed" || cs.pointerEvents === "none" || +cs.opacity === 0) return;
      const r = e.getBoundingClientRect(); if (r.height && r.top > innerHeight / 2) top = Math.min(top, r.top);
    });
    const pb = Math.max(96, Math.ceil(innerHeight - top + 16)) + "px";
    if (document.documentElement.style.getPropertyValue("--mact-pb") !== pb) document.documentElement.style.setProperty("--mact-pb", pb);
  }
  new MutationObserver(apply).observe(main, { childList: true });
  const fab = document.getElementById("fab");
  if (fab) new MutationObserver(pad).observe(fab, { attributes: true, attributeFilter: ["hidden", "style", "class"] });
  addEventListener("resize", pad);
  MQ.addEventListener("change", () => { closeMenu(); if (typeof render === "function") render(); else apply(); setTimeout(pad, 50); });
  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest(".mact-morebtn");
    if (b) { const w = b.parentElement; if (openMenu && openMenu.btn === b) closeMenu(); else openM(w, 0); return; }
    if (openMenu && !openMenu.menu.contains(e.target)) closeMenu();
    else if (openMenu && e.target.closest('[role="menuitem"]')) closeMenu();
  });
  document.addEventListener("keydown", e => {
    const b = e.target.closest && e.target.closest(".mact-morebtn");
    if (b && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); openM(b.parentElement, e.key === "ArrowUp" ? -1 : 0); return; }
    if (!openMenu) return;
    const it = items(openMenu.menu), i = it.indexOf(document.activeElement);
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeMenu(true); }
    else if (e.key === "Tab") closeMenu();
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const n = it.length; if (n) it[(i + (e.key === "ArrowDown" ? 1 : -1) + n) % n].focus(); }
    else if (e.key === "Home" || e.key === "End") { e.preventDefault(); if (it.length) it[e.key === "Home" ? 0 : it.length - 1].focus(); }
  }, true);
  apply(); addEventListener("load", pad); setTimeout(pad, 300);
})();
</script>

<script>
"use strict";
const DEMO = true;
const BUY_URL = "https://thelemonplans.gumroad.com/l/savings-goals-app";
const KEY = DEMO ? "lp-savings-goals-demo" : "lp-savings-goals-v1";
const EMOJI = ["💰", "🛟", "🏝️", "✈️", "🎄", "🎁", "🚗", "🏠", "🎓", "💻", "💍", "👶", "🐾", "🩺", "🛡️", "🎉"];
const FREQ = { weekly: "Every week", biweekly: "Every 2 weeks", semimonthly: "Twice a month", monthly: "Once a month" };
const KIND = { goal: "Savings goal", sinking: "Sinking fund" };

/* ---------- dates (local calendar days, ISO yyyy-mm-dd) ---------- */
const iso = d => { const z = new Date(d); return z.getFullYear() + "-" + String(z.getMonth() + 1).padStart(2, "0") + "-" + String(z.getDate()).padStart(2, "0"); };
const parse = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const addMonths = (d, n) => { const t = new Date(d.getFullYear(), d.getMonth() + n, 1), last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate(); return new Date(t.getFullYear(), t.getMonth(), Math.min(d.getDate(), last)); };
const dayDiff = (a, b) => Math.round((b - a) / 86400000); // calendar days from a to b
// Whole calendar months from a to b (Jan 15 → Mar 14 is 1 month, → Mar 15 is 2)
const monthsBetween = (a, b) => (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth() - (b.getDate() < a.getDate() ? 1 : 0);
const fmtD = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const fmtM = d => d.toLocaleDateString("en-US", { month: "short", year: "numeric" });

/* ---------- state ---------- */
function blank() {
  return { v: 1, app: "savings-goals", currency: "$", theme: "auto", accent: "lagoon", freq: "biweekly", goals: [], tx: [],
    c52: { step: 1, reverse: false, done: [] }, c100: { mult: 1, done: [] },
    ef: { months: 6, goal: null, costs: [["Rent or mortgage", 0], ["Utilities", 0], ["Groceries", 0], ["Insurance", 0], ["Transportation", 0], ["Phone & internet", 0], ["Minimum debt payments", 0], ["Other must-pays", 0]].map(([name, amount]) => ({ name, amount })) } };
}
function valid(s) { return s && s.v === 1 && s.app === "savings-goals" && Array.isArray(s.goals) && Array.isArray(s.tx); }
function normalize(s) {
  const b = blank(), o = Object.assign(b, s);
  o.c52 = Object.assign(blank().c52, s.c52 || {}); o.c100 = Object.assign(blank().c100, s.c100 || {}); o.ef = Object.assign(blank().ef, s.ef || {});
  if (!Array.isArray(o.c52.done)) o.c52.done = []; if (!Array.isArray(o.c100.done)) o.c100.done = []; if (!Array.isArray(o.ef.costs)) o.ef.costs = [];
  return o;
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (valid(s)) return normalize(s); } catch (e) {}
  return DEMO ? sample() : blank();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("Couldn't save in this browser"); } }
const uid = () => Math.random().toString(36).slice(2, 9);
let S = load();

function sample() {
  const s = blank(), t = today(), m = n => iso(addMonths(t, n)), ago = n => iso(addDays(t, -n));
  s.goals = [
    ["Emergency Fund", "goal", "🛟", 10485, m(14), 2400, ago(150)],
    ["Hawaii Trip", "goal", "🏝️", 4200, m(9), 300, ago(120)],
    ["Christmas 2027", "sinking", "🎄", 1200, iso(new Date(t.getFullYear() + 1, 11, 1)), 0, ago(90)],
    ["Car Insurance", "sinking", "🚗", 960, m(5), 120, ago(100)],
    ["New Laptop", "goal", "💻", 1400, m(4), 0, ago(60)],
    ["Home Down Payment", "goal", "🏠", 30000, m(48), 6500, ago(150)]
  ].map(([name, kind, emoji, target, date, start, created]) => ({ id: uid(), name, kind, emoji, target, date, start, created }));
  const id = n => s.goals.find(g => g.name === n).id;
  const plan = [["Emergency Fund", 400, "Monthly transfer"], ["Hawaii Trip", 210, "Monthly transfer"], ["Christmas 2027", 70, ""], ["Car Insurance", 95, "Auto-save"], ["New Laptop", 240, ""], ["Home Down Payment", 450, "Monthly transfer"]];
  for (let k = 4; k >= 0; k--) plan.forEach(([n, a, note], j) => { if (n === "New Laptop" && k > 1) return; if (n === "Christmas 2027" && k > 2) return; s.tx.push({ id: uid(), goal: id(n), amount: a, date: ago(k * 30 + 2 + j), note }); });
  s.tx.push({ id: uid(), goal: id("Emergency Fund"), amount: 600, date: ago(48), note: "Tax refund" });
  s.tx.push({ id: uid(), goal: id("Emergency Fund"), amount: -420, date: ago(20), note: "Vet bill" });
  s.tx.push({ id: uid(), goal: id("Hawaii Trip"), amount: 150, date: ago(9), note: "Sold old bike" });
  s.c52.done = Array.from({ length: 30 }, (_, i) => i + 1);
  s.c100.done = [3, 7, 12, 15, 18, 21, 25, 28, 30, 33, 37, 40, 42, 45, 50, 52, 55, 58, 61, 64, 66, 70, 73, 75, 77, 80, 84, 88, 90, 93, 95, 99];
  s.ef = { months: 3, goal: id("Emergency Fund"), costs: [["Rent or mortgage", 1500], ["Utilities", 220], ["Groceries", 550], ["Insurance", 180], ["Transportation", 300], ["Phone & internet", 120], ["Minimum debt payments", 525], ["Other must-pays", 100]].map(([name, amount]) => ({ name, amount })) };
  return s;
}

/* ---------- the math (whole cents; amounts to save are rounded UP to the cent so you never fall short) ---------- */
const cents = v => Math.round((Number(v) || 0) * 100);
const ceilDiv = (a, b) => Math.ceil(a / b - 1e-9);
const savedOf = (g, tx = S.tx) => cents(g.start) + tx.filter(t => t.goal === g.id).reduce((s, t) => s + cents(t.amount), 0);
// How many paychecks land in `days` days (from today, today excluded) for each pay frequency
function paychecks(freq, days, months) {
  if (freq === "weekly") return Math.floor(days / 7);
  if (freq === "biweekly") return Math.floor(days / 14);
  if (freq === "semimonthly") return months * 2 + (days - months * 30.44 >= 15 ? 1 : 0);
  return months;
}
// g: {target, date, start, created}; saved in cents; now: Date. Everything returned in cents.
function needs(g, saved, now, freq) {
  const target = cents(g.target), left = Math.max(0, target - saved), r = { target, saved, left, reached: target > 0 && saved >= target, pct: target > 0 ? Math.max(0, Math.min(1, saved / target)) : 0 };
  if (!g.date) return Object.assign(r, { status: target <= 0 ? "none" : r.reached ? "reached" : "nodate" });
  const end = parse(g.date), days = dayDiff(now, end), months = Math.max(0, monthsBetween(now, end));
  r.days = days; r.months = months; r.weeks = Math.max(0, Math.floor(days / 7)); r.pays = Math.max(0, paychecks(freq, Math.max(0, days), months));
  if (r.reached || left === 0) { r.perMonth = r.perWeek = r.perPay = 0; r.status = target <= 0 ? "none" : "reached"; return r; }
  if (days < 0) { r.perMonth = r.perWeek = r.perPay = left; r.status = "past"; return r; }
  r.perMonth = ceilDiv(left, Math.max(1, months)); r.perWeek = ceilDiv(left, Math.max(1, r.weeks)); r.perPay = ceilDiv(left, Math.max(1, r.pays));
  // On track = at least where you'd be saving evenly from the start date to the target date
  const st = parse(g.created || iso(now)), span = dayDiff(st, end), frac = span <= 0 ? 1 : Math.max(0, Math.min(1, dayDiff(st, now) / span));
  const base = cents(g.start), expected = Math.round(base + (target - base) * frac);
  r.expected = expected; r.behind = Math.max(0, expected - saved);
  r.status = saved >= expected - 50 ? "ontrack" : "behind";
  return r;
}
const info = g => needs(g, savedOf(g), today(), S.freq);
const c52Amount = (w, st = S.c52) => cents(st.step) * (st.reverse ? 53 - w : w);
const c52Total = (st = S.c52) => cents(st.step) * 1378;
const c52Saved = (st = S.c52) => st.done.reduce((s, w) => s + c52Amount(w, st), 0);
const c100Total = (st = S.c100) => cents(st.mult) * 5050;

/* ---------- formatting ---------- */
function money(v, dec) {

}
const mc = (c, dec) => money(c / 100, dec);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

}

/* ---------- visuals ---------- */
let _jid = 0;
function jarSVG(pct, size = 120, label = true) {
  const id = "j" + (++_jid), h = size * 1.2, p = Math.max(0, Math.min(1, pct)), top = 22, bot = 136, lv = bot - (bot - top) * p;
  const body = "M22 30 Q22 22 30 22 L70 22 Q78 22 78 30 L78 34 Q86 40 86 52 L86 124 Q86 136 74 136 L26 136 Q14 136 14 124 L14 52 Q14 40 22 34 Z";
  return `<svg class="jar" viewBox="0 0 100 144" width="${size}" height="${h}" role="img" aria-label="${Math.round(p * 100)}% saved"><defs><clipPath id="${id}"><path d="${body}"/></clipPath></defs>
   <path class="glass" d="${body}"/><g clip-path="url(#${id})"><path class="liq" d="M0 ${lv} Q25 ${lv - 4} 50 ${lv} T100 ${lv} V144 H0 Z"/></g>
   <rect class="lid" x="24" y="10" width="52" height="13" rx="4"/><rect class="shine" x="20" y="56" width="6" height="50" rx="3"/>
   ${label ? `<text class="pct" x="50" y="92" text-anchor="middle">${Math.round(p * 100)}%</text>` : ""}</svg>`;
}
function ringSVG(pct, big, small, size = 132) {
  const r = 52, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct));
  return `<svg class="ring" viewBox="0 0 132 132" width="${size}" height="${size}" role="img" aria-label="${Math.round(p * 100)}% done"><circle class="tr" cx="66" cy="66" r="${r}"/><circle class="pr" cx="66" cy="66" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - p)).toFixed(1)}" transform="rotate(-90 66 66)"/><text x="66" y="70" text-anchor="middle">${big}</text><text class="rs" x="66" y="90" text-anchor="middle">${small}</text></svg>`;
}

  M().querySelectorAll("[data-e]").forEach(x => x.onclick = () => { const n = +x.dataset.e, i = b.done.indexOf(n); if (i < 0) b.done.push(n); else b.done.splice(i, 1); b.done.sort((p, q) => p - q); if (PICK === n) PICK = null; save(); render(); if (i < 0 && b.done.length === 100) toast("All 100 envelopes! 🎉"); });
  const f = document.getElementById("c52f"); f.onchange = () => { a.step = Math.max(0.01, Math.round((+f.step.value || 1) * 100) / 100); a.reverse = f.order.value === "r"; save(); render(); };
  f.onsubmit = e => { e.preventDefault(); f.onchange(); };
  const g = document.getElementById("c100f"); g.mult.onchange = () => { b.mult = +g.mult.value || 1; save(); render(); };
  document.getElementById("pick").onclick = () => { const left = Array.from({ length: 100 }, (_, i) => i + 1).filter(n => !b.done.includes(n)); if (!left.length) return toast("Every envelope is done 🎉"); PICK = left[Math.floor(Math.random() * left.length)]; render(); toast("Envelope " + PICK + ": save " + mc(PICK * cents(b.mult))); };
  document.getElementById("r52").onclick = () => confirmDlg("Reset the 52-week challenge?", "This unticks all 52 weeks.", "Reset", () => { a.done = []; save(); render(); });
  document.getElementById("r100").onclick = () => confirmDlg("Reset the 100 envelopes?", "This unticks all 100 envelopes.", "Reset", () => { b.done = []; PICK = null; save(); render(); });
}

  M().querySelectorAll("[data-delcost]").forEach(b => b.onclick = () => { read(); ef.costs.splice(+b.dataset.delcost, 1); save(); render(); });
  M().querySelectorAll("[data-months]").forEach(b => b.onclick = () => { read(); ef.months = +b.dataset.months; save(); render(); });
  document.getElementById("efGoal").onchange = e => { ef.goal = e.target.value || null; save(); render(); };
  const u = document.getElementById("useTarget"); if (u) u.onclick = () => { g.target = tgt / 100; save(); render(); toast(g.name + " target updated"); };
  const mk = document.getElementById("mkGoal"); if (mk) mk.onclick = () => { const n = { id: uid(), name: "Emergency Fund", kind: "goal", emoji: "🛟", target: tgt / 100, date: iso(addMonths(today(), 12)), start: 0, created: iso(today()) }; S.goals.push(n); ef.goal = n.id; save(); render(); toast("Emergency Fund goal created"); };
}
const costRow = (c, i) => `<div class="costrow"><input name="cname" value="${esc(c.name)}" placeholder="Cost" aria-label="Cost name"><input name="camount" type="number" min="0" step="0.01" inputmode="decimal" value="${c.amount || ""}" placeholder="0" aria-label="${esc(c.name || "Cost")} per month"><button type="button" class="icon" data-delcost="${i}" aria-label="Remove ${esc(c.name || "cost")}">✕</button></div>`;

/* ---------- CSV ---------- */
const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v), f2 = c => (c / 100).toFixed(2);
function csvText(kind) {
  if (kind === "goals") {
    const L = [["Goal", "Type", "Target", "Saved", "Left", "Target date", "Save per month", "Save per week", "Save per paycheck", "Status"].join(",")];
    S.goals.forEach(g => { const r = info(g), open = r.status === "ontrack" || r.status === "behind" || r.status === "past"; L.push([g.name, KIND[g.kind] || KIND.goal, f2(r.target), f2(r.saved), f2(r.left), g.date || "", open ? f2(r.perMonth) : "0.00", open ? f2(r.perWeek) : "0.00", open ? f2(r.perPay) : "0.00", statusText(r)].map(q).join(",")); });
    return L.join("\r\n") + "\r\n";
  }
  const L = [["Date", "Goal", "Type", "Amount", "Balance after", "Note"].join(",")], run = {};
  S.goals.forEach(g => run[g.id] = cents(g.start));
  S.tx.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(t => { run[t.goal] = (run[t.goal] || 0) + cents(t.amount); L.push([t.date, goalName(t.goal), t.amount < 0 ? "Withdrawal" : "Deposit", f2(cents(t.amount)), f2(run[t.goal]), t.note || ""].map(q).join(",")); });
  return L.join("\r\n") + "\r\n";
}
function download(name, text, type) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function exportCSV(kind) { download("savings-" + kind + "-" + iso(today()) + ".csv", "﻿" + csvText(kind), "text/csv"); toast("CSV downloaded"); }

/* ---------- dialogs ---------- */
const D = () => document.getElementById("dlg"), F = () => document.getElementById("dlgForm");
function openDlg(html, onSubmit, after) {
  F().innerHTML = html; F().onsubmit = e => { if (e.submitter && e.submitter.value === "cancel") return; e.preventDefault(); if (onSubmit(new FormData(F())) !== false) { D().close(); save(); render(); } };
  D().showModal(); after && after(); const first = F().querySelector("input:not([type=hidden]):not([type=radio]),select"); first && first.focus();
}
const btns = del => `<div class="actions">${del ? `<button type="button" class="btn danger" id="delBtn" style="margin-right:auto">Delete</button>` : ""}<button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn" value="ok">Save</button></div>`;

function goalDlg(id) {
  const g = goalOf(id) || { name: "", kind: "goal", emoji: "💰", target: "", date: iso(addMonths(today(), 12)), start: "", created: iso(today()) };
  openDlg(`<h2>${id ? "Edit goal" : "Add a goal"}</h2>
   <div class="field"><label>Name</label><input name="name" required value="${esc(g.name)}" placeholder="Emergency fund, vacation, Christmas…"></div>
   <div class="field"><span class="fl">Type</span><div class="seg"><label><input type="radio" name="kind" value="goal" ${g.kind !== "sinking" ? "checked" : ""}>Savings goal</label><label><input type="radio" name="kind" value="sinking" ${g.kind === "sinking" ? "checked" : ""}>Sinking fund</label></div></div>
   <div class="two"><div class="field"><label>Target amount</label><input name="target" type="number" step="0.01" min="1" inputmode="decimal" required value="${g.target}"></div>
   <div class="field"><label>Target date</label><input name="date" type="date" required value="${g.date}"></div></div>
   <div class="two"><div class="field"><label>Already saved</label><input name="start" type="number" step="0.01" min="0" inputmode="decimal" value="${g.start}" placeholder="0"></div>
   <div class="field"><label>Started saving on</label><input name="created" type="date" value="${g.created || iso(today())}"></div></div>
   <div class="field"><span class="fl">Icon</span><div class="emopick">${EMOJI.map(e => `<label><input type="radio" name="emoji" value="${e}" ${g.emoji === e ? "checked" : ""}><span>${e}</span></label>`).join("")}</div></div>
   <p id="gprev" class="hint" style="margin:0 0 10px"></p>
   ${btns(!!id)}`, fd => {
    const o = Object.assign({}, g, { id: g.id || uid(), name: fd.get("name").trim() || "Goal", kind: fd.get("kind") === "sinking" ? "sinking" : "goal", emoji: fd.get("emoji") || "💰", target: Math.max(0, +fd.get("target") || 0), date: fd.get("date") || "", start: Math.max(0, +fd.get("start") || 0), created: fd.get("created") || iso(today()) });
    if (id) S.goals[S.goals.findIndex(x => x.id === id)] = o; else S.goals.push(o);
    toast(id ? "Goal updated" : "Goal added");
  }, () => {
    const f = F(), p = document.getElementById("gprev");
    const chk = () => { const tmp = { id: g.id || "_new", target: +f.target.value || 0, date: f.date.value, start: +f.start.value || 0, created: f.created.value };
      if (!tmp.target || !tmp.date) { p.textContent = "Enter a target and a date to see how much to save."; return; }
      const r = needs(tmp, savedOf(tmp), today(), S.freq);
      p.innerHTML = r.status === "reached" ? "🎉 Already reached." : r.status === "past" ? "⚠ That date has passed. Pick a future date." : `Save <b>${mc(r.perMonth)}</b> a month, <b>${mc(r.perWeek)}</b> a week or <b>${mc(r.perPay)}</b> a paycheck.`; };
    ["target", "date", "start", "created"].forEach(n => f[n].oninput = chk); chk();
    const del = document.getElementById("delBtn"); if (del) del.onclick = () => { D().close(); const n = S.tx.filter(t => t.goal === id).length; confirmDlg("Delete " + esc(g.name) + "?", `This also deletes its ${plural(n, "deposit")} and withdrawals. It can't be undone.`, "Delete", () => { S.goals = S.goals.filter(x => x.id !== id); S.tx = S.tx.filter(t => t.goal !== id); if (S.ef.goal === id) S.ef.goal = null; save(); go("goals"); toast("Goal deleted"); }); };
  });
}
function txDlg(id, goal, kind) {
  if (!S.goals.length) { toast("Add a goal first"); goalDlg(); return; }
  const t = S.tx.find(x => x.id === id) || { goal: goal || (VIEW === "goal" ? GID : S.goals[0].id), amount: "", date: iso(today()), note: "" };
  const k = id ? (t.amount < 0 ? "withdraw" : "deposit") : kind || "deposit";
  openDlg(`<h2>${id ? "Edit" : k === "withdraw" ? "Withdraw" : "Add a deposit"}</h2>
   <div class="field"><span class="fl">Type</span><div class="seg"><label><input type="radio" name="kind" value="deposit" ${k === "deposit" ? "checked" : ""}>+ Deposit</label><label><input type="radio" name="kind" value="withdraw" ${k === "withdraw" ? "checked" : ""}>− Withdraw</label></div></div>
   <div class="field"><label>Goal</label><select name="goal">${S.goals.map(g => `<option value="${g.id}" ${t.goal === g.id ? "selected" : ""}>${esc(g.emoji || "")} ${esc(g.name)} (${mc(savedOf(g))})</option>`).join("")}</select></div>
   <div class="field"><label>Amount</label><input name="amount" type="number" step="0.01" min="0.01" inputmode="decimal" required value="${t.amount === "" ? "" : Math.abs(t.amount)}" style="font-size:28px;font-weight:800"></div>
   <div class="two"><div class="field"><label>Date</label><input name="date" type="date" value="${t.date}"></div><div class="field"><label>Note (optional)</label><input name="note" value="${esc(t.note)}" placeholder="Payday, tax refund…"></div></div>
   ${btns(!!id)}`, fd => {
    const amt = cents(Math.abs(+fd.get("amount") || 0)), w = fd.get("kind") === "withdraw", gid = fd.get("goal");
    if (!amt) { toast("Enter an amount"); return false; }
    const o = { id: t.id || uid(), goal: gid, amount: (w ? -amt : amt) / 100, date: fd.get("date") || iso(today()), note: fd.get("note").trim() };
    const others = S.tx.filter(x => x.id !== o.id), g = goalOf(gid), bal = savedOf(g, others);
    if (w && amt > bal) { toast("Only " + mc(bal) + " in " + g.name); return false; }
    if (id) S.tx[S.tx.findIndex(x => x.id === id)] = o; else S.tx.push(o);
    const r = info(g); toast(w ? "Withdrawal saved" : r.reached ? g.name + " reached! 🎉" : "Deposit saved");
  }, () => { const del = document.getElementById("delBtn"); if (del) del.onclick = () => { S.tx = S.tx.filter(x => x.id !== id); save(); D().close(); render(); toast("Deleted"); }; });
}
function confirmDlg(title, text, ok, fn) {
  openDlg(`<h2>${title}</h2><p class="sub">${text}</p><div class="actions"><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn danger" value="ok">${ok}</button></div>`, () => false);
  F().onsubmit = e => { e.preventDefault(); D().close(); if (e.submitter && e.submitter.value === "ok") fn(); };
}

  M().querySelectorAll("[data-editgoal]").forEach(b => b.onclick = e => { e.stopPropagation(); goalDlg(b.dataset.editgoal); });

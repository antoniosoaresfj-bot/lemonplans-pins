.brand em{color:var(--accent)}
.brand small{display:block;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-weight:600;font-size:12px;color:var(--muted);margin-top:4px}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 12px;border-radius:14px;cursor:pointer;font-weight:650;color:var(--muted);text-align:left;min-height:46px}
.navbtn svg{width:21px;height:21px;flex:none}
.navbtn[aria-current="page"]{background:var(--soft);color:var(--accent)}
main{padding:28px 32px 120px;max-width:1080px;width:100%;min-width:0}
main:focus{outline:none}
h1{font-family:var(--serif);font-size:32px;line-height:1.15;margin:0 0 4px;color:var(--deep);font-weight:700}
h1 em{color:var(--accent)}
h2{font-size:18px;margin:0 0 12px;letter-spacing:-.2px}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.lab{font-size:11.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--serif);font-size:40px;font-weight:700;line-height:1.05;margin:6px 0 2px;color:var(--deep)}
.meta{font-size:13.5px;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top .sub{margin:0}
@media (min-width:861px){.top,.dayrow{padding-right:56px}}
.pick{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px}
.pick button{border:0;background:var(--soft);border-radius:12px;width:44px;height:44px;cursor:pointer;font-size:20px;font-weight:800;line-height:1;color:var(--accent)}
.pick button:disabled{opacity:.35;cursor:default}
.pick b{min-width:150px;text-align:center;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;min-height:46px;font-weight:800;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.small{padding:8px 13px;min-height:38px;border-radius:12px;font-size:14px}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.icon{border:0;background:var(--soft);border-radius:12px;width:42px;height:42px;cursor:pointer;display:grid;place-items:center;font-size:15px;flex:none;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-weight:750;font-size:12.5px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--goodbg);color:var(--good)}
.hint{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:22px 10px}
.foot{color:var(--muted);font-size:12px;margin-top:30px}
/* today */
.dayrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ringcard{display:flex;align-items:center;gap:18px}
.ring{flex:none}.ring circle{fill:none;stroke-width:10}.ring .tr{stroke:var(--h0)}.ring .pr{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .3s}
.ring text{fill:var(--deep);font-family:var(--serif);font-weight:700;font-size:24px}
.hlist{display:grid;gap:10px;margin-top:14px}
.hrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;min-height:72px;cursor:pointer;box-shadow:var(--shadow);touch-action:manipulation}
.hrow .chk{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--fill);display:grid;place-items:center;flex:none;font-size:22px;font-weight:900;color:transparent;transition:background .15s,border-color .15s}
.hrow[aria-pressed="true"]{background:var(--soft);border-color:var(--fill)}
.hrow[aria-pressed="true"] .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hrow .t{flex:1;min-width:0}
.hrow .n{font-weight:750;font-size:16.5px;line-height:1.3;overflow-wrap:anywhere}
.hrow[aria-pressed="true"] .n{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--fill)}
.hrow .n,.hrow .m{display:block}.hrow .m{font-size:13px;color:var(--muted);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.hrow .tiny{display:block;font-size:13px;line-height:1.35;color:var(--accent);margin-top:3px;font-weight:600}
.hrow .st{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--accent);text-align:center;min-width:46px;line-height:1}
.hrow .st small{display:block;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;margin-top:3px}
.area{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
textarea{width:100%;min-height:84px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:12px 14px;resize:vertical}
textarea:focus,.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px}
/* month grid */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
table.mg{border-collapse:separate;border-spacing:3px;font-size:12.5px}
table.mg th{font-size:11px;color:var(--muted);font-weight:700;padding:2px 0;text-align:center;min-width:32px}
table.mg th.we{color:var(--accent)}
table.mg th.now{background:var(--accent);color:var(--accent-ink);border-radius:8px}
table.mg td.hn,table.mg th.hn{position:sticky;left:0;background:var(--card);z-index:2;text-align:left;min-width:150px;max-width:170px;padding-right:8px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.mg td.hn small{display:block;font-weight:700;color:var(--accent);font-size:11.5px}
table.mg td.x{text-align:center;font-weight:800;padding:0 6px;white-space:nowrap}
table.mg td.x.p{color:var(--accent)}
.c{width:32px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;padding:0;font-weight:900;color:var(--accent-ink);font-size:15px;touch-action:manipulation}
.c.on{background:var(--accent);border-color:var(--accent)}
.c:disabled{cursor:default;opacity:.35}
.c.off{background:transparent;border-style:dashed;opacity:.5}
/* year */
.cals{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.cal b{display:block;font-size:13px;margin-bottom:6px}
.cal .d{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .d i{display:block;aspect-ratio:1;border-radius:4px;background:var(--h0)}
.cal .d i.e{background:transparent}
.cal .d i.l1{background:var(--h1)}.cal .d i.l2{background:var(--h2)}.cal .d i.l3{background:var(--h3)}.cal .d i.l4{background:var(--h4)}
.cal .d i.fu{background:transparent;border:1px dashed var(--line)}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700;margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:7px 6px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;max-width:190px;overflow:hidden;text-overflow:ellipsis}
table.t thead th{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
table.t td.hv{border-radius:6px;font-weight:750}
.hv.l0{background:var(--h0)}.hv.l1{background:var(--h1)}.hv.l2{background:var(--h2)}.hv.l3{background:var(--h3);color:#2B1E23}.hv.l4{background:var(--h4);color:#fff}
:root[data-theme="dark"] .hv.l3,:root[data-theme="dark"] .hv.l4{color:#1A0F14}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:150px;margin-top:8px}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--muted);font-weight:700;min-width:0}
.bars i{display:block;width:100%;max-width:34px;background:var(--fill);border-radius:7px 7px 3px 3px;min-height:2px}
.bars div.now i{background:var(--accent)}
.kv>span[style]{display:block}
.bar{display:block;height:9px;border-radius:999px;background:var(--h0);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:9px 0;gap:10px;border-bottom:1px solid var(--line)}.kv:last-child{border-bottom:0}
.kv b{white-space:nowrap}
/* week */
.stars{display:flex;gap:6px}
.stars button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:22px;cursor:pointer;color:var(--fill);line-height:1}
.stars button[aria-pressed="true"]{color:var(--accent);background:var(--soft);border-color:var(--fill)}
.ci{padding:12px 0;border-bottom:1px solid var(--line)}.ci:last-child{border-bottom:0}
/* habits */
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:700;overflow-wrap:anywhere}
.ideas{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.idea{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.idea:last-child{border-bottom:0}
.idea .grow{flex:1;min-width:0}
.idea small{display:block;color:var(--muted);font-size:13px}
/* dialogs and forms */
dialog{border:0;border-radius:24px;padding:0;background:var(--card);color:var(--ink);width:min(520px,94vw);box-shadow:0 30px 80px rgba(40,10,25,.35);max-height:92vh}
dialog::backdrop{background:rgba(30,12,20,.45)}
.dlg{padding:22px}
.field{display:grid;gap:5px;margin-bottom:12px;min-width:0}
.field label,.field .fl{font-size:13px;font-weight:750;color:var(--muted)}
.field input,.field select{width:100%;padding:11px 13px;border-radius:13px;border:1px solid var(--line);background:var(--bg);min-width:0}
/*field-fix*/.field{align-content:start}.field input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=color]),.field select{height:48px;line-height:1.25}.field input[type=date]{display:block;min-width:0}
/*field-fix-2*/@supports (grid-template-rows:subgrid){.two>.field{grid-row:span 3;grid-template-rows:subgrid;row-gap:6px}}
.field small{color:var(--muted);font-size:12.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:650;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tpw{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.tpw .chip{padding:8px 0;text-align:center}
.locknote{color:var(--accent)!important}
.demo{background:var(--soft);color:var(--deep);padding:10px 16px;text-align:center;font-weight:700;font-size:14px;border-bottom:1px solid var(--line)}
.demo a{color:var(--accent)}
.wmbox{position:relative;overflow:hidden}
.isdemo .wmbox::after{content:"DEMO · thelemonplans.com";position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:clamp(20px,4vw,42px);letter-spacing:.06em;color:var(--accent);opacity:.13;transform:rotate(-14deg);pointer-events:none;z-index:4;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 12px 10px 18px;border-radius:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:92vw;display:flex;align-items:center;gap:12px}
.toast.show{opacity:1}
.toast.has-undo{pointer-events:auto}
.toast button{border:0;background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 12px;font-weight:800;cursor:pointer;min-height:36px}
.toast:not(.has-undo){padding-right:18px}
.datanote{border-color:var(--fill);background:var(--soft)}
.datanote h2{font-family:var(--serif);font-size:22px;color:var(--deep)}
.datanote p{margin:0 0 12px}
main>.datanote:first-child,main>.bkbar:first-child{margin-top:46px}
.bkbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 14px;margin-bottom:14px;font-size:14px;color:var(--muted)}
.bkbar b{color:var(--ink)}
.fab{position:fixed;right:26px;bottom:26px;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:32px;font-weight:600;box-shadow:0 12px 30px rgba(110,37,70,.3);cursor:pointer;z-index:20}
.app{position:relative}
.themetog{position:absolute;top:22px;right:28px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer;z-index:10;padding:0;transition:color .15s,border-color .15s}
.themetog:hover,.themetog:focus-visible{color:var(--ink);border-color:var(--muted)}
.themetog svg{width:18px;height:18px;display:block}
main h1{padding-right:48px}
@media (max-width:860px){.themetog{top:14px;right:14px;width:36px;height:36px}}
@media (min-width:861px){main>.tablebar:first-child{padding-right:52px}}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.cals{grid-template-columns:repeat(3,1fr)}}
@media (max-width:860px){
 .app{grid-template-columns:1fr}
 nav.side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;z-index:30;display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:var(--card)}
 .brand{display:none}
 .navbtn{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 1px;justify-content:center;align-items:center;text-align:center;min-width:0;min-height:54px}

 table.mg td.hn,table.mg th.hn{min-width:112px;max-width:120px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

 #main{padding-bottom:var(--mact-pb,180px)!important}

  background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.18)}

.mtick small{font-size:12.5px;color:var(--muted);font-weight:600}
.mrow.on .mtick{background:var(--soft);border-color:var(--fill)}
.mrow.on .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.whys{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.whys li{display:flex;gap:10px;align-items:flex-start}
.whys li b{flex:none;color:var(--accent);font-size:12px;letter-spacing:.6px;text-transform:uppercase;margin-top:3px;min-width:46px}
.ift{display:grid;gap:8px}
.ift div{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:15px}
.ift b{color:var(--accent)}
.conf{display:flex;gap:4px;flex-wrap:wrap}
.conf i{width:16px;height:16px;border-radius:6px;background:var(--h0);display:block}
.conf i.on{background:var(--accent)}
.steps{display:grid;gap:8px}
.qtabs,.ptabs{margin-bottom:14px}
.qsum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.qsum .card{padding:14px}
.qsum .card.now{border-color:var(--accent);border-width:2px}
.rate{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rate:last-of-type{border-bottom:0}
.rate .an{font-weight:700;overflow-wrap:anywhere;min-width:0}
.dots5{display:flex;gap:6px}
.dots5 button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:800;cursor:pointer;color:var(--muted);touch-action:manipulation}
.dots5 button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent)}
.chart text{fill:var(--muted);font-size:14px;font-weight:700}
.chart .vl{fill:var(--deep);font-size:15px;font-weight:800}
table.ht{border-collapse:separate;border-spacing:3px;font-size:12.5px;width:100%}
table.ht th{font-size:11px;color:var(--muted);font-weight:700;padding:2px 0;text-align:center}
table.ht td{text-align:center;border-radius:7px;height:30px;font-weight:800;min-width:28px}
table.ht td.hn{text-align:left;font-weight:700;position:sticky;left:0;background:var(--card);z-index:1;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.r0{background:var(--h0);color:transparent}.r1{background:var(--h0)}.r2{background:var(--h1)}.r3{background:var(--h2)}.r4{background:var(--h3);color:#2B1E23}.r5{background:var(--h4);color:#fff}
:root[data-theme="dark"] .r4,:root[data-theme="dark"] .r5{color:#1A0F14}
.past{padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}.past:last-child{border-bottom:0}
.past b{color:var(--deep)}
.plist{display:grid;gap:8px}
.prow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;color:inherit;min-height:60px;touch-action:manipulation}
.prow.now{border:2px solid var(--accent)}
.prow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.prow .d{font-size:12.5px;font-weight:800;color:var(--accent);letter-spacing:.3px}
.prow .p{font-weight:600;overflow-wrap:anywhere;line-height:1.4}
.prow .st{flex:none;font-size:12.5px;font-weight:800;color:var(--muted);padding-top:2px;white-space:nowrap}
.prow.done .st{color:var(--good)}
.prow .ans{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.qcard textarea{min-height:70px}
.qg{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.month3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.month3 .field{margin-bottom:0}
.dlg textarea{min-height:120px}
dialog{overflow:auto}
@media (max-width:860px){
 .qsum{grid-template-columns:1fr 1fr}
 .month3{grid-template-columns:1fr}
 .prompt .q{font-size:21px}
 .wordcard .wd{font-size:38px}
 .dots5{gap:4px}.dots5 button{width:40px;height:44px}
 .rate{grid-template-columns:1fr}
 .grid.keep2{grid-template-columns:1fr 1fr}.keep2 .big{font-size:30px}
}

.brand .lp-more{display:block;margin-top:6px;font-weight:600;opacity:.8}

  color:var(--muted);letter-spacing:.1px;min-width:0}
 .lp-brandbar .lp-lemon{width:18px;height:18px;flex:none}
 .lp-brandbar b{color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
 .lp-brandbar a{color:inherit;text-decoration:none;white-space:nowrap;padding:10px 0;flex:none}
 .lp-brandbar a:hover,.lp-brandbar a:focus-visible{text-decoration:underline}

}
@media print{.lp-brandbar{display:none!important}}

function csvText(kind) {

<script>/*mobile-actions-fix*/
(() => {
  const MQ = matchMedia("(max-width:860px)");
  const RARE = /\b(csv|export|print|pdf|clear sample|backup|restore|import)\b/i;
  const ADD = /(^|\s)\+|\b(add|new|log|record)\b/i;
  const main = document.getElementById("main"); if (!main) return;
  const txt = b => (b.textContent || "") + " " + (b.getAttribute("aria-label") || "");
  const vis = e => e && !e.hidden && getComputedStyle(e).display !== "none";
  let openMenu = null;
  function closeMenu(focus) {
    if (!openMenu) return; const m = openMenu; openMenu = null;
    m.menu.hidden = true; m.btn.setAttribute("aria-expanded", "false"); if (focus) m.btn.focus();
  }
  function items(m) { return [...m.querySelectorAll('[role="menuitem"]')].filter(vis); }
  function openM(w, i) {
    closeMenu(); const menu = w.querySelector(".mact-menu"), btn = w.querySelector(".mact-morebtn");
    menu.hidden = false; btn.setAttribute("aria-expanded", "true"); openMenu = { menu, btn };
    const it = items(menu); if (it.length) it[i < 0 ? it.length - 1 : 0].focus();
  }
  function head() {
    const h = main.firstElementChild;
    return h && (h.classList.contains("tablebar") || h.classList.contains("top")) ? h : null;
  }
  function apply() {
    const h = head(), mobile = MQ.matches;
    const hasAdd = !!h && [...h.querySelectorAll("button,a.btn")].some(b => vis(b) && ADD.test(txt(b)));
    document.documentElement.classList.toggle("mact-nofab", mobile && hasAdd);
    if (mobile && h && !h.dataset.mact) {
      h.dataset.mact = "1";
      const title = h.firstElementChild;
      const acts = [...h.querySelectorAll("button.btn,a.btn")].filter(b => !title.contains(b) && !b.closest(".mact-bar"));
      if (acts.length) {
        const pri = [...acts].reverse().find(b => !b.classList.contains("ghost") && !b.classList.contains("small"));
        const rest = acts.filter(b => b !== pri);
        let rare = rest.filter(b => RARE.test(txt(b)));
        if (rare.length < 2 || rare.length === rest.length && !pri) rare = [];
        const sec = rest.filter(b => !rare.includes(b));
        const bar = document.createElement("div"); bar.className = "mact-bar";
        if (pri) { pri.classList.add("mact-pri"); bar.append(pri); }
        if (sec.length || rare.length) {
          const g = document.createElement("div"); g.className = "mact-grid"; g.append(...sec);
          if (rare.length) {
            const w = document.createElement("div"); w.className = "mact-more";
            const id = "mactMenu" + Math.random().toString(36).slice(2, 7);
            w.innerHTML = `<button type="button" class="btn ghost mact-morebtn" aria-haspopup="menu" aria-expanded="false" aria-controls="${id}" aria-label="More actions">⋯ More</button><div class="mact-menu" id="${id}" role="menu" aria-label="More actions" hidden></div>`;
            const menu = w.lastElementChild;
            rare.forEach(b => { b.setAttribute("role", "menuitem"); b.tabIndex = -1; menu.append(b); });
            g.append(w);
          }
          bar.append(g);
        }
        const old = [...h.children].filter(c => c !== title && !c.children.length && !c.textContent.trim());
        title.after(bar); old.forEach(c => c.remove());
        h.classList.add("mact-head");
      }
    }
    pad();
  }
  function pad() {
    if (!MQ.matches) return;
    let top = innerHeight;
    document.querySelectorAll("body>*,.app>*").forEach(e => {
      if (e === main || e.tagName === "DIALOG" || !vis(e)) return;
      const cs = getComputedStyle(e); if (cs.position !== "fixed" || cs.pointerEvents === "none" || +cs.opacity === 0) return;
      const r = e.getBoundingClientRect(); if (r.height && r.top > innerHeight / 2) top = Math.min(top, r.top);
    });
    const pb = Math.max(96, Math.ceil(innerHeight - top + 16)) + "px";
    if (document.documentElement.style.getPropertyValue("--mact-pb") !== pb) document.documentElement.style.setProperty("--mact-pb", pb);
  }
  new MutationObserver(apply).observe(main, { childList: true });
  const fab = document.getElementById("fab");
  if (fab) new MutationObserver(pad).observe(fab, { attributes: true, attributeFilter: ["hidden", "style", "class"] });
  addEventListener("resize", pad);
  MQ.addEventListener("change", () => { closeMenu(); if (typeof render === "function") render(); else apply(); setTimeout(pad, 50); });
  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest(".mact-morebtn");
    if (b) { const w = b.parentElement; if (openMenu && openMenu.btn === b) closeMenu(); else openM(w, 0); return; }
    if (openMenu && !openMenu.menu.contains(e.target)) closeMenu();
    else if (openMenu && e.target.closest('[role="menuitem"]')) closeMenu();
  });
  document.addEventListener("keydown", e => {
    const b = e.target.closest && e.target.closest(".mact-morebtn");
    if (b && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); openM(b.parentElement, e.key === "ArrowUp" ? -1 : 0); return; }
    if (!openMenu) return;
    const it = items(openMenu.menu), i = it.indexOf(document.activeElement);
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeMenu(true); }
    else if (e.key === "Tab") closeMenu();
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const n = it.length; if (n) it[(i + (e.key === "ArrowDown" ? 1 : -1) + n) % n].focus(); }
    else if (e.key === "Home" || e.key === "End") { e.preventDefault(); if (it.length) it[e.key === "Home" ? 0 : it.length - 1].focus(); }
  }, true);
  apply(); addEventListener("load", pad); setTimeout(pad, 300);
})();
</script>

  }

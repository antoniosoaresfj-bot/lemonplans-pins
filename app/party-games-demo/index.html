html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav.side{padding:24px 12px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:var(--bg)}
.brand{font-family:var(--serif);font-weight:700;font-size:21px;padding:0 12px 20px;line-height:1.15;color:var(--deep)}
.brand em{color:var(--accent)}
.brand small{display:block;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-weight:600;font-size:12px;color:var(--muted);margin-top:4px}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 12px;border-radius:14px;cursor:pointer;font-weight:650;color:var(--muted);text-align:left;min-height:46px}
.navbtn svg{width:21px;height:21px;flex:none}
.navbtn[aria-current="page"]{background:var(--soft);color:var(--accent)}
main{padding:28px 32px 120px;max-width:1080px;width:100%;min-width:0}
main:focus{outline:none}
h1{font-family:var(--serif);font-size:32px;line-height:1.15;margin:0 0 4px;color:var(--deep);font-weight:700}
h1 em{color:var(--accent)}
h2{font-size:18px;margin:0 0 12px;letter-spacing:-.2px}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.lab{font-size:11.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--serif);font-size:40px;font-weight:700;line-height:1.05;margin:6px 0 2px;color:var(--deep)}
.meta{font-size:13.5px;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top .sub{margin:0}
@media (min-width:861px){.top,.dayrow{padding-right:56px}}
.pick{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px}
.pick button{border:0;background:var(--soft);border-radius:12px;width:44px;height:44px;cursor:pointer;font-size:20px;font-weight:800;line-height:1;color:var(--accent)}
.pick button:disabled{opacity:.35;cursor:default}
.pick b{min-width:150px;text-align:center;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;min-height:46px;font-weight:800;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.small{padding:8px 13px;min-height:38px;border-radius:12px;font-size:14px}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.icon{border:0;background:var(--soft);border-radius:12px;width:42px;height:42px;cursor:pointer;display:grid;place-items:center;font-size:15px;flex:none;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-weight:750;font-size:12.5px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--goodbg);color:var(--good)}
.hint{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:22px 10px}
.foot{color:var(--muted);font-size:12px;margin-top:30px}
/* dialogs and forms */
dialog{border:0;border-radius:24px;padding:0;background:var(--card);color:var(--ink);width:min(520px,94vw);box-shadow:0 30px 80px rgba(40,10,25,.35);max-height:92vh}
dialog::backdrop{background:rgba(30,12,20,.45)}
.dlg{padding:22px}
.field{display:grid;gap:5px;margin-bottom:12px;min-width:0}
.field label,.field .fl{font-size:13px;font-weight:750;color:var(--muted)}
.field input,.field select{width:100%;padding:11px 13px;border-radius:13px;border:1px solid var(--line);background:var(--bg);min-width:0}
/*field-fix*/.field{align-content:start}.field input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=color]),.field select{height:48px;line-height:1.25}.field input[type=date]{display:block;min-width:0}
/*field-fix-2*/@supports (grid-template-rows:subgrid){.two>.field{grid-row:span 3;grid-template-rows:subgrid;row-gap:6px}}
.field small{color:var(--muted);font-size:12.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:650;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tpw{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.tpw .chip{padding:8px 0;text-align:center}
.locknote{color:var(--accent)!important}
.demo{background:var(--soft);color:var(--deep);padding:10px 16px;text-align:center;font-weight:700;font-size:14px;border-bottom:1px solid var(--line)}
.demo a{color:var(--accent)}
.wmbox{position:relative;overflow:hidden}
.isdemo .wmbox::after{content:"DEMO · thelemonplans.com";position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:clamp(20px,4vw,42px);letter-spacing:.06em;color:var(--accent);opacity:.13;transform:rotate(-14deg);pointer-events:none;z-index:4;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 12px 10px 18px;border-radius:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:92vw;display:flex;align-items:center;gap:12px}
.toast.show{opacity:1}
.toast.has-undo{pointer-events:auto}
.toast button{border:0;background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 12px;font-weight:800;cursor:pointer;min-height:36px}
.toast:not(.has-undo){padding-right:18px}
.datanote{border-color:var(--fill);background:var(--soft)}
.datanote h2{font-family:var(--serif);font-size:22px;color:var(--deep)}
.datanote p{margin:0 0 12px}
main>.datanote:first-child,main>.bkbar:first-child{margin-top:46px}
.bkbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 14px;margin-bottom:14px;font-size:14px;color:var(--muted)}
.bkbar b{color:var(--ink)}
.fab{position:fixed;right:26px;bottom:26px;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:32px;font-weight:600;box-shadow:0 12px 30px rgba(110,37,70,.3);cursor:pointer;z-index:20}
.app{position:relative}
.themetog{position:absolute;top:22px;right:28px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer;z-index:10;padding:0;transition:color .15s,border-color .15s}
.themetog:hover,.themetog:focus-visible{color:var(--ink);border-color:var(--muted)}
.themetog svg{width:18px;height:18px;display:block}
main h1{padding-right:48px}
@media (max-width:860px){.themetog{top:14px;right:14px;width:36px;height:36px}}
@media (min-width:861px){main>.tablebar:first-child{padding-right:52px}}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.cals{grid-template-columns:repeat(3,1fr)}}
@media (max-width:860px){
 .app{grid-template-columns:1fr}
 nav.side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;z-index:30;display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:var(--card)}
 .brand{display:none}
 .navbtn{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 1px;justify-content:center;align-items:center;text-align:center;min-width:0;min-height:54px}
 main{padding:18px 14px 150px}
 h1{font-size:27px}
 .g2,.g3,.ideas{grid-template-columns:1fr}
 .big{font-size:34px}
 .fab{bottom:88px;right:16px}
 .toast{bottom:150px}
 .card{padding:15px}
 .pick b{min-width:0;flex:1}
 .pick{width:100%}
 .dayrow .pick{order:2}
 .cals{grid-template-columns:repeat(2,1fr)}
 .bars{gap:3px}
 table.mg td.hn,table.mg th.hn{min-width:112px;max-width:120px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/*mobile-actions-fix*/
@media (max-width:860px){
 #main{padding-bottom:var(--mact-pb,180px)!important}
 html.mact-nofab .fab{display:none!important}
 .mact-head{display:block!important;padding-right:0!important}
 .mact-bar{display:grid;gap:8px;margin-top:14px;width:100%}
 .mact-bar .btn{width:100%;min-height:44px;margin:0;white-space:normal;text-align:center;line-height:1.2}
 .mact-bar>.mact-pri{min-height:50px;font-size:16px}
 .mact-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .mact-grid>:last-child:nth-child(odd){grid-column:1/-1}
 .mact-more{position:relative;display:grid}
 .mact-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;display:grid;gap:2px;padding:6px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.18)}
 .mact-menu[hidden]{display:none}
 .mact-menu .btn{background:transparent;justify-content:flex-start;text-align:left;border-radius:10px}
 .mact-menu .btn:hover,.mact-menu .btn:focus-visible{background:var(--soft)}
}
/*lp-brand*/
.lp-brandbar{display:none}
.brand .lp-lemon{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:5px}
.brand .lp-lemon svg,.lp-brandbar svg{width:100%;height:100%;display:block}
.brand small a{color:inherit;text-decoration:none}
.brand small a:hover,.brand small a:focus-visible{text-decoration:underline}
.brand .lp-more{display:block;margin-top:6px;font-weight:600;opacity:.8}
@media (max-width:860px){
 .lp-brandbar{display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;padding:6px 16px 0 18px;font:600 13px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--muted);letter-spacing:.1px;min-width:0}
 .lp-brandbar .lp-lemon{width:18px;height:18px;flex:none}
 .lp-brandbar b{color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
 .lp-brandbar a{color:inherit;text-decoration:none;white-space:nowrap;padding:10px 0;flex:none}
 .lp-brandbar a:hover,.lp-brandbar a:focus-visible{text-decoration:underline}
 .lp-brandbar .lp-more{margin-left:auto;padding-left:10px;color:var(--ink);opacity:.75}
 .lp-brandbar .lp-more:first-child,.lp-brandbar b{max-width:calc(100% - 140px)}
}
@media print{.lp-brandbar{display:none!important}}
/* party games */
.navbtn .dot{display:none}
.navsep{height:1px;background:var(--line);margin:8px 12px}
.party{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.partybtn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:2px solid var(--line);border-radius:24px;padding:22px;min-height:150px;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.partybtn b{font-family:var(--serif);font-size:28px;line-height:1.1}
.partybtn span{color:var(--muted);font-size:14.5px}
.partybtn.x{background:linear-gradient(135deg,#FCE8E6,#FFF8F3 60%,#E4F0E8);border-color:#F2A7AE}.partybtn.x b{color:#B3243B}
.partybtn.n{background:linear-gradient(135deg,#E9ECFA,#FBF8F1 60%,#F8EED3);border-color:#D9C891}.partybtn.n b{color:#2E3A87}
:root[data-theme="dark"] .partybtn.x,:root[data-theme="dark"] .partybtn.n{background:var(--card)}
:root[data-theme="dark"] .partybtn.x b{color:#F28B9A}:root[data-theme="dark"] .partybtn.n b{color:#E7C46E}
.partybtn .em{font-size:34px;line-height:1}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.game{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:var(--shadow);min-height:118px;touch-action:manipulation}
.game:hover,.game:focus-visible{border-color:var(--fill)}
.game .ic{font-size:28px;line-height:1}
.game b{font-size:17px;line-height:1.25}
.game small{color:var(--muted);font-size:13.5px;line-height:1.35}
.guests{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.gchip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:4px 4px 4px 13px;font-weight:700;font-size:14.5px;min-height:40px}
.gchip button{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:17px;line-height:1}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;padding:11px 13px;border-radius:13px;border:1px solid var(--line);background:var(--bg);height:48px}
.addrow .btn{flex:none}
.stagebtn{white-space:nowrap}
.bigq{font-family:var(--serif);font-weight:700;font-size:clamp(24px,3.6vw,46px);line-height:1.2;color:var(--deep);margin:8px 0 6px;overflow-wrap:anywhere}
.ans{font-size:clamp(20px,2.6vw,32px);font-weight:800;color:var(--good);background:var(--goodbg);border-radius:16px;padding:14px 18px;margin:12px 0}
.qmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-weight:700;font-size:14px}
.tring{position:relative;width:92px;height:92px;flex:none}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring circle{fill:none;stroke-width:9}.tring .tr{stroke:var(--soft)}.tring .pr{stroke:var(--accent);stroke-linecap:round}
.tring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:30px;color:var(--deep)}
.tring.low .pr{stroke:var(--bad)}.tring.low b{color:var(--bad)}
.qtop{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.team{border:2px solid var(--line);border-radius:18px;padding:12px;background:var(--card);cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:64px;color:var(--ink);touch-action:manipulation}
.team b{font-size:15.5px;overflow-wrap:anywhere}.team span{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--accent)}
.team[aria-pressed="true"]{border-color:var(--good);background:var(--goodbg)}
.team[aria-pressed="true"] b::before{content:"✓ ";color:var(--good)}
.score{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.score:last-child{border-bottom:0}
.score .pos{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--muted);width:36px;text-align:center}
.score .nm{flex:1;font-weight:800;font-size:18px;min-width:0;overflow-wrap:anywhere}
.score .pts{font-family:var(--serif);font-weight:700;font-size:30px;color:var(--accent)}
.score.win .pos{color:var(--gold)}
.callbig{font-family:var(--serif);font-weight:700;font-size:clamp(54px,11vw,150px);line-height:1;color:var(--accent);text-align:center;margin:10px 0;overflow-wrap:anywhere}
.callbig small{display:block;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;color:var(--muted);font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.calls{display:flex;flex-wrap:wrap;gap:6px}
.calls span{background:var(--soft);border-radius:10px;padding:5px 10px;font-weight:700;font-size:13.5px}
.calls span.last{background:var(--accent);color:var(--accent-ink)}
.bgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:520px}
.bgrid div{border:1.5px solid var(--line);border-radius:10px;min-height:58px;display:grid;place-items:center;text-align:center;font-size:12.5px;font-weight:700;padding:3px;overflow-wrap:anywhere;line-height:1.15}
.bgrid div.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bgrid div.free{background:var(--goldbg);color:var(--gold);border-color:var(--gold)}
.bgrid div.line{outline:3px solid var(--gold);outline-offset:-3px}
.bingo-yes{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--good)}
.bingo-no{font-weight:800;color:var(--muted)}
.secret{border:2px dashed var(--fill);background:var(--soft);border-radius:24px;padding:28px 20px;text-align:center}
.secret .who{font-family:var(--serif);font-size:clamp(36px,7vw,64px);font-weight:700;color:var(--accent);line-height:1.1;margin:10px 0;overflow-wrap:anywhere}
.revbtn{width:100%;min-height:140px;font-size:22px;border-radius:24px;flex-direction:column;white-space:normal}
.revbtn .em{font-size:40px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.person{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--card);cursor:pointer;text-align:left;min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;color:var(--ink);overflow-wrap:anywhere;touch-action:manipulation}
.person small{font-weight:700;color:var(--muted);font-size:12px}
.person.seen{background:var(--goodbg);border-color:var(--good)}
.person.seen small{color:var(--good)}
.pairs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.turn{font-family:var(--serif);font-size:clamp(34px,6vw,58px);font-weight:700;color:var(--accent);line-height:1.1;overflow-wrap:anywhere}
.order{display:flex;flex-wrap:wrap;gap:6px;counter-reset:o}
.order span{background:var(--soft);border-radius:999px;padding:5px 12px 5px 8px;font-weight:700;font-size:13.5px;counter-increment:o}
.order span::before{content:counter(o);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--card);margin-right:6px;font-size:12px;color:var(--accent)}
.order span.now{background:var(--accent);color:var(--accent-ink)}
.order span.done{opacity:.55}
.gift{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.gift:last-child{border-bottom:0}
.gift .grow{flex:1;min-width:140px}
.gift .grow b{display:block;overflow-wrap:anywhere}.gift .grow small{color:var(--muted);font-weight:600}
.steals{display:inline-flex;gap:3px}.steals i{width:12px;height:12px;border-radius:50%;background:var(--soft);border:1.5px solid var(--fill)}.steals i.on{background:var(--accent);border-color:var(--accent)}
.frozen{background:#E3EEF8;color:#24527A}:root[data-theme="dark"] .frozen{background:#1D2C3A;color:#9CC7EE}
.rules{margin:0;padding-left:20px}.rules li{margin:0 0 8px}.rules b{color:var(--deep)}
.cardbig{display:grid;place-items:center;text-align:center;min-height:min(56vh,440px);border-radius:28px;border:2px solid var(--fill);background:var(--card);padding:28px 22px;cursor:pointer;width:100%;color:var(--ink);box-shadow:var(--shadow);touch-action:manipulation}
.cardbig .lab{margin-bottom:12px}
.cardbig q{display:block;quotes:none;font-family:var(--serif);font-weight:700;font-size:clamp(28px,5vw,58px);line-height:1.18;color:var(--deep);overflow-wrap:anywhere}
.cardbig small{display:block;margin-top:18px;color:var(--muted);font-weight:700}
.votecat{padding:12px 0;border-bottom:1px solid var(--line)}.votecat:last-child{border-bottom:0}
.votecat b{display:block;margin-bottom:8px}
.winner{text-align:center;padding:22px 16px;border-radius:22px;background:var(--goldbg);border:2px solid var(--gold)}
.winner .lab{color:var(--gold)}
.winner .nm{font-family:var(--serif);font-size:clamp(30px,5vw,48px);font-weight:700;color:var(--deep);line-height:1.1;margin:8px 0;overflow-wrap:anywhere}
.cd{font-family:var(--serif);font-weight:700;color:var(--deep);text-align:center;line-height:1;font-variant-numeric:tabular-nums;font-size:clamp(46px,12vw,150px);margin:10px 0;letter-spacing:-1px;overflow-wrap:anywhere}

  $("toastMsg").textContent = m; undoFn = undo || null; u.hidden = !undo; u.textContent = label || "Undo"; t.classList.toggle("has-undo", !!undo);
  t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => { t.classList.remove("show", "has-undo"); undoFn = null; }, undo ? 4500 : 2400);
}
$("toastUndo").onclick = () => { const f = undoFn; undoFn = null; $("toast").classList.remove("show", "has-undo"); if (f) f(); };
const demoLimit = what => { toast("The demo stops here (" + what + "). The full app has no limits.", () => window.open(BUY[S.party], "_blank", "noopener"), "Get it"); };
let AC = null;
function beep(freq = 880, ms = 160, times = 1, gap = 120) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    for (let k = 0; k < times; k++) {
      const t0 = AC.currentTime + k * (ms + gap) / 1000, o = AC.createOscillator(), g = AC.createGain();
      o.type = "sine"; o.frequency.value = freq; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + ms / 1000);
      o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + ms / 1000 + 0.05);
    }
  } catch (e) {}
}
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = $("confetti"), cols = S.party === "nye" ? ["#E7C46E", "#2E3A87", "#C0C6E8", "#F29BC2", "#FFFFFF"] : ["#B3243B", "#2E6B4F", "#F2A7AE", "#E7C46E", "#FFFFFF"];
  box.innerHTML = Array.from({ length: 90 }, (_, i) => `<i style="left:${Math.random() * 100}%;background:${cols[i % cols.length]};--dx:${Math.round(Math.random() * 160 - 80)}px;animation-delay:${(Math.random() * 0.8).toFixed(2)}s;animation-duration:${(2.2 + Math.random() * 1.6).toFixed(2)}s"></i>`).join("");
  clearTimeout(confetti.h); confetti.h = setTimeout(() => { box.innerHTML = ""; }, 4800);
}
function dlg(html, onOk) {
  const d = $("dlg"), f = $("dlgForm");
  f.innerHTML = html; d.showModal();
  const first = f.querySelector("input,textarea,select"); if (first) first.focus();
  f.onsubmit = e => { const v = e.submitter && e.submitter.value; if (v === "ok" && onOk) { if (onOk(f) === false) { e.preventDefault(); return; } } };
}
function confirmDlg(title, text, okLabel, fn) {
  dlg(`<h2>${esc(title)}</h2><p class="sub">${esc(text)}</p><div class="actions"><button class="btn ghost" value="cancel">Cancel</button><button class="btn" value="ok">${esc(okLabel)}</button></div>`, () => { fn(); });
}

function applyTheme() {
  const dark = S.theme === "dark" || (S.theme === "device" && matchMedia("(prefers-color-scheme: dark)").matches), R = document.documentElement;
  R.dataset.theme = dark ? "dark" : "light"; R.dataset.accent = S.accent; R.dataset.party = S.party;
  document.querySelector('meta[name="theme-color"]').content = dark ? PARTY[S.party].dark : PARTY[S.party].color;
  $("navAwards").textContent = PARTY[S.party].awardsNav;
  const s = document.querySelector('.navbtn[data-view="santa"] span'); if (s) s.textContent = "Secret Santa";
  if ($("buyLink")) $("buyLink").href = BUY[S.party];
  paintThemeToggle();
}
function paintThemeToggle() {
  const b = $("themeTog"); if (!b) return;
  const dark = document.documentElement.dataset.theme === "dark";
  b.innerHTML = dark ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  const t = dark ? "Switch to light mode" : "Switch to dark mode";
  b.setAttribute("aria-label", t); b.title = t;
}
$("themeTog").addEventListener("click", ev => { ev.stopPropagation(); S.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; save(); render(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);

function setParty(p) {
  if (!C[p]) return;
  const changed = S.party !== p;
  if (DEMO && changed) { const keep = [S.theme, S.accent, S.sound]; S = sample(p); [S.theme, S.accent, S.sound] = keep; }
  S.party = p; S.chosen = true;
  if (changed) {
    S.trivia = Object.assign(S.trivia, { phase: "setup", rounds: [], deck: [], i: 0, got: {}, shown: false });
    S.bingo = Object.assign(S.bingo, { bag: [], called: [] }); S.likely = Object.assign(S.likely, { deck: [], i: -1 });
    S.awards.cats = null; S.cd.mode = p === "nye" ? "newyear" : "christmas";
    if (!DEMO) { const x = blank().trivia.teams; if (S.trivia.teams.join() === C[p === "nye" ? "xmas" : "nye"].sample.teams.join()) S.trivia.teams = C[p].sample.teams.slice(); else if (!S.trivia.teams.length) S.trivia.teams = x; }
  }
  save();
}
function addGuests(txt) {
  const add = String(txt || "").split(",").map(clean).filter(Boolean);
  let n = 0;
  for (const a of add) {
    if (S.guests.some(g => g.toLowerCase() === a.toLowerCase())) continue;
    if (S.guests.length >= (DEMO ? LIM.guests : MAXG)) { if (DEMO) demoLimit(LIM.guests + " names"); else toast("Up to " + MAXG + " names"); break; }
    S.guests.push(a); n++;
  }
  return n;
}
const snapE = () => { const E = S.elephant; E.hist.push(JSON.stringify(Object.assign({}, E, { hist: [] }))); if (E.hist.length > 40) E.hist.shift(); };
function act(a, v, el) {
  const T = S.trivia, B = S.bingo, Sa = S.santa, E = S.elephant, L = S.likely, A = S.awards, K = S.picker;
  switch (a) {
    case "party": setParty(v); if (VIEW === "settings") render(); else go("home"); return;
    case "gdel": S.guests = S.guests.filter(g => g !== v); break;
    case "gsample": S.guests = C[S.party].sample.guests.slice(0, DEMO ? LIM.guests : MAXG); if (!Sa.pairs.length) Sa.pairs = C[S.party].sample.pairs.map(p => p.slice()); break;
    // trivia
    case "tdel": if (T.teams.length > 1) T.teams.splice(+v, 1); else toast("Keep at least one team"); break;
    case "tround": { const rs = triviaRounds(); let cur = T.rounds.length ? T.rounds.slice() : rs.slice(); cur = cur.includes(v) ? cur.filter(r => r !== v) : cur.concat(v); if (!cur.length) { toast("Pick at least one round"); return; } T.rounds = cur.length === rs.length ? [] : cur; break; }
    case "tcount": T.count = +v; break;
    case "tsecs": T.secs = +v; break;
    case "tstart": Object.assign(T, { deck: triviaDeck(T), i: 0, shown: false, got: {}, phase: "play" }); TQ.key = ""; break;
    case "treveal": T.shown = true; TQ.done = true; break;

        const old = [...h.children].filter(c => c !== title && !c.children.length && !c.textContent.trim());
        title.after(bar); old.forEach(c => c.remove());
        h.classList.add("mact-head");
      }
    }
    pad();
  }
  function pad() {
    if (!MQ.matches) return;
    let top = innerHeight;
    document.querySelectorAll("body>*,.app>*").forEach(e => {
      if (e === main || e.tagName === "DIALOG" || !vis(e)) return;
      const cs = getComputedStyle(e); if (cs.position !== "fixed" || cs.pointerEvents === "none" || +cs.opacity === 0) return;
      const r = e.getBoundingClientRect(); if (r.height && r.top > innerHeight / 2) top = Math.min(top, r.top);
    });
    const pb = Math.max(96, Math.ceil(innerHeight - top + 16)) + "px";
    if (document.documentElement.style.getPropertyValue("--mact-pb") !== pb) document.documentElement.style.setProperty("--mact-pb", pb);
  }
  new MutationObserver(apply).observe(main, { childList: true });
  const fab = document.getElementById("fab");
  if (fab) new MutationObserver(pad).observe(fab, { attributes: true, attributeFilter: ["hidden", "style", "class"] });
  addEventListener("resize", pad);
  MQ.addEventListener("change", () => { closeMenu(); if (typeof render === "function") render(); else apply(); setTimeout(pad, 50); });
  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest(".mact-morebtn");
    if (b) { const w = b.parentElement; if (openMenu && openMenu.btn === b) closeMenu(); else openM(w, 0); return; }
    if (openMenu && !openMenu.menu.contains(e.target)) closeMenu();
    else if (openMenu && e.target.closest('[role="menuitem"]')) closeMenu();
  });
  document.addEventListener("keydown", e => {
    const b = e.target.closest && e.target.closest(".mact-morebtn");
    if (b && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); openM(b.parentElement, e.key === "ArrowUp" ? -1 : 0); return; }
    if (!openMenu) return;
    const it = items(openMenu.menu), i = it.indexOf(document.activeElement);
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeMenu(true); }
    else if (e.key === "Tab") closeMenu();
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const n = it.length; if (n) it[(i + (e.key === "ArrowDown" ? 1 : -1) + n) % n].focus(); }
    else if (e.key === "Home" || e.key === "End") { e.preventDefault(); if (it.length) it[e.key === "Home" ? 0 : it.length - 1].focus(); }
  }, true);
  apply(); addEventListener("load", pad); setTimeout(pad, 300);
})();
</script>

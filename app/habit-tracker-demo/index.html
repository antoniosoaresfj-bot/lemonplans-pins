const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parse = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const dayDiff = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const ym = (y, m) => y + "-" + pad(m);
const dim = (y, m) => new Date(y, m, 0).getDate();
const monday = s => { const d = parse(s); return addDays(s, -((d.getDay() + 6) % 7)); };
// The demo is frozen on the sample's last day, so it looks the same as the spreadsheet
const TODAY = () => DEMO ? SAMPLE.asof : iso(new Date());
const fmtLong = s => parse(s).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
const fmtShort = s => parse(s).toLocaleDateString("en-US", { month: "short", day: "numeric" });

/* ---------- state ---------- */
const uid = () => Math.random().toString(36).slice(2, 9);
function blank() { return { v: 1, app: "habit-tracker", theme: "light", accent: "rose", name: "", habits: [], done: {}, notes: {}, checkins: {}, backup: { last: null, changes: 0, seen: false } }; }
function valid(s) { return s && s.v === 1 && s.app === "habit-tracker" && Array.isArray(s.habits) && s.done && typeof s.done === "object"; }
function normalize(s) {
  const o = Object.assign(blank(), s);
  ["done", "notes", "checkins"].forEach(k => { if (!o[k] || typeof o[k] !== "object" || Array.isArray(o[k])) o[k] = {}; });
  o.backup = Object.assign({ last: null, changes: 0, seen: false }, o.backup && typeof o.backup === "object" ? o.backup : {});
  o.habits = o.habits.filter(h => h && h.id && h.name).slice(0, MAXH).map(h => Object.assign({ area: "Other", tpw: 7, start: TODAY().slice(0, 7), why: "", tiny: "" }, h, { tpw: Math.min(7, Math.max(1, Math.round(+h.tpw || 7))) }));
  if (!["rose", "lavender", "sage", "peach"].includes(o.accent)) o.accent = "rose";
  // the app always opens light. "auto" (old default) becomes light; "device" is the Auto chosen in Settings.
  if (!["light", "dark", "device"].includes(o.theme)) o.theme = "light";
  return o;
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (valid(s)) return normalize(s); } catch (e) {}
  return DEMO ? sample() : blank();
}
// Every save counts as a change since the last backup (a backup download resets it)
function save(quiet) {
  if (!quiet) S.backup.changes = (S.backup.changes || 0) + 1;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("Couldn't save in this browser"); }
  if (!quiet && S.backup.changes && S.backup.changes % BK_EVERY === 0) setTimeout(() => toast("Lots of changes since your last backup", backupNow, "Back up now"), 2600);
}
// Emma's sample from the spreadsheet. In the full app it is moved so its last day is today.
function sample() {
  const s = blank(), shift = DEMO ? 0 : dayDiff(SAMPLE.asof, TODAY());
  const mshift = d => { const x = parse(d + "-01"), t = parse(addDays(SAMPLE.asof, shift)), a = parse(SAMPLE.asof); x.setMonth(x.getMonth() + (t.getFullYear() - a.getFullYear()) * 12 + t.getMonth() - a.getMonth()); return iso(x).slice(0, 7); };
  s.name = SAMPLE.name;
  SAMPLE.habits.forEach(h => {
    const o = { id: uid(), name: h.name, area: h.area, tpw: h.tpw, start: shift ? mshift(h.start) : h.start, why: h.why, tiny: h.tiny, sample: true };
    s.habits.push(o);
    h.ticks.forEach(d => { const k = addDays(d, shift); (s.done[k] = s.done[k] || []).push(o.id); });
  });
  Object.entries(SAMPLE.checkins).forEach(([mon, c]) => { s.checkins[monday(addDays(mon, shift))] = Object.assign({}, c); });
  return s;
}
let S = load();

/* ---------- the math (same rules as the 2027 Habit Tracker spreadsheet) ---------- */
let IDX = new Map();          // habit id -> Set of ISO days done
function reindex() { IDX = new Map(S.habits.map(h => [h.id, new Set()])); Object.entries(S.done).forEach(([d, ids]) => ids.forEach(id => IDX.has(id) && IDX.get(id).add(d))); }
const isDone = (h, d) => IDX.has(h.id) && IDX.get(h.id).has(d);
const activeOn = (h, d) => d.slice(0, 7) >= h.start;
const activeIn = (h, y, m) => ym(y, m) >= h.start;
// Goal for a month = days from Times a week (3 a week in a 31-day month = 13), at least 1
const monthGoal = (h, y, m) => activeIn(h, y, m) ? Math.max(1, Math.round(h.tpw * dim(y, m) / 7)) : 0;
// Goal so far: the whole goal for past months, today's share in the current month, 0 for months to come
function goalToDate(h, y, m, asof = TODAY()) {
  const k = ym(y, m), a = asof.slice(0, 7);
  if (!activeIn(h, y, m) || k > a) return 0;
  if (k < a) return monthGoal(h, y, m);
  return Math.max(1, Math.round(h.tpw * Number(asof.slice(8, 10)) / 7));
}
function doneIn(h, y, m, asof = TODAY()) { let n = 0; const k = ym(y, m); IDX.get(h.id).forEach(d => { if (d.slice(0, 7) === k && d <= asof) n++; }); return n; }
function monthPct(h, y, m, asof = TODAY()) { const g = goalToDate(h, y, m, asof); return g ? Math.min(1, doneIn(h, y, m, asof) / g) : null; }
function consistency(y, m, asof = TODAY()) { const p = S.habits.map(h => monthPct(h, y, m, asof)).filter(v => v !== null); return p.length ? p.reduce((a, b) => a + b, 0) / p.length : null; }
function yearStats(h, y, asof = TODAY()) {
  let goal = 0, done = 0;
  for (let m = 1; m <= 12; m++) { const g = goalToDate(h, y, m, asof); if (g) { goal += g; done += doneIn(h, y, m, asof); } }
  return { goal, done, pct: goal ? Math.min(1, done / goal) : null };
}
// Streak now = days in a row up to today; yesterday counts if today isn't ticked yet. Streaks carry over months and years.
function streakNow(h, asof = TODAY()) { let d = isDone(h, asof) ? asof : addDays(asof, -1), n = 0; while (isDone(h, d)) { n++; d = addDays(d, -1); } return n; }
// Best streak among the runs that reach a day of the year (or month) y[-m], counting days before it too
function bestStreak(h, y, m, asof = TODAY()) {
  const days = [...IDX.get(h.id)].filter(d => d <= asof).sort(); let best = 0, run = 0, prev = null;
  const pre = m ? ym(y, m) : String(y);
  days.forEach(d => { run = prev && addDays(prev, 1) === d ? run + 1 : 1; prev = d; if (d.startsWith(pre)) best = Math.max(best, run); });
  return best;
}
// One week (Monday to Sunday, up to today): ticks, and the goal = every active habit's times a week ÷ 7 for each day
function weekStats(mon, asof = TODAY()) {
  let ticks = 0, target = 0; const per = {};
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i); if (d > asof) break;
    S.habits.forEach(h => { if (isDone(h, d)) { ticks++; per[h.id] = (per[h.id] || 0) + 1; } if (activeOn(h, d)) target += h.tpw / 7; });
  }
  return { ticks, target, pct: target > 0 ? Math.min(1, ticks / target) : null, per };
}
// Heat map: share of the active habits done that day
function dayShare(d) { const act = S.habits.filter(h => activeOn(h, d)); if (!act.length) return null; return act.filter(h => isDone(h, d)).length / act.length; }
const level = p => p === null ? -1 : p <= 0 ? 0 : p < .34 ? 1 : p < .67 ? 2 : p < 1 ? 3 : 4;
const pctLevel = p => p === null ? -1 : p < .25 ? 0 : p < .5 ? 1 : p < .75 ? 2 : p < .95 ? 3 : 4;

/* ---------- formatting ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const pc = p => p === null ? "–" : Math.round(p * 100) + "%";
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
const tpwText = n => n === 7 ? "Every day" : n + "× a week";
const dot = a => `<i class="area" style="background:${AREA_COL[a] || AREA_COL.Other}"></i>`;
let undoFn = null;
function toast(m, undo, label) {
  const t = document.getElementById("toast"), u = document.getElementById("toastUndo");
  document.getElementById("toastMsg").textContent = m; undoFn = undo || null; u.hidden = !undo; u.textContent = label || "Undo"; t.classList.toggle("has-undo", !!undo);
  t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => { t.classList.remove("show", "has-undo"); undoFn = null; }, undo ? 4500 : 2200);
}
document.getElementById("toastUndo").onclick = () => { const f = undoFn; undoFn = null; document.getElementById("toast").classList.remove("show", "has-undo"); if (f) f(); };

/* ---------- theme ---------- */
function applyTheme() {
  const dark = S.theme === "dark" || (S.theme === "device" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.documentElement.dataset.accent = S.accent;
  document.querySelector('meta[name="theme-color"]').content = dark ? "#181014" : "#FFF6F4";
  paintThemeToggle();
}
function paintThemeToggle() {
  const b = document.getElementById("themeTog"); if (!b) return;
  const dark = document.documentElement.dataset.theme === "dark";
  b.innerHTML = dark ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  const t = dark ? "Switch to light mode" : "Switch to dark mode";
  b.setAttribute("aria-label", t); b.title = t;
}
document.getElementById("themeTog").addEventListener("click", ev => {
  ev.stopPropagation();
  S.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  save(); render();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);

/* ---------- backup reminders: the data lives only in this browser ---------- */
const bkAge = () => S.backup.last ? Math.floor((Date.now() - new Date(S.backup.last).getTime()) / 86400000) : null;
const agoText = n => n === 0 ? "today" : n === 1 ? "yesterday" : n + " days ago";
function backupNow() {
  download("habit-tracker-backup-" + TODAY() + ".json", JSON.stringify(Object.assign({}, S, { backup: Object.assign({}, S.backup, { last: new Date().toISOString(), changes: 0, seen: true }) }), null, 1), "application/json");
  S.backup.last = new Date().toISOString(); S.backup.changes = 0; S.backup.seen = true; save(true); render();
  toast("Backup saved · Keep the file somewhere safe (Files, Drive or email)");
}
function dataNote() {
  if (!S.backup.seen) return `<div class="card datanote" id="dataNote" role="note"><h2>Your data lives only on this device</h2>
   <p>Your habits are saved in this browser, on this phone or computer. Nothing goes online. If you switch devices, clear your browser data or delete the browser, they are gone.</p>
   <p>A backup is one small file you keep (in Files, Google Drive or an email to yourself). On a new device: open the app, go to Settings › Restore backup and pick the file.</p>
   <div class="actions" style="justify-content:flex-start"><button class="btn" type="button" id="firstBackup">Save my first backup</button><button class="btn ghost" type="button" id="notNow">Not now</button></div></div>`;
  const a = bkAge();
  if (DEMO || !S.habits.length) return "";
  if (a === null || a > BK_DAYS) return `<div class="bkbar" id="bkBar" role="status"><span>${a === null ? "<b>No backup yet</b> · your habits live only on this device" : "Last backup: <b>" + agoText(a) + "</b>"}</span><button class="btn small ghost" type="button" id="bkNow" style="background:var(--card)">Back up now</button></div>`;
  return "";
}

/* ---------- views ---------- */
let VIEW = "today", VD = TODAY(), VM = { y: +TODAY().slice(0, 4), m: +TODAY().slice(5, 7) }, VY = +TODAY().slice(0, 4), VW = monday(TODAY()), HTAB = "mine";
const M = () => document.getElementById("main");
function go(v) {
  VIEW = v;
  document.querySelectorAll(".navbtn").forEach(b => { if (b.dataset.view === v) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  render(); window.scrollTo(0, 0); M().focus({ preventScroll: true });
}
function render() {
  applyTheme(); reindex();
  ({ today, month, year: yearView, week, habits, settings })[VIEW]();
  M().insertAdjacentHTML("afterbegin", dataNote());
  document.getElementById("fab").hidden = VIEW !== "habits";
  wire();
}
const pick = (id, label, prevOff, nextOff) => `<div class="pick" role="group"><button type="button" id="${id}P" aria-label="Previous"${prevOff ? " disabled" : ""}>‹</button><b>${label}</b><button type="button" id="${id}N" aria-label="Next"${nextOff ? " disabled" : ""}>›</button></div>`;
const ringSVG = (a, b, size = 96) => { const r = 40, c = 2 * Math.PI * r, p = b ? a / b : 0; return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true"><circle class="tr" cx="50" cy="50" r="${r}"/><circle class="pr" cx="50" cy="50" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - p)).toFixed(1)}" transform="rotate(-90 50 50)"/><text x="50" y="58" text-anchor="middle">${b ? Math.round(p * 100) + "%" : "–"}</text></svg>`; };

function today() {
  const T = TODAY(), d = VD, isT = d === T;
  if (!S.habits.length) {
    M().innerHTML = `<h1>Small habits, <em>every day</em></h1><p class="sub">Welcome! Pick 3 to 5 habits to start. You can add up to ${MAXH}.</p>
    <div class="grid g3"><div class="card"><h2>Start from an idea</h2><p class="meta">32 ideas by life area, each with a tiny version for busy days.</p><button class="btn" id="goIdeas" type="button">See habit ideas</button></div>
    <div class="card"><h2>Add your own</h2><p class="meta">A name, how many times a week, and why it matters to you.</p><button class="btn ghost" id="addOwn" type="button">+ New habit</button></div>
    <div class="card"><h2>Look around first</h2><p class="meta">Load Emma's sample (12 habits) to see streaks, the year map and check-ins.</p><button class="btn ghost" id="trySample" type="button">Try the sample</button></div></div>
    <p class="hint" style="margin-top:16px">Everything stays on this device, in this browser. No account, no internet needed. Download a backup in Settings now and then.</p>`;
    return;
  }
  const act = S.habits.filter(h => activeOn(h, d)), n = act.filter(h => isDone(h, d)).length, mon = monday(d);
  const W = weekStats(mon, T), cons = consistency(+d.slice(0, 4), +d.slice(5, 7), T);
  const later = S.habits.filter(h => !activeOn(h, d));
  M().innerHTML = `<div class="dayrow"><div><h1>${isT ? "Today" : d === addDays(T, -1) ? "Yesterday" : esc(fmtShort(d))}</h1><p class="sub" style="margin:0">${esc(fmtLong(d))}${S.name ? " · " + esc(S.name) : ""}</p></div>${pick("day", esc(parse(d).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })), false, isT)}</div>
  <div class="card ringcard">${ringSVG(n, act.length)}<div><div class="lab">${isT ? "Today" : "This day"}</div><div class="big" id="todayCount">${n} of ${act.length}</div><div class="meta">${n === act.length && act.length ? "All done. Beautiful! ✨" : "Tap a habit when it's done"} · ${pc(cons)} on target this month</div></div></div>
  <div class="hlist" id="hlist">${act.map(h => {
    const on = isDone(h, d), st = streakNow(h, d), wk = W.per[h.id] || 0;
    return `<button type="button" class="hrow" data-tick="${h.id}" aria-pressed="${on}"><span class="chk" aria-hidden="true">✓</span><span class="t"><span class="n">${esc(h.name)}</span><span class="m"><span>${dot(h.area)}${esc(h.area)}</span><span>${h.tpw === 7 ? "Daily" : `${Math.min(wk, 99)} of ${h.tpw} this week${wk >= h.tpw ? " ✓" : ""}`}</span></span>${!on && h.tiny ? `<span class="tiny">Busy day? ${esc(h.tiny)}</span>` : ""}</span><span class="st">${st}<small>${st === 1 ? "day" : "days"}</small></span></button>`;
  }).join("")}</div>
  ${later.length ? `<p class="meta" style="margin-top:10px">Starting later: ${later.map(h => esc(h.name) + " (" + MONTHS[+h.start.slice(5) - 1] + ")").join(", ")}</p>` : ""}
  <div class="card" style="margin-top:16px"><h2>Note for ${isT ? "today" : esc(fmtShort(d))}</h2><textarea id="note" placeholder="How did it go? One line is enough." aria-label="Note">${esc(S.notes[d] || "")}</textarea><div class="actions" style="justify-content:flex-start"><button class="btn small" type="button" id="saveNote">Save note</button></div></div>`;
}
function toggle(hid, d) {
  const h = S.habits.find(x => x.id === hid); if (!h || d > TODAY()) return;
  const list = S.done[d] = S.done[d] || [], was = list.includes(hid);
  if (was) list.splice(list.indexOf(hid), 1); else list.push(hid);
  if (!list.length) delete S.done[d];
  save(); render();
  toast(was ? "Unmarked: " + h.name : "Done: " + h.name + (h.tpw === 7 ? "" : ""), () => { const l = S.done[d] = S.done[d] || []; if (was) { if (!l.includes(hid)) l.push(hid); } else if (l.includes(hid)) l.splice(l.indexOf(hid), 1); if (!l.length) delete S.done[d]; save(); render(); toast("Undone"); });
}

function month() {
  const { y, m } = VM, T = TODAY(), n = dim(y, m), a = T.slice(0, 7), k = ym(y, m);
  const cons = consistency(y, m), ticks = S.habits.reduce((s, h) => s + doneIn(h, y, m), 0);
  const hs = S.habits.filter(h => activeIn(h, y, m));
  const head = Array.from({ length: n }, (_, i) => { const d = ym(y, m) + "-" + pad(i + 1), wd = (parse(d).getDay() + 6) % 7; return `<th class="${d === T ? "now" : wd >= 5 ? "we" : ""}">${WD[wd][0]}<br>${i + 1}</th>`; }).join("");
  const rows = hs.map(h => {
    const cells = Array.from({ length: n }, (_, i) => { const d = k + "-" + pad(i + 1), on = isDone(h, d), fut = d > T, pre = !activeOn(h, d);
      return `<td><button type="button" class="c${on ? " on" : ""}${pre ? " off" : ""}" data-cell="${h.id}|${d}" aria-pressed="${on}" aria-label="${esc(h.name)}, ${MON[m - 1]} ${i + 1}${on ? ": done" : ""}"${fut ? " disabled" : ""}>${on ? "✓" : ""}</button></td>`; }).join("");
    const p = monthPct(h, y, m), cur = k === a;
    return `<tr><td class="hn" title="${esc(h.name)}">${esc(h.name)}<small>${pc(p)} · ${doneIn(h, y, m)} of ${monthGoal(h, y, m)}</small></td>${cells}<td class="x">${doneIn(h, y, m)}</td><td class="x">${monthGoal(h, y, m)}</td><td class="x p">${pc(p)}</td><td class="x p">${cur ? streakNow(h) : "–"}</td><td class="x">${k <= a ? bestStreak(h, y, m) : "–"}</td></tr>`;
  }).join("");
  M().innerHTML = `<div class="top"><div><h1>${MONTHS[m - 1]} <em>${y}</em></h1><p class="sub">${k > a ? "Coming up" : pc(cons) + " on target · " + plural(ticks, "tick")}</p></div>${pick("mon", MONTHS[m - 1] + " " + y)}</div>
  ${hs.length ? `<div class="card wmbox" style="padding:12px"><div class="scroll" id="mgScroll"><table class="mg"><thead><tr><th class="hn">Habit</th>${head}<th>Done</th><th>Goal</th><th>%</th><th>Now</th><th>Best</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <p class="meta" style="margin-top:10px">Tap a box to tick or untick a day. Goal = days this month from Times a week. % = days done ÷ goal so far (100% max). Now = streak up to today; Best = longest streak this month.</p>` : `<div class="card empty">No habits in ${MONTHS[m - 1]} ${y}.</div>`}`;
  const sc = document.getElementById("mgScroll"), nowTh = sc && sc.querySelector("th.now");
  if (nowTh) sc.scrollLeft = Math.max(0, nowTh.offsetLeft + nowTh.offsetWidth - sc.clientWidth + 40);
}

function yearView() {
  const y = VY, T = TODAY();
  const ys = S.habits.map(h => ({ h, ...yearStats(h, y), best: bestStreak(h, y), now: streakNow(h) }));
  const withP = ys.filter(x => x.pct !== null), avg = withP.length ? withP.reduce((s, x) => s + x.pct, 0) / withP.length : null;
  const totalDays = ys.reduce((s, x) => s + x.done, 0), best = ys.slice().sort((a, b) => b.best - a.best)[0], now = ys.slice().sort((a, b) => b.now - a.now)[0];
  const cals = MONTHS.map((nm, i) => {
    const m = i + 1, n = dim(y, m), off = (parse(ym(y, m) + "-01").getDay() + 6) % 7;
    let cells = "<i class='e'></i>".repeat(off);
    for (let d = 1; d <= n; d++) { const s = ym(y, m) + "-" + pad(d); if (s > T) { cells += "<i class='fu'></i>"; continue; } const L = level(dayShare(s)); cells += `<i class="${L > 0 ? "l" + L : ""}" title="${MON[i]} ${d}: ${pc(dayShare(s))}"></i>`; }
    return `<div class="cal"><b>${nm}</b><div class="d">${cells}</div></div>`;
  }).join("");
  const bars = MONTHS.map((nm, i) => { const c = consistency(y, i + 1); return `<div class="${ym(y, i + 1) === T.slice(0, 7) ? "now" : ""}"><span>${c === null ? "" : Math.round(c * 100)}</span><i style="height:${c === null ? 0 : Math.max(2, c * 110)}px"></i><span>${nm[0]}</span></div>`; }).join("");
  const areas = AREAS.map(a => { const l = withP.filter(x => x.h.area === a); return l.length ? [a, l.reduce((s, x) => s + x.pct, 0) / l.length, l.length] : null; }).filter(Boolean);
  M().innerHTML = `<div class="top"><div><h1>Your <em>${y}</em></h1><p class="sub">Every habit, every month. Darker = closer to 100%.</p></div>${pick("yr", String(y))}</div>

const q = v => /[",\n\r]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);

  if (kind === "year") return out(["Habit", "Life area", "Times a week", ...MON.map(x => x + " %"), "Year so far %", "Days done", "Best streak", "Streak now"], S.habits.map(h => { const Y = yearStats(h, VY); return [h.name, h.area, h.tpw, ...MONTHS.map((_, i) => { const p = monthPct(h, VY, i + 1); return p === null ? "" : Math.round(p * 100); }), Y.pct === null ? "" : Math.round(Y.pct * 100), Y.done, bestStreak(h, VY), streakNow(h)]; }));

}

  const ADD = /(^|\s)\+|\b(add|new|log|record)\b/i;
  const main = document.getElementById("main"); if (!main) return;
  const txt = b => (b.textContent || "") + " " + (b.getAttribute("aria-label") || "");
  const vis = e => e && !e.hidden && getComputedStyle(e).display !== "none";
  let openMenu = null;
  function closeMenu(focus) {
    if (!openMenu) return; const m = openMenu; openMenu = null;
    m.menu.hidden = true; m.btn.setAttribute("aria-expanded", "false"); if (focus) m.btn.focus();
  }
  function items(m) { return [...m.querySelectorAll('[role="menuitem"]')].filter(vis); }
  function openM(w, i) {
    closeMenu(); const menu = w.querySelector(".mact-menu"), btn = w.querySelector(".mact-morebtn");
    menu.hidden = false; btn.setAttribute("aria-expanded", "true"); openMenu = { menu, btn };
    const it = items(menu); if (it.length) it[i < 0 ? it.length - 1 : 0].focus();
  }
  function head() {
    const h = main.firstElementChild;
    return h && (h.classList.contains("tablebar") || h.classList.contains("top")) ? h : null;
  }
  function apply() {
    const h = head(), mobile = MQ.matches;
    const hasAdd = !!h && [...h.querySelectorAll("button,a.btn")].some(b => vis(b) && ADD.test(txt(b)));
    document.documentElement.classList.toggle("mact-nofab", mobile && hasAdd);
    if (mobile && h && !h.dataset.mact) {
      h.dataset.mact = "1";
      const title = h.firstElementChild;
      const acts = [...h.querySelectorAll("button.btn,a.btn")].filter(b => !title.contains(b) && !b.closest(".mact-bar"));
      if (acts.length) {
        const pri = [...acts].reverse().find(b => !b.classList.contains("ghost") && !b.classList.contains("small"));
        const rest = acts.filter(b => b !== pri);
        let rare = rest.filter(b => RARE.test(txt(b)));
        if (rare.length < 2 || rare.length === rest.length && !pri) rare = [];
        const sec = rest.filter(b => !rare.includes(b));
        const bar = document.createElement("div"); bar.className = "mact-bar";
        if (pri) { pri.classList.add("mact-pri"); bar.append(pri); }
        if (sec.length || rare.length) {
          const g = document.createElement("div"); g.className = "mact-grid"; g.append(...sec);
          if (rare.length) {
            const w = document.createElement("div"); w.className = "mact-more";
            const id = "mactMenu" + Math.random().toString(36).slice(2, 7);
            w.innerHTML = `<button type="button" class="btn ghost mact-morebtn" aria-haspopup="menu" aria-expanded="false" aria-controls="${id}" aria-label="More actions">⋯ More</button><div class="mact-menu" id="${id}" role="menu" aria-label="More actions" hidden></div>`;
            const menu = w.lastElementChild;
            rare.forEach(b => { b.setAttribute("role", "menuitem"); b.tabIndex = -1; menu.append(b); });
            g.append(w);
          }
          bar.append(g);
        }
        const old = [...h.children].filter(c => c !== title && !c.children.length && !c.textContent.trim());
        title.after(bar); old.forEach(c => c.remove());
        h.classList.add("mact-head");
      }
    }
    pad();
  }
  function pad() {
    if (!MQ.matches) return;
    let top = innerHeight;
    document.querySelectorAll("body>*,.app>*").forEach(e => {
      if (e === main || e.tagName === "DIALOG" || !vis(e)) return;
      const cs = getComputedStyle(e); if (cs.position !== "fixed" || cs.pointerEvents === "none" || +cs.opacity === 0) return;
      const r = e.getBoundingClientRect(); if (r.height && r.top > innerHeight / 2) top = Math.min(top, r.top);
    });
    const pb = Math.max(96, Math.ceil(innerHeight - top + 16)) + "px";
    if (document.documentElement.style.getPropertyValue("--mact-pb") !== pb) document.documentElement.style.setProperty("--mact-pb", pb);
  }
  new MutationObserver(apply).observe(main, { childList: true });
  const fab = document.getElementById("fab");
  if (fab) new MutationObserver(pad).observe(fab, { attributes: true, attributeFilter: ["hidden", "style", "class"] });
  addEventListener("resize", pad);
  MQ.addEventListener("change", () => { closeMenu(); if (typeof render === "function") render(); else apply(); setTimeout(pad, 50); });
  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest(".mact-morebtn");
    if (b) { const w = b.parentElement; if (openMenu && openMenu.btn === b) closeMenu(); else openM(w, 0); return; }
    if (openMenu && !openMenu.menu.contains(e.target)) closeMenu();
    else if (openMenu && e.target.closest('[role="menuitem"]')) closeMenu();
  });
  document.addEventListener("keydown", e => {
    const b = e.target.closest && e.target.closest(".mact-morebtn");
    if (b && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); openM(b.parentElement, e.key === "ArrowUp" ? -1 : 0); return; }
    if (!openMenu) return;
    const it = items(openMenu.menu), i = it.indexOf(document.activeElement);
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeMenu(true); }
    else if (e.key === "Tab") closeMenu();
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const n = it.length; if (n) it[(i + (e.key === "ArrowDown" ? 1 : -1) + n) % n].focus(); }
    else if (e.key === "Home" || e.key === "End") { e.preventDefault(); if (it.length) it[e.key === "Home" ? 0 : it.length - 1].focus(); }
  }, true);
  apply(); addEventListener("load", pad); setTimeout(pad, 300);
})();
</script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7A4FA8">
<title>Event Planner App · The Lemon Plans</title>
<style>
:root{--bg:#FAF6F3;--card:#FFFFFF;--ink:#2B2326;--muted:#7A6C71;--line:#EBE0DC;--soft:#F7EAEE;--accent:#A4506A;--accent-ink:#fff;--fill:#D98AA2;--glass:#F2DFE5;--good:#2E7D5B;--warn:#B7791F;--bad:#C0392B;--goodbg:#E6F2EC;--warnbg:#FBF0D9;--badbg:#FBE4E1;--gold:#D9B46A;--shadow:0 10px 30px rgba(60,30,40,.07);--r:18px}
:root[data-theme="dark"]{--bg:#161113;--card:#211A1D;--ink:#F1E8EB;--muted:#AE9DA3;--line:#352A2E;--soft:#2C2226;--accent:#E8A2B8;--accent-ink:#2A1019;--fill:#B8607C;--glass:#3A2A30;--good:#5CC497;--warn:#E3B45C;--bad:#F07A6E;--goodbg:#173027;--warnbg:#33291A;--badbg:#3A2020;--shadow:0 10px 30px rgba(0,0,0,.35)}
:root[data-accent="sage"]{--accent:#4D7A5E;--fill:#8DB59A;--glass:#DFEBE2;--soft:#EBF2EC}:root[data-accent="sage"][data-theme="dark"]{--accent:#9FD0AE;--accent-ink:#0E1F14;--fill:#5E8F6E;--glass:#24352A;--soft:#1F2A22}
:root[data-accent="gold"]{--accent:#946414;--fill:#DDB46A;--glass:#F3E7CF;--soft:#F6EFE1}:root[data-accent="gold"][data-theme="dark"]{--accent:#EAC67A;--accent-ink:#1E1606;--fill:#B88C3C;--glass:#3A3020;--soft:#2A251B}
:root[data-accent="lilac"]{--accent:#7A4FA8;--fill:#B79AD8;--glass:#ECE3F6;--soft:#F3EEF9}:root[data-accent="lilac"][data-theme="dark"]{--accent:#C9AEEB;--accent-ink:#1C1029;--fill:#8B68B8;--glass:#33284A;--soft:#251F33}
:root[data-accent="sky"]{--accent:#2F78A8;--fill:#8EC0E0;--glass:#DFEEF8;--soft:#EBF4FA}:root[data-accent="sky"][data-theme="dark"]{--accent:#93C8EC;--accent-ink:#0B1A26;--fill:#4F8DB8;--glass:#203445;--soft:#1B2731}
:root[data-accent="pumpkin"]{--accent:#B0521C;--fill:#E39A62;--glass:#F7E3D3;--soft:#FAEEE4}:root[data-accent="pumpkin"][data-theme="dark"]{--accent:#F0AE78;--accent-ink:#2A1405;--fill:#C06A30;--glass:#43301F;--soft:#2F241B}
:root[data-accent="berry"]{--accent:#A8324A;--fill:#D98393;--glass:#F6DDE2;--soft:#F9EBEE}:root[data-accent="berry"][data-theme="dark"]{--accent:#EE9AAB;--accent-ink:#2A0E15;--fill:#B5506A;--glass:#40252C;--soft:#2E1E23}
:root[data-accent="navy"]{--accent:#2F4F86;--fill:#8AA3CF;--glass:#DFE6F3;--soft:#EAEEF6}:root[data-accent="navy"][data-theme="dark"]{--accent:#A9BFEA;--accent-ink:#0D1424;--fill:#4F6EA6;--glass:#25304A;--soft:#1E2433}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav.side{padding:22px 14px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:var(--bg)}
.brand{font-weight:800;font-size:19px;padding:0 10px 18px;letter-spacing:-.3px;line-height:1.2}
.brand small{display:block;font-weight:600;font-size:12px;color:var(--muted);letter-spacing:.2px;margin-top:2px}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:650;color:var(--muted);text-align:left}
.navbtn .i{width:22px;text-align:center;font-size:18px}
.navbtn[aria-current="page"]{background:var(--soft);color:var(--ink)}
main{padding:28px 32px 120px;max-width:1160px;width:100%;min-width:0}
main:focus{outline:none}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.6px}
h2{font-size:19px;margin:0 0 12px;letter-spacing:-.2px}
.sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.3fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g2e{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.hero{padding:28px}
.lab{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.big{font-size:56px;font-weight:850;letter-spacing:-2px;line-height:1.05;margin:6px 0 4px;color:var(--accent)}
.mid{font-size:28px;font-weight:800;letter-spacing:-.6px}
.meta{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-weight:750;font-size:13px;white-space:nowrap}
.ok{background:var(--goodbg);color:var(--good)}.tight{background:var(--warnbg);color:var(--warn)}.short{background:var(--badbg);color:var(--bad)}.done{background:var(--good);color:#fff}.grey{background:var(--soft);color:var(--muted)}
.t-ok{color:var(--good)}.t-short{color:var(--bad)}.t-warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:800;white-space:nowrap;text-align:right}
.emo{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.small{padding:7px 12px;border-radius:10px;font-size:14px}
.btn.danger{background:var(--badbg);color:var(--bad)}
.icon{border:0;background:var(--soft);border-radius:10px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center;font-size:15px;flex:none}
.bar{height:12px;border-radius:999px;background:var(--glass);overflow:hidden;position:relative}.bar i{display:block;height:100%;background:var(--fill);border-radius:999px}
.bar.over i{background:var(--bad)}
.fab{position:fixed;right:26px;bottom:26px;width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:32px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.25);cursor:pointer;z-index:20}
.app{position:relative}
.themetog{position:absolute;top:22px;right:28px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer;z-index:10;padding:0;transition:color .15s,border-color .15s}
.themetog:hover,.themetog:focus-visible{color:var(--ink);border-color:var(--muted)}
.themetog svg{width:18px;height:18px;display:block}
main h1{padding-right:48px}
@media (max-width:860px){.themetog{top:14px;right:14px;width:36px;height:36px}}
/* Events: espaço para a chave quando a tela não começa com título (Home) e nos botões do cabeçalho no desktop */
main>:first-child:not(h1):not(.tablebar){margin-top:44px}
@media (min-width:861px){main>.tablebar:first-child{padding-right:52px}}
@media (max-width:860px){main>:first-child:not(h1):not(.tablebar){margin-top:40px}}
.empty{color:var(--muted);text-align:center;padding:22px 10px}
.hint{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink)}
.kv{display:flex;justify-content:space-between;padding:7px 0;color:var(--muted);gap:10px}.kv b{color:var(--ink);text-align:right}
.kv.total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;color:var(--ink);font-weight:800}
.ring circle{fill:none;stroke-width:12}.ring .tr{stroke:var(--glass)}.ring .pr{stroke:var(--fill);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring text{fill:var(--ink);font-weight:850;font-size:26px}.ring .rs{fill:var(--muted);font-size:12px;font-weight:700}
.ringrow{display:flex;gap:18px;align-items:center}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat3 div{background:var(--soft);border-radius:14px;padding:12px;min-width:0}
.stat3 b{display:block;font-size:20px;letter-spacing:-.3px}
.stat3 span{font-size:12px;color:var(--muted);font-weight:700}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:800;text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t tfoot td{font-weight:850;border-top:2px solid var(--line)}
table.t td.l,table.t th.l{text-align:left}
table.t input.pct{width:64px;padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);text-align:right}
table.t select.rs{padding:5px 6px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:13.5px}
.cbar{display:grid;grid-template-columns:170px 1fr 92px;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.cbar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}
.cbar .bar{height:14px}
.cbar .bar b{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.55}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.tools .field{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;cursor:pointer;font-weight:650;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* seating */
.seatwrap{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.pool{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.zone{min-height:60px;border-radius:14px;transition:background .15s,outline-color .15s;outline:2px dashed transparent;outline-offset:2px}
.zone.over{background:var(--soft);outline-color:var(--accent)}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.tcard.full{border-color:var(--good)}.tcard.overcap{border-color:var(--bad)}
.thead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.thead .grow{flex:1;min-width:0}
.thead .name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thead .tname{font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsvg{display:block;flex:none}.tsvg .top{fill:var(--glass)}.tsvg .seat{fill:var(--card);stroke:var(--line);stroke-width:2}.tsvg .seat.on{fill:var(--fill);stroke:var(--fill)}.tsvg .seat.x{fill:var(--bad);stroke:var(--bad)}.tsvg text{fill:var(--ink);font-weight:850;font-size:15px}
.gchips{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;padding:2px}
.gchip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 10px;cursor:grab;font-weight:650;font-size:13.5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;touch-action:manipulation}
.gchip small{color:var(--muted);font-weight:700;margin-left:4px}
.gchip.inv{border-style:dashed;color:var(--muted)}
.gchip.picked{outline:3px solid var(--gold);outline-offset:1px;background:var(--soft)}
.gchip.dragging{opacity:.4}
/* floor plan */
:root{--s-p1:#C2577A;--s-p2:#3F6FB5;--s-both:#9A7520;--seatink:#fff;--m0:#A79A9F;--m1:#C07A1E;--m2:#A4473C;--m3:#2F7FA8;--m4:#4C9A5B;--m5:#6E8A1F;--m6:#8A5BB0;--h0:#C2577A;--h1:#3F6FB5;--h2:#2E8B6A;--h3:#B7791F;--h4:#7A4FB0;--h5:#A4473C;--h6:#4F7F2A;--h7:#2F8FA8}
:root[data-theme="dark"]{--s-p1:#E796B0;--s-p2:#8FB0EC;--s-both:#E3C274;--seatink:#1B1316;--m0:#8A7D82;--m1:#E8AE5E;--m2:#E0857A;--m3:#79B9DE;--m4:#86CB93;--m5:#B9D46A;--m6:#BE98E0;--h0:#E796B0;--h1:#8FB0EC;--h2:#74CBA8;--h3:#E3B45C;--h4:#BE98E0;--h5:#E0857A;--h6:#A9CF7A;--h7:#79C6DE}
.modetabs{margin:12px 0 14px}
.planwrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;grid-template-areas:"plan pool" "plan info";grid-template-rows:auto 1fr;gap:16px;align-items:start}
.plancard{grid-area:plan;padding:12px}.ppool{grid-area:pool}.pinfo{grid-area:info}
.ptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.ptools .grow{flex:1}
.ptools .chip{padding:5px 11px;font-size:13.5px}
.selbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:46px;padding:8px 2px 0;font-size:14px}
.selbar .grow{flex:1;min-width:120px}
.planbox{position:relative;width:100%;max-height:min(70vh,640px);min-height:260px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
#plan{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.phelp{margin:8px 2px 0;font-size:12.5px}
.room{fill:var(--card);stroke:var(--ink);stroke-width:2.5;vector-effect:non-scaling-stroke}
.gl1{fill:none;stroke:var(--line);stroke-width:.05}.gl5{fill:none;stroke:var(--line);stroke-width:.12}
.dim{fill:var(--muted);font-size:1.4px;font-weight:750;text-anchor:middle}
.dn0{fill:var(--card)}.dn1{fill:var(--glass)}
.el{cursor:move;outline:none}
.tb{fill:var(--glass);stroke:var(--fill);stroke-width:1.5;vector-effect:non-scaling-stroke}
.el.full .tb{stroke:var(--good);stroke-width:2.5}.el.over .tb{stroke:var(--bad);stroke-width:3}
.ib{fill:var(--soft);stroke:var(--muted);stroke-width:1.2;vector-effect:non-scaling-stroke}
.k-stage .ib,.k-dj .ib{fill:var(--glass)}.k-entrance .ib{fill:var(--accent);stroke:none}.k-label .ib{fill:transparent;stroke:none}
.k-dance .ib{stroke:var(--fill)}
.el.sel .tb,.el.sel .ib,.el:focus-visible .tb,.el:focus-visible .ib{stroke:var(--accent);stroke-width:3}
.el:focus-visible .tb,.el:focus-visible .ib{stroke-dasharray:6 3}
.el.hot .tb{fill:var(--soft);stroke:var(--accent);stroke-width:3}
.tno{fill:var(--ink);font-weight:850;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tnm,.ilab{fill:var(--muted);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.ilab{fill:var(--ink)}
.seat{cursor:pointer}
.seat circle{fill:var(--card);stroke:var(--fill);stroke-width:1.2;vector-effect:non-scaling-stroke}
.seat.on circle{stroke:var(--card);stroke-width:1}
.seat.inv circle{opacity:.6;stroke:var(--ink);stroke-dasharray:3 2}
.seat.dec circle{stroke:var(--bad);stroke-width:3}
.seat.x circle{stroke:var(--bad);stroke-width:2.5;stroke-dasharray:3 2}
.seat:hover circle,.seat.hot circle{stroke:var(--accent);stroke-width:3;stroke-dasharray:none}
.seat text{fill:var(--seatink);font-size:.66px;font-weight:850;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dbadge circle{fill:var(--m4)}.dbadge text{fill:#fff;font-size:.62px;font-weight:850;text-anchor:middle;dominant-baseline:central}
.roth line{pointer-events:none;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke}.roth circle{fill:var(--card);stroke:var(--accent);stroke-width:2.5;vector-effect:non-scaling-stroke;cursor:grab}
.gchip{user-select:none;-webkit-user-select:none}
.gchip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.gghost{position:fixed;z-index:70;pointer-events:none;padding:5px 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:750;font-size:13.5px;transform:translate(-50%,-140%);box-shadow:0 8px 20px rgba(0,0,0,.25);white-space:nowrap}
.ppool .plist{max-height:min(52vh,520px);overflow:auto;align-content:flex-start}
.plist{display:block}.plist>.singles{display:flex;flex-wrap:wrap;gap:6px}
.hh{margin:0 0 4px}.hhrow{display:flex;align-items:center;gap:2px}
.hhtog{border:0;background:none;width:30px;height:30px;flex:none;cursor:pointer;color:var(--muted);font-size:13px;border-radius:8px;padding:0}.hhtog:hover{background:var(--soft)}
.gchip.hchip{font-weight:800;min-width:0;border-color:var(--fill);background:var(--card)}.hh.hhdone .hchip small{color:var(--good)}
.hhm{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 6px 32px;min-height:0}
.gchip.seated{background:var(--soft);border-color:transparent;color:var(--muted)}
.gchip small.tno2{font-weight:800;color:var(--muted)}
.plab{font-size:12px;font-weight:800;color:var(--muted);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.5px}.plab:empty{display:none}
.hico{width:17px;height:14px;margin-right:6px;vertical-align:-2px;fill:var(--muted)}
.el.clash .tb{stroke:var(--bad);stroke-width:3;stroke-dasharray:6 3}
.cbadge circle{fill:var(--bad)}.cbadge text{fill:#fff;font-size:.86px;font-weight:900;text-anchor:middle;dominant-baseline:central}
.seat .clr{fill:none;stroke:var(--bad);stroke-width:2.2;stroke-dasharray:3 2;vector-effect:non-scaling-stroke}
.seat.hl circle{stroke:var(--gold);stroke-width:4;stroke-dasharray:none}
.el.warnhot .tb{stroke:var(--bad);fill:var(--badbg)}
.gghost.bad{background:var(--bad);color:#fff}
.zone.warnhot{outline:3px dashed var(--bad);outline-offset:2px}
.hpill{border:0;background:var(--soft);color:var(--ink);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:750;cursor:pointer;margin-left:4px;vertical-align:1px}
.gtools{margin-bottom:12px}.gtools .chip{display:inline-flex;align-items:center;gap:2px}
.mrows{display:grid;gap:6px}.mrow{display:flex;gap:6px;align-items:center}.mrow input{flex:1}
.rlist .row,.hlist .row{padding:9px 0}.rlist .pill{flex:none}
.wrapbtns .btn{white-space:normal}.segw label{white-space:normal}
.autores{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 12px;margin:0 0 10px;border-radius:12px;background:var(--goodbg);color:var(--good);font-weight:650;font-size:14px}.autores .grow{flex:1;min-width:0}
.el.autofill .tb{fill:var(--goodbg)}.tcard.autofill{box-shadow:0 0 0 2px var(--good)}
.ppool input{width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);margin-bottom:10px}
.warns{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px;font-size:14px}
.warns li{padding:9px 11px;border-radius:12px;background:var(--soft)}
.warns li.bad{background:var(--badbg);color:var(--bad)}.warns li.warn{background:var(--warnbg);color:var(--warn)}.warns li.good{background:var(--goodbg);color:var(--good)}
.warns li .btn{margin-top:6px}
.tinfo{border-top:1px solid var(--line);padding-top:12px;margin-top:4px;font-size:14px}
.tinfo .row{padding:6px 0;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}

    const hh = hhOf(u.gs[0].hh), name = u.gs.length > 1 ? (hh && u.gs.every(g => g.hh === hh.id) ? hh.name : andList(u.gs.map(g => g.name))) : u.gs[0].name;
    return { ...u, n, side: sd.p1 > sd.p2 + sd.both ? "p1" : sd.p2 > sd.p1 + sd.both ? "p2" : "both", head: anyHead && u.gs.some(g => g.head), name };

}

function copyText(t) {
  const fb = () => { const a = document.createElement("textarea"); a.value = t; a.setAttribute("readonly", ""); a.style.position = "fixed"; a.style.opacity = "0"; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); } catch (e) {} a.remove(); };
  return (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t).catch(fb) : Promise.resolve(fb())).then(() => { window.__copied = t; });
}

// Change the event type: the budget categories and (if wanted) the checklist follow the new template.
// Guests, groups, rules, tables, floor plan, vendors, payments and gifts stay. A category with vendors stays too (at 0% if the new template doesn't have it).
function switchTpl(k, tasks) {
  k = tplKey(k); if (!k || k === S.tpl) return;
  const old = S.tpl, oldDefault = new Set((TPL[old] || TPL.custom).when.flatMap(w => w[2])), byName = new Map(S.cats.map(c => [c.name, c]));
  const cats = TPL[k].cats.map(([name, pct]) => { const c = byName.get(name); return c ? Object.assign(c, { pct }) : { id: uid(), name, pct }; });
  const keep = new Set(cats.map(c => c.id));
  S.cats.filter(c => !keep.has(c.id) && S.vendors.some(v => v.cat === c.id)).forEach(c => { c.pct = 0; cats.push(c); });
  S.cats = cats;
  if (tasks) {
    const mine = S.tasks.filter(t => t.done || !oldDefault.has(t.text)), have = new Set(mine.map(t => t.text));
    S.tasks = defaultTasks(k).filter(t => !have.has(t.text)).concat(mine);
  }
  S.tpl = k; S.title = S.title && S.title === autoTitle(Object.assign({}, S, { tpl: old })) ? "" : S.title;
  S.plan.items.forEach(it => { if (it.kind === "sweetheart" && it.label === (TPL[old] || TPL.custom).honoree) it.label = ""; });
}

const slug = () => (S.tpl || "event") + (S.tpl === "custom" ? "-event" : "");
const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v), f2 = c => (c / 100).toFixed(2);
function csvText(kind) {
  let L;
  if (kind === "budget") {
    L = [["Category", "% of budget", "Estimated", "Booked", "Paid", "Still to pay", "Left to book", "Status"]];
    S.cats.forEach(c => { const r = catRow(c); L.push([c.name, c.pct, f2(r.est), f2(r.booked), f2(r.paid), f2(r.still), f2(r.left), r.status === "over" ? "Over by " + f2(r.over) : r.status === "ok" ? "On budget" : "Not booked yet"]); });
    const b = budgetTotals(); L.push(["Total", b.pct, f2(b.est), f2(b.booked), f2(b.paid), f2(b.still), f2(b.left), ""]);
  } else if (kind === "vendors") {
    L = [["Category", "Vendor", "Contact / notes", "Status", "Contract total", "Deposit", "Deposit due", "Paid so far", "Balance", "Final payment due", "Next due", "Next due date"]];
    S.vendors.forEach(v => { const c = catOf(v.cat), n = nextDue(v), bal = vendorBal(v); L.push([c ? c.name : "", v.name, v.contact || "", booked(v) && cents(v.total) > 0 && bal === 0 ? "Paid in full" : booked(v) ? "Booked" : "Researching", f2(booked(v) ? cents(v.total) : 0), f2(cents(v.deposit)), v.depositDue || "", f2(vendorPaid(v)), f2(bal), v.finalDue || "", n ? n.kind + " " + f2(n.amount) : "", n ? n.date : ""]); });
  } else if (kind === "payments") {
    L = [["Date", "Vendor", "Category", "Amount", "Paid with", "Note"]];
    S.pays.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(p => { const v = venOf(p.vendor), c = v && catOf(v.cat); L.push([p.date, v ? v.name : "", c ? c.name : "", f2(cents(p.amount)), p.method || "", p.note || ""]); });
  } else if (kind === "bytable") {
    // Guest list by table: one line per guest (a party lists all its seats), then everyone not seated yet
    L = [["Table", "Table name", "Seats", "Guest", "Party size", "Group", "Side", "Category", "RSVP", "Meal", "Dietary needs", "Notes"]];
    const by = byTable(), cl = clashes(), hn = g => hhOf(g.hh) ? hhOf(g.hh).name : "";
    S.tables.forEach(t => { const map = seatMap(t, by.get(t.id) || []), seen = new Map(); map.forEach((o, i) => { if (o) { if (!seen.has(o.g)) seen.set(o.g, []); seen.get(o.g).push(i < capOf(t) ? i + 1 : "over"); } });
      if (!seen.size) L.push([tableNo(t.id), t.name || "", "", "(empty)", "", "", "", "", "", "", "", ""]);
      seen.forEach((idx, g) => L.push([tableNo(t.id), t.name || "", idx.join(" "), g.name, people(g), hn(g), sideName(g.side), g.group || "", g.rsvp, g.meal || "", g.diet || "", ruleNotes(g, cl)])); });
    S.guests.filter(g => g.rsvp !== "Declined" && !tabOf(g.table)).forEach(g => L.push(["Not seated", "", "", g.name, people(g), hn(g), sideName(g.side), g.group || "", g.rsvp, g.meal || "", g.diet || "", ruleNotes(g, cl)]));
  } else if (kind === "menu") {
    L = [["Course", "Dish", "Brought by", "Serves", "Diet", "Note"]];
    courseList().forEach(c => dishesIn(c).forEach(x => L.push([c, x.name, dishBy(x), x.serves || "", x.diet.join("; "), x.note])));
    menuTotals().short.forEach(c => L.push([c.course, "(still needed: " + c.left + ")", "", "", "", ""]));
    if (S.shop.length) { L.push([]); L.push(["Shopping list", "Quantity", "For", "Est. cost", "Bought", ""]); S.shop.forEach(x => L.push([x.item, x.qty, x.dish && dishOf(x.dish) ? dishOf(x.dish).name : "", x.cost ? f2(cents(x.cost)) : "", x.done ? "Yes" : "No", ""])); }
  } else if (kind === "gifts") {
    L = [["Received", "From", "Gift", "Value", "Thank-you sent", "Note"]];
    S.gifts.slice().sort((a, b) => (a.date || "").localeCompare(b.date || "")).forEach(x => L.push([x.date || "", giftFrom(x), x.item, x.value ? f2(cents(x.value)) : "", x.thanks ? "Yes" : "No", x.note || ""]));
  } else {
    L = [["Guest", "Side", "Group", "Category", "Party size", "RSVP", "Meal", "Table", "Dietary needs", "Gifts", "Thank-you sent", "Notes", "Seating rules"]];
    const cl = clashes();
    S.guests.forEach(g => { const gf = giftsOf(g); L.push([g.name, sideName(g.side), hhOf(g.hh) ? hhOf(g.hh).name : "", g.group || "", people(g), g.rsvp, g.meal || "", tableLabel(g.table) + (g.rsvp === "Declined" && tabOf(g.table) ? " (declined)" : ""), g.diet || "", gf.map(x => x.item).join("; "), gf.length ? (gf.every(x => x.thanks) ? "Yes" : "No") : "", g.notes || "", ruleNotes(g, cl)]); });
  }
  return L.map(r => r.map(q).join(",")).join("\r\n") + "\r\n";
}

<script>/*mobile-actions-fix*/
(() => {
  const MQ = matchMedia("(max-width:860px)");
  const RARE = /\b(csv|export|print|pdf|clear sample|backup|restore|import)\b/i;
  const ADD = /(^|\s)\+|\b(add|new|log|record)\b/i;
  const main = document.getElementById("main"); if (!main) return;
  const txt = b => (b.textContent || "") + " " + (b.getAttribute("aria-label") || "");
  const vis = e => e && !e.hidden && getComputedStyle(e).display !== "none";
  let openMenu = null;
  function closeMenu(focus) {
    if (!openMenu) return; const m = openMenu; openMenu = null;
    m.menu.hidden = true; m.btn.setAttribute("aria-expanded", "false"); if (focus) m.btn.focus();
  }
  function items(m) { return [...m.querySelectorAll('[role="menuitem"]')].filter(vis); }
  function openM(w, i) {
    closeMenu(); const menu = w.querySelector(".mact-menu"), btn = w.querySelector(".mact-morebtn");
    menu.hidden = false; btn.setAttribute("aria-expanded", "true"); openMenu = { menu, btn };
    const it = items(menu); if (it.length) it[i < 0 ? it.length - 1 : 0].focus();
  }
  function head() {
    const h = main.firstElementChild;
    return h && (h.classList.contains("tablebar") || h.classList.contains("top")) ? h : null;
  }
  function apply() {
    const h = head(), mobile = MQ.matches;
    const hasAdd = !!h && [...h.querySelectorAll("button,a.btn")].some(b => vis(b) && ADD.test(txt(b)));
    document.documentElement.classList.toggle("mact-nofab", mobile && hasAdd);
    if (mobile && h && !h.dataset.mact) {
      h.dataset.mact = "1";
      const title = h.firstElementChild;
      const acts = [...h.querySelectorAll("button.btn,a.btn")].filter(b => !title.contains(b) && !b.closest(".mact-bar"));
      if (acts.length) {
        const pri = [...acts].reverse().find(b => !b.classList.contains("ghost") && !b.classList.contains("small"));
        const rest = acts.filter(b => b !== pri);
        let rare = rest.filter(b => RARE.test(txt(b)));
        if (rare.length < 2 || rare.length === rest.length && !pri) rare = [];
        const sec = rest.filter(b => !rare.includes(b));
        const bar = document.createElement("div"); bar.className = "mact-bar";
        if (pri) { pri.classList.add("mact-pri"); bar.append(pri); }
        if (sec.length || rare.length) {
          const g = document.createElement("div"); g.className = "mact-grid"; g.append(...sec);
          if (rare.length) {
            const w = document.createElement("div"); w.className = "mact-more";
            const id = "mactMenu" + Math.random().toString(36).slice(2, 7);
            w.innerHTML = `<button type="button" class="btn ghost mact-morebtn" aria-haspopup="menu" aria-expanded="false" aria-controls="${id}" aria-label="More actions">⋯ More</button><div class="mact-menu" id="${id}" role="menu" aria-label="More actions" hidden></div>`;
            const menu = w.lastElementChild;
            rare.forEach(b => { b.setAttribute("role", "menuitem"); b.tabIndex = -1; menu.append(b); });
            g.append(w);
          }
          bar.append(g);
        }
        const old = [...h.children].filter(c => c !== title && !c.children.length && !c.textContent.trim());
        title.after(bar); old.forEach(c => c.remove());
        h.classList.add("mact-head");
      }
    }
    pad();
  }
  function pad() {
    if (!MQ.matches) return;
    let top = innerHeight;
    document.querySelectorAll("body>*,.app>*").forEach(e => {
      if (e === main || e.tagName === "DIALOG" || !vis(e)) return;
      const cs = getComputedStyle(e); if (cs.position !== "fixed" || cs.pointerEvents === "none" || +cs.opacity === 0) return;
      const r = e.getBoundingClientRect(); if (r.height && r.top > innerHeight / 2) top = Math.min(top, r.top);
    });
    const pb = Math.max(96, Math.ceil(innerHeight - top + 16)) + "px";
    if (document.documentElement.style.getPropertyValue("--mact-pb") !== pb) document.documentElement.style.setProperty("--mact-pb", pb);
  }
  new MutationObserver(apply).observe(main, { childList: true });
  const fab = document.getElementById("fab");
  if (fab) new MutationObserver(pad).observe(fab, { attributes: true, attributeFilter: ["hidden", "style", "class"] });
  addEventListener("resize", pad);
  MQ.addEventListener("change", () => { closeMenu(); if (typeof render === "function") render(); else apply(); setTimeout(pad, 50); });
  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest(".mact-morebtn");
    if (b) { const w = b.parentElement; if (openMenu && openMenu.btn === b) closeMenu(); else openM(w, 0); return; }
    if (openMenu && !openMenu.menu.contains(e.target)) closeMenu();
    else if (openMenu && e.target.closest('[role="menuitem"]')) closeMenu();
  });
  document.addEventListener("keydown", e => {
    const b = e.target.closest && e.target.closest(".mact-morebtn");
    if (b && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); openM(b.parentElement, e.key === "ArrowUp" ? -1 : 0); return; }
    if (!openMenu) return;
    const it = items(openMenu.menu), i = it.indexOf(document.activeElement);
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeMenu(true); }
    else if (e.key === "Tab") closeMenu();
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const n = it.length; if (n) it[(i + (e.key === "ArrowDown" ? 1 : -1) + n) % n].focus(); }
    else if (e.key === "Home" || e.key === "End") { e.preventDefault(); if (it.length) it[e.key === "Home" ? 0 : it.length - 1].focus(); }
  }, true);
  apply(); addEventListener("load", pad); setTimeout(pad, 300);
})();
</script>

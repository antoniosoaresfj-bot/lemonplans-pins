<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A4506A">
<title>Wedding Planner App · The Lemon Plans</title>
<style>
:root{--bg:#FAF6F3;--card:#FFFFFF;--ink:#2B2326;--muted:#7A6C71;--line:#EBE0DC;--soft:#F7EAEE;--accent:#A4506A;--accent-ink:#fff;--fill:#D98AA2;--glass:#F2DFE5;--good:#2E7D5B;--warn:#B7791F;--bad:#C0392B;--goodbg:#E6F2EC;--warnbg:#FBF0D9;--badbg:#FBE4E1;--gold:#D9B46A;--shadow:0 10px 30px rgba(60,30,40,.07);--r:18px}
:root[data-theme="dark"]{--bg:#161113;--card:#211A1D;--ink:#F1E8EB;--muted:#AE9DA3;--line:#352A2E;--soft:#2C2226;--accent:#E8A2B8;--accent-ink:#2A1019;--fill:#B8607C;--glass:#3A2A30;--good:#5CC497;--warn:#E3B45C;--bad:#F07A6E;--goodbg:#173027;--warnbg:#33291A;--badbg:#3A2020;--shadow:0 10px 30px rgba(0,0,0,.35)}
:root[data-accent="sage"]{--accent:#4D7A5E;--fill:#8DB59A;--glass:#DFEBE2;--soft:#EBF2EC}:root[data-accent="sage"][data-theme="dark"]{--accent:#9FD0AE;--accent-ink:#0E1F14;--fill:#5E8F6E;--glass:#24352A;--soft:#1F2A22}
:root[data-accent="champagne"]{--accent:#946414;--fill:#DDB46A;--glass:#F3E7CF;--soft:#F6EFE1}:root[data-accent="champagne"][data-theme="dark"]{--accent:#EAC67A;--accent-ink:#1E1606;--fill:#B88C3C;--glass:#3A3020;--soft:#2A251B}
:root[data-accent="navy"]{--accent:#2F4F86;--fill:#8AA3CF;--glass:#DFE6F3;--soft:#EAEEF6}:root[data-accent="navy"][data-theme="dark"]{--accent:#A9BFEA;--accent-ink:#0D1424;--fill:#4F6EA6;--glass:#25304A;--soft:#1E2433}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav.side{padding:22px 14px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:var(--bg)}
.brand{font-weight:800;font-size:19px;padding:0 10px 18px;letter-spacing:-.3px;line-height:1.2}
.brand small{display:block;font-weight:600;font-size:12px;color:var(--muted);letter-spacing:.2px;margin-top:2px}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:650;color:var(--muted);text-align:left}
.navbtn .i{width:22px;text-align:center;font-size:18px}
.navbtn[aria-current="page"]{background:var(--soft);color:var(--ink)}
main{padding:28px 32px 120px;max-width:1160px;width:100%;min-width:0}
main:focus{outline:none}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.6px}
h2{font-size:19px;margin:0 0 12px;letter-spacing:-.2px}
.sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.3fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g2e{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.hero{padding:28px}
.lab{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.big{font-size:56px;font-weight:850;letter-spacing:-2px;line-height:1.05;margin:6px 0 4px;color:var(--accent)}
.mid{font-size:28px;font-weight:800;letter-spacing:-.6px}
.meta{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-weight:750;font-size:13px;white-space:nowrap}
.ok{background:var(--goodbg);color:var(--good)}.tight{background:var(--warnbg);color:var(--warn)}.short{background:var(--badbg);color:var(--bad)}.done{background:var(--good);color:#fff}.grey{background:var(--soft);color:var(--muted)}
.t-ok{color:var(--good)}.t-short{color:var(--bad)}.t-warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:800;white-space:nowrap;text-align:right}
.emo{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.small{padding:7px 12px;border-radius:10px;font-size:14px}
.btn.danger{background:var(--badbg);color:var(--bad)}
.icon{border:0;background:var(--soft);border-radius:10px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center;font-size:15px;flex:none}
.bar{height:12px;border-radius:999px;background:var(--glass);overflow:hidden;position:relative}.bar i{display:block;height:100%;background:var(--fill);border-radius:999px}
.bar.over i{background:var(--bad)}
.fab{position:fixed;right:26px;bottom:26px;width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:32px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.25);cursor:pointer;z-index:20}
.app{position:relative}
.themetog{position:absolute;top:22px;right:28px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer;z-index:10;padding:0;transition:color .15s,border-color .15s}
.themetog:hover,.themetog:focus-visible{color:var(--ink);border-color:var(--muted)}
.themetog svg{width:18px;height:18px;display:block}
main h1{padding-right:48px}
@media (max-width:860px){.themetog{top:14px;right:14px;width:36px;height:36px}}
/* Wedding: espaço para a chave quando a tela não começa com título (Home) e nos botões do cabeçalho no desktop */
main>:first-child:not(h1):not(.tablebar){margin-top:44px}
@media (min-width:861px){main>.tablebar:first-child{padding-right:52px}}
@media (max-width:860px){main>:first-child:not(h1):not(.tablebar){margin-top:40px}}
.empty{color:var(--muted);text-align:center;padding:22px 10px}
.hint{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink)}
.kv{display:flex;justify-content:space-between;padding:7px 0;color:var(--muted);gap:10px}.kv b{color:var(--ink);text-align:right}
.kv.total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;color:var(--ink);font-weight:800}
.ring circle{fill:none;stroke-width:12}.ring .tr{stroke:var(--glass)}.ring .pr{stroke:var(--fill);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring text{fill:var(--ink);font-weight:850;font-size:26px}.ring .rs{fill:var(--muted);font-size:12px;font-weight:700}
.ringrow{display:flex;gap:18px;align-items:center}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat3 div{background:var(--soft);border-radius:14px;padding:12px;min-width:0}
.stat3 b{display:block;font-size:20px;letter-spacing:-.3px}
.stat3 span{font-size:12px;color:var(--muted);font-weight:700}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:800;text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t tfoot td{font-weight:850;border-top:2px solid var(--line)}
table.t td.l,table.t th.l{text-align:left}
table.t input.pct{width:64px;padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);text-align:right}
table.t select.rs{padding:5px 6px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:13.5px}
.cbar{display:grid;grid-template-columns:170px 1fr 92px;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.cbar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}
.cbar .bar{height:14px}
.cbar .bar b{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.55}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.tools .field{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;cursor:pointer;font-weight:650;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* seating */
.seatwrap{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.pool{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.zone{min-height:60px;border-radius:14px;transition:background .15s,outline-color .15s;outline:2px dashed transparent;outline-offset:2px}
.zone.over{background:var(--soft);outline-color:var(--accent)}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.tcard.full{border-color:var(--good)}.tcard.overcap{border-color:var(--bad)}
.thead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.thead .grow{flex:1;min-width:0}
.thead .name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thead .tname{font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsvg{display:block;flex:none}.tsvg .top{fill:var(--glass)}.tsvg .seat{fill:var(--card);stroke:var(--line);stroke-width:2}.tsvg .seat.on{fill:var(--fill);stroke:var(--fill)}.tsvg .seat.x{fill:var(--bad);stroke:var(--bad)}.tsvg text{fill:var(--ink);font-weight:850;font-size:15px}
.gchips{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;padding:2px}
.gchip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 10px;cursor:grab;font-weight:650;font-size:13.5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;touch-action:manipulation}
.gchip small{color:var(--muted);font-weight:700;margin-left:4px}
.gchip.inv{border-style:dashed;color:var(--muted)}
.gchip.picked{outline:3px solid var(--gold);outline-offset:1px;background:var(--soft)}
.gchip.dragging{opacity:.4}
/* floor plan */
:root{--s-p1:#C2577A;--s-p2:#3F6FB5;--s-both:#9A7520;--seatink:#fff;--m0:#A79A9F;--m1:#C07A1E;--m2:#A4473C;--m3:#2F7FA8;--m4:#4C9A5B;--m5:#6E8A1F;--m6:#8A5BB0}
:root[data-theme="dark"]{--s-p1:#E796B0;--s-p2:#8FB0EC;--s-both:#E3C274;--seatink:#1B1316;--m0:#8A7D82;--m1:#E8AE5E;--m2:#E0857A;--m3:#79B9DE;--m4:#86CB93;--m5:#B9D46A;--m6:#BE98E0}
.modetabs{margin:12px 0 14px}
.planwrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;grid-template-areas:"plan pool" "plan info";grid-template-rows:auto 1fr;gap:16px;align-items:start}
.plancard{grid-area:plan;padding:12px}.ppool{grid-area:pool}.pinfo{grid-area:info}
.ptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.ptools .grow{flex:1}
.ptools .chip{padding:5px 11px;font-size:13.5px}
.selbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:46px;padding:8px 2px 0;font-size:14px}
.selbar .grow{flex:1;min-width:120px}
.planbox{position:relative;width:100%;max-height:min(70vh,640px);min-height:260px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
#plan{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.phelp{margin:8px 2px 0;font-size:12.5px}
.room{fill:var(--card);stroke:var(--ink);stroke-width:2.5;vector-effect:non-scaling-stroke}
.gl1{fill:none;stroke:var(--line);stroke-width:.05}.gl5{fill:none;stroke:var(--line);stroke-width:.12}
.dim{fill:var(--muted);font-size:1.4px;font-weight:750;text-anchor:middle}
.dn0{fill:var(--card)}.dn1{fill:var(--glass)}
.el{cursor:move;outline:none}
.tb{fill:var(--glass);stroke:var(--fill);stroke-width:1.5;vector-effect:non-scaling-stroke}
.el.full .tb{stroke:var(--good);stroke-width:2.5}.el.over .tb{stroke:var(--bad);stroke-width:3}
.ib{fill:var(--soft);stroke:var(--muted);stroke-width:1.2;vector-effect:non-scaling-stroke}
.k-stage .ib,.k-dj .ib{fill:var(--glass)}.k-entrance .ib{fill:var(--accent);stroke:none}.k-label .ib{fill:transparent;stroke:none}
.k-dance .ib{stroke:var(--fill)}
.el.sel .tb,.el.sel .ib,.el:focus-visible .tb,.el:focus-visible .ib{stroke:var(--accent);stroke-width:3}
.el:focus-visible .tb,.el:focus-visible .ib{stroke-dasharray:6 3}
.el.hot .tb{fill:var(--soft);stroke:var(--accent);stroke-width:3}
.tno{fill:var(--ink);font-weight:850;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tnm,.ilab{fill:var(--muted);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.ilab{fill:var(--ink)}
.seat{cursor:pointer}
.seat circle{fill:var(--card);stroke:var(--fill);stroke-width:1.2;vector-effect:non-scaling-stroke}
.seat.on circle{stroke:var(--card);stroke-width:1}
.seat.inv circle{opacity:.6;stroke:var(--ink);stroke-dasharray:3 2}
.seat.dec circle{stroke:var(--bad);stroke-width:3}
.seat.x circle{stroke:var(--bad);stroke-width:2.5;stroke-dasharray:3 2}
.seat:hover circle,.seat.hot circle{stroke:var(--accent);stroke-width:3;stroke-dasharray:none}
.seat text{fill:var(--seatink);font-size:.66px;font-weight:850;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dbadge circle{fill:var(--m4)}.dbadge text{fill:#fff;font-size:.62px;font-weight:850;text-anchor:middle;dominant-baseline:central}
.roth line{pointer-events:none;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke}.roth circle{fill:var(--card);stroke:var(--accent);stroke-width:2.5;vector-effect:non-scaling-stroke;cursor:grab}
.gchip{user-select:none;-webkit-user-select:none}
.gchip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.gghost{position:fixed;z-index:70;pointer-events:none;padding:5px 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:750;font-size:13.5px;transform:translate(-50%,-140%);box-shadow:0 8px 20px rgba(0,0,0,.25);white-space:nowrap}
.ppool .gchips{max-height:min(48vh,460px);overflow:auto;align-content:flex-start}
.ppool input{width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);margin-bottom:10px}
.warns{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px;font-size:14px}
.warns li{padding:9px 11px;border-radius:12px;background:var(--soft)}
.warns li.bad{background:var(--badbg);color:var(--bad)}.warns li.warn{background:var(--warnbg);color:var(--warn)}.warns li.good{background:var(--goodbg);color:var(--good)}
.warns li .btn{margin-top:6px}
.tinfo{border-top:1px solid var(--line);padding-top:12px;margin-top:4px;font-size:14px}
.tinfo .row{padding:6px 0;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.tile{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 6px;cursor:pointer;display:grid;justify-items:center;gap:4px;font-weight:700;font-size:13px;text-align:center}
.tile:hover,.tile:focus-visible{border-color:var(--accent);outline:none}
.tile svg{width:46px;height:30px}.tile svg *{fill:var(--glass);stroke:var(--fill);stroke-width:1.5}
#printArea{display:none}
@media (max-width:980px){.planwrap{grid-template-columns:1fr;grid-template-areas:"pool" "plan" "info"}.ppool .gchips{max-height:150px}}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,1fr)}.plancard{padding:10px}}
@media print{
 @page{size:landscape;margin:10mm}
 html,body{background:#fff!important}
 .app,.fab,.toast,#demoBar,dialog,.themetog,.gghost{display:none!important}
 #printArea{display:block!important;color:#222;--bg:#fff;--card:#fff;--ink:#222;--muted:#666;--line:#ddd;--soft:#f3f3f3;--glass:#efefef;--fill:#999;--accent:#555;--accent-ink:#fff;--good:#2E7D5B;--bad:#C0392B;--warn:#B7791F;--seatink:#fff;--s-p1:#C2577A;--s-p2:#3F6FB5;--s-both:#9A7520;--m0:#A79A9F;--m1:#C07A1E;--m2:#A4473C;--m3:#2F7FA8;--m4:#4C9A5B;--m5:#6E8A1F;--m6:#8A5BB0}
 .phead{display:flex;justify-content:space-between;font-size:13pt;margin-bottom:4mm}.phead span{color:#666;font-size:10pt}
 .pplan{width:100%;height:170mm;display:block}
 .ptables{columns:4;column-gap:6mm;font-size:9pt;break-before:page}
 .ptab{break-inside:avoid;margin:0 0 4mm;border:1px solid #ddd;border-radius:3mm;padding:2.5mm 3mm}
 .ptab h3{font-size:10.5pt;margin:0 0 1mm}.ptab h3 small{color:#666;font-weight:600}
 .ptab ol{margin:0;padding-left:5mm}.ptab .pd{color:#B7791F;margin-top:1mm}
 .ptab.unseated{border-color:#B7791F}
}
/* checklist */
.task{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.tick{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--bg);cursor:pointer;flex:none;display:grid;place-items:center;font-weight:900;color:#fff;font-size:15px;padding:0}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.task .grow{flex:1;min-width:0}
.task.isdone .tt{text-decoration:line-through;color:var(--muted)}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:18px 0 2px}
.ghead:first-child{margin-top:0}
dialog{border:0;border-radius:22px;padding:0;background:var(--card);color:var(--ink);width:min(500px,94vw);box-shadow:0 30px 80px rgba(0,0,0,.35);max-height:92vh}
dialog::backdrop{background:rgba(20,10,14,.45)}
.dlg{padding:22px}
.field{display:grid;gap:6px;margin-bottom:14px;min-width:0}
.field label,.field .fl{font-size:13px;font-weight:750;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);min-width:0}
/*field-fix*/.field{align-content:start}.field input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=color]),.field select{height:48px;line-height:1.25}.field input[type=date]{display:block;min-width:0}
/*field-fix-2*/@supports (grid-template-rows:subgrid){.two>.field{grid-row:span 3;grid-template-rows:subgrid;row-gap:6px}}
.field textarea{min-height:150px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.field small{color:var(--muted);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--soft);padding:4px;border-radius:14px}

<script>
"use strict";
const DEMO = true;
const BUY_URL = "https://thelemonplans.gumroad.com/l/wedding-planner-app";
const KEY = DEMO ? "lp-wedding-planner-demo" : "lp-wedding-planner-v1";
const RSVP = ["Not invited yet", "Invited", "Attending", "Declined"];
const MEALS = ["Chicken", "Beef", "Fish", "Vegetarian", "Vegan", "Kids meal"];
const VSTAT = ["Researching", "Booked", "Paid in full"];
const METHODS = ["Card", "Bank transfer", "Check", "Cash", "Zelle / Venmo", "Gift from family", "Other"];
// Same categories and suggested split as the Wedding Budget Planner spreadsheet (adds up to 100%)
const CATS = [["Venue", 20], ["Catering & Bar", 25], ["Photography", 10], ["Videography", 4], ["Attire & Beauty", 8], ["Flowers & Decor", 8], ["Music & Entertainment", 6],
  ["Cake & Desserts", 2], ["Invitations & Stationery", 2], ["Rings", 3], ["Officiant & Ceremony", 1], ["Transportation", 2], ["Favors & Gifts", 2], ["Wedding Planner", 4], ["Other & Buffer", 3]];
const CAT_ICON = { "Venue": "🏛️", "Catering & Bar": "🍽️", "Photography": "📷", "Videography": "🎥", "Attire & Beauty": "👗", "Flowers & Decor": "💐", "Music & Entertainment": "🎶", "Cake & Desserts": "🎂",
  "Invitations & Stationery": "✉️", "Rings": "💍", "Officiant & Ceremony": "⛪", "Transportation": "🚗", "Favors & Gifts": "🎁", "Wedding Planner": "📋", "Other & Buffer": "🧾" };
// Same month-by-month checklist as the spreadsheet: [label, days before the wedding, tasks]
const WHEN = [
  ["12+ months", 365, ["Set your total budget together", "Pick a date and rough guest count", "Book the venue", "Start the guest list", "Hire a planner (optional)"]],
  ["10–12 months", 320, ["Book photographer", "Book caterer", "Book videographer", "Choose wedding party"]],
  ["8–10 months", 270, ["Shop for the dress", "Book DJ or band", "Book florist", "Create a registry", "Send save the dates"]],
  ["6–8 months", 210, ["Book officiant", "Plan the honeymoon", "Book hair & makeup", "Order the cake tasting"]],
  ["4–6 months", 150, ["Order invitations", "Buy wedding bands", "Book transportation", "Choose bridesmaid dresses"]],
  ["2–4 months", 90, ["Mail invitations", "Dress fittings", "Plan rehearsal dinner", "Buy favors and gifts"]],
  ["1 month", 30, ["Final head count to caterer", "Seating chart", "Get the marriage license", "Confirm every vendor"]],
  ["1–2 weeks", 10, ["Pay final balances", "Pack for the honeymoon", "Final dress fitting", "Prepare vendor tips"]],
  ["After the wedding", -30, ["Send thank-you notes", "Change your name (if you want)", "Preserve the dress"]]
];

/* ---------- dates (local calendar days, ISO yyyy-mm-dd) ---------- */
const iso = d => { const z = new Date(d); return z.getFullYear() + "-" + String(z.getMonth() + 1).padStart(2, "0") + "-" + String(z.getDate()).padStart(2, "0"); };
const parse = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dayDiff = (a, b) => Math.round((b - a) / 86400000);
const fmtD = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const fmtS = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
const fmtLong = d => d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });

/* ---------- state ---------- */
const uid = () => Math.random().toString(36).slice(2, 9);
const defaultCats = () => CATS.map(([name, pct]) => ({ id: uid(), name, pct }));
const defaultTasks = () => WHEN.flatMap(([when, days, list]) => list.map(text => ({ id: uid(), when, days, text, done: false })));
function blank() {
  return { v: 1, app: "wedding-planner", currency: "$", theme: "auto", accent: "blush", p1: "", p2: "", date: "", budget: 0, guestGoal: 0,
    cats: defaultCats(), vendors: [], pays: [], guests: [], tables: [], tasks: defaultTasks(), plan: blankPlan() };
}
// Floor plan: the room (feet), the non-table items, seat colors. Tables keep their place in tables[] (x, y = center in feet; rot in degrees).
const blankPlan = () => ({ w: 80, l: 60, snap: true, color: "side", items: [] });
function valid(s) { return s && s.v === 1 && s.app === "wedding-planner" && ["cats", "vendors", "pays", "guests", "tables", "tasks"].every(k => Array.isArray(s[k])); }
const clampN = (v, a, b, d) => { v = Number(v); return isFinite(v) && v > 0 ? Math.max(a, Math.min(b, v)) : d; };
// Old backups (v1.0, no floor plan) come in as they are: every table gets a shape and a free spot in the room, nothing is dropped.
function normalize(s) {
  const o = Object.assign(blank(), s);
  o.plan = Object.assign(blankPlan(), s.plan && typeof s.plan === "object" ? s.plan : {});
  if (!Array.isArray(o.plan.items)) o.plan.items = [];
  o.plan.w = clampN(o.plan.w, 20, 400, 80); o.plan.l = clampN(o.plan.l, 20, 400, 60);
  if (!["side", "meal"].includes(o.plan.color)) o.plan.color = "side";
  o.plan.items = o.plan.items.filter(it => it && typeof it === "object" && ITEMS[it.kind]);
  o.plan.items.forEach(it => { if (!it.id) it.id = uid(); if (it.label == null) it.label = ""; it.w = clampN(it.w, 1, 200, ITEMS[it.kind].w); it.h = clampN(it.h, .5, 200, ITEMS[it.kind].h); it.rot = Number(it.rot) || 0; it.x = isFinite(it.x) && it.x !== null ? +it.x : o.plan.w / 2; it.y = isFinite(it.y) && it.y !== null ? +it.y : o.plan.l / 2; });
  o.tables.forEach(t => { if (!SHAPES[t.shape]) t.shape = "round"; t.rot = Number(t.rot) || 0; if (!isFinite(t.x) || !isFinite(t.y) || t.x === null || t.y === null) { delete t.x; delete t.y; } });
  o.guests.forEach(g => { if (g.diet == null) g.diet = ""; if (!Number.isInteger(g.seat)) g.seat = null; });
  layoutMissing(o);
  return o;
}
/* ---------- floor plan geometry (feet; x across the room, y down the room) ---------- */
function capOf(t) { return Math.max(1, Math.min(24, Math.round(Number(t.seats) || 1))); }
// Table size and seat spots around it (local coordinates, before rotation). Seat order goes clockwise from the top left.
// count > seats draws the extra (over capacity) seats too.
function tGeo(t, count) {
  const n = capOf(t), m = Math.max(n, count || 0), out = .95, seats = [];
  if (t.shape === "round" || !t.shape) {
    const D = n <= 4 ? 3.5 : n <= 6 ? 4.5 : n <= 8 ? 5 : n <= 10 ? 6 : n <= 12 ? 6.5 : n * .55, R = D / 2 + out;
    for (let i = 0; i < m; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / m; seats.push([R * Math.cos(a), R * Math.sin(a)]); }
    return { round: true, r: D / 2, bw: 2 * (R + .8), bh: 2 * (R + .8), seats };
  }
  const head = t.shape === "head", ends = t.shape === "rect" && n >= 5 ? 2 : 0, W = t.shape === "rect" ? 3 : 2.5;
  const L = Math.max(head ? 6 : 4, (head ? n : Math.ceil((n - ends) / 2)) * 2.1);
  const top = head ? m : Math.ceil((m - ends) / 2), bot = head ? 0 : m - ends - top;
  const row = (k, y, rev) => { for (let i = 0; i < k; i++) { const j = rev ? k - 1 - i : i; seats.push([-L / 2 + L * (j + .5) / k, y]); } };
  row(top, -W / 2 - out);
  if (ends) seats.push([L / 2 + out, 0]);
  row(bot, W / 2 + out, true);
  if (ends) seats.push([-L / 2 - out, 0]);
  return { round: false, L, W, bw: L + (ends ? 2 * (out + .8) : .4), bh: W + 2 * (out + .8), seats };
}
// Axis-aligned box of a table or an item after rotation (for "is this spot free?")
function bboxOf(o) {
  const g = o.kind ? { bw: o.w, bh: o.h } : tGeo(o), a = (Number(o.rot) || 0) * Math.PI / 180, c = Math.abs(Math.cos(a)), sn = Math.abs(Math.sin(a));
  return { w: g.bw * c + g.bh * sn, h: g.bw * sn + g.bh * c };
}
// A free spot for a w × h box: the closest one to (nx, ny), or the first one reading the room left to right, top to bottom.
function findFree(st, w, h, nx, ny, skip) {
  const P = st.plan, others = st.tables.filter(t => t !== skip && t.x != null).concat(P.items.filter(i => i !== skip)).map(o => [o, bboxOf(o)]);
  const fits = (x, y) => others.every(([o, b]) => Math.abs(o.x - x) * 2 >= b.w + w + 1 || Math.abs(o.y - y) * 2 >= b.h + h + 1);
  const x0 = Math.min(P.w / 2, w / 2 + 1), y0 = Math.min(P.l / 2, h / 2 + 1), x1 = Math.max(x0, P.w - w / 2 - 1), y1 = Math.max(y0, P.l - h / 2 - 1);
  let best = null, bd = Infinity;
  for (let y = y0; y <= y1; y += 1) for (let x = x0; x <= x1; x += 1) {
    if (!fits(x, y)) continue;
    if (nx == null) return [Math.round(x * 2) / 2, Math.round(y * 2) / 2];
    const d = (x - nx) ** 2 + (y - ny) ** 2; if (d < bd) { bd = d; best = [x, y]; }
  }
  return best ? best.map(v => Math.round(v * 2) / 2) : [nx == null ? P.w / 2 : nx, ny == null ? P.l / 2 : ny];
}
function layoutMissing(st) {
  st.tables.forEach(t => { if (t.x == null) { const b = bboxOf(t); [t.x, t.y] = findFree(st, b.w, b.h); } });
}

const ITEMS = {
  sweetheart: { name: "Sweetheart table", w: 5, h: 2.5 }, dance: { name: "Dance floor", w: 18, h: 16 }, stage: { name: "Stage / band", w: 16, h: 8 }, dj: { name: "DJ booth", w: 6, h: 3 },
  buffet: { name: "Buffet", w: 10, h: 3 }, bar: { name: "Bar", w: 10, h: 3 }, cake: { name: "Cake table", w: 4, h: 4, round: true }, gifts: { name: "Gift table", w: 6, h: 2.5 },
  entrance: { name: "Entrance", w: 8, h: 1.2 }, restrooms: { name: "Restrooms", w: 8, h: 6 }, label: { name: "Label", w: 10, h: 2 }
};
const SHAPES = { round: "Round", rect: "Rectangle", banquet: "Banquet", head: "Head table" };
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (valid(s)) return normalize(s); } catch (e) {}
  return DEMO ? sample() : blank();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("Couldn't save in this browser"); } }
let S = load();
const isNew = () => !S.date && !S.budget && !S.p1 && !S.p2 && !S.vendors.length && !S.guests.length;

function sample() {
  const s = blank(), t = today(), W = addDays(t, 215), before = n => iso(addDays(W, -n)), ago = n => iso(addDays(t, -n));
  Object.assign(s, { p1: "Emma", p2: "James", date: iso(W), budget: 30000, guestGoal: 120 });
  const cat = n => s.cats.find(c => c.name === n).id;
  // [category, vendor, contact, status, contract total, deposit, deposit due, final payment due]
  s.vendors = [
    ["Venue", "Rosewood Garden Estate", "Sarah (events) · ceremony + reception", "Booked", 5900, 2000, ago(85), before(31)],
    ["Catering & Bar", "Blush & Basil Catering", "Tasting done · 120 guests", "Booked", 7400, 1500, ago(58), before(15)],
    ["Photography", "Golden Hour Studio", "8 hours + engagement shoot", "Booked", 2900, 1000, ago(70), before(14)],
    ["Videography", "Ever After Films", "Highlight film · quote $1,800", "Researching", 0, 0, "", ""],
    ["Attire & Beauty", "Ivory Lane Bridal", "Dress + alterations", "Booked", 1650, 825, ago(45), before(58)],
    ["Attire & Beauty", "Glow Beauty Co.", "Hair & makeup, bride + 4", "Booked", 700, 200, ago(6), before(0)],
    ["Flowers & Decor", "Petal & Stem", "Bouquets, arch, centerpieces", "Booked", 2600, 800, ago(24), before(14)],
    ["Music & Entertainment", "Velvet Sound DJ", "Ceremony + reception", "Booked", 1500, 500, ago(32), before(11)],
    ["Cake & Desserts", "Sugar Bloom Bakery", "3-tier + dessert table", "Booked", 600, 200, ago(9), before(14)],
    ["Invitations & Stationery", "Paper Heart Press", "Save the dates + invites", "Paid in full", 540, 0, "", ago(37)],
    ["Rings", "Lumen Jewelers", "Wedding bands", "Booked", 980, 300, ago(17), before(103)],
    ["Officiant & Ceremony", "Rev. Maria Lopez", "Ceremony + rehearsal", "Booked", 300, 100, ago(3), before(0)]
  ].map(([c, name, contact, status, total, deposit, depositDue, finalDue]) => ({ id: uid(), cat: cat(c), name, contact, status, total, deposit, depositDue, finalDue }));
  const ven = n => s.vendors.find(v => v.name === n).id;
  s.pays = [
    [81, "Rosewood Garden Estate", 2000, "Bank transfer", "Venue deposit"], [68, "Golden Hour Studio", 1000, "Card", "Retainer"],
    [55, "Blush & Basil Catering", 1500, "Check", "Deposit"], [42, "Ivory Lane Bridal", 900, "Card", "50% dress deposit"],
    [37, "Paper Heart Press", 540, "Card", "Save the dates + invitations"], [30, "Velvet Sound DJ", 500, "Zelle / Venmo", "Deposit"],
    [22, "Petal & Stem", 800, "Card", "Deposit"], [15, "Lumen Jewelers", 300, "Card", "Ring deposit"],
    [7, "Sugar Bloom Bakery", 200, "Cash", "Tasting + deposit"], [5, "Rosewood Garden Estate", 1500, "Gift from family", "From Mom & Dad"],
    [4, "Glow Beauty Co.", 200, "Card", "Trial + deposit"]
  ].map(([d, v, amount, method, note]) => ({ id: uid(), vendor: ven(v), amount, date: ago(d), method, note }));
  s.tables = ["Close family", "Friends", "Friends & work", "Extended family", "College friends", "Neighbors"].map(name => ({ id: uid(), name, seats: 8 }));
  const FIRST = ["Olivia", "Liam", "Ava", "Noah", "Sophia", "Mason", "Isabella", "Ethan", "Mia", "Lucas", "Charlotte", "Logan", "Amelia", "Jacob", "Harper", "Henry", "Evelyn", "Owen", "Abigail", "Jack", "Emily", "Wyatt", "Ella", "Leo", "Grace", "Julian", "Chloe", "Levi", "Lily", "Caleb", "Zoe", "Nathan", "Hannah", "Ryan", "Nora", "Aaron", "Layla", "Eli"];
  const LAST = ["Carter", "Bennett", "Hayes", "Brooks", "Reed", "Foster", "Parker", "Collins", "Morgan", "Hughes"];
  s.guests = FIRST.map((f, i) => {
    const rsvp = i < 22 ? "Attending" : i < 33 ? "Invited" : "Declined";
    return { id: uid(), name: f + " " + LAST[i % LAST.length] + (i % 4 === 0 ? " & guest" : ""), side: ["p1", "p2", "both"][i % 3], group: ["Family", "Friends", "Work", "Friends", "Family"][i % 5],
      size: i % 4 === 0 ? 2 : 1, rsvp, meal: rsvp === "Attending" ? MEALS[i % 4] : "", table: rsvp === "Attending" && i < 18 ? s.tables[Math.floor(i / 6)].id : i >= 22 && i < 26 ? s.tables[4].id : i >= 26 && i < 30 ? s.tables[3].id : i >= 30 && i < 33 ? s.tables[5].id : null,
      gift: ["", "", "Kitchen mixer (registry)", "", "", "$150 card", "", "", "", "Crystal vase"][i] || "", thanks: i === 2, notes: "" };
  });
  const DIET = { 4: "Gluten-free", 9: "Nut allergy", 13: "Dairy-free", 19: "Shellfish allergy" };
  s.guests.forEach((g, i) => { g.diet = DIET[i] || ""; g.seat = null; });
  // The sample floor plan: a 72 × 54 ft garden ballroom, dance floor in the middle, the couple facing it
  Object.assign(s.plan, { w: 60, l: 46 });
  [[10, 10], [10, 22], [10, 34], [46, 10], [46, 22], [46, 34]].forEach(([x, y], i) => Object.assign(s.tables[i], { shape: "round", x, y, rot: 0 }));
  s.plan.items = [["sweetheart", 28, 5, 0, "Emma & James", 6, 2.5], ["dance", 28, 17, 0, "", 16, 12], ["dj", 28, 26, 180, "", 6, 3], ["cake", 21, 31, 0, "", 4, 4], ["gifts", 35, 31, 0, "", 6, 2.5], ["buffet", 10, 43, 0, "", 12, 3], ["bar", 46, 43, 0, "", 10, 3],
    ["entrance", 28, 45.4, 0, "", 8, 1.2], ["restrooms", 56, 26, 90, "", 8, 5], ["label", 28, 37, 0, "Photo booth", 10, 2]]
    .map(([kind, x, y, rot, label, w, h]) => ({ id: uid(), kind, x, y, rot, label, w, h }));
  s.tasks.forEach((k, i) => k.done = i < 14);

}

/* ---------- the math (whole cents) ---------- */
const cents = v => Math.round((Number(v) || 0) * 100);
const catOf = id => S.cats.find(c => c.id === id);
const venOf = id => S.vendors.find(v => v.id === id);
const tabOf = id => S.tables.find(t => t.id === id);
const booked = v => v.status !== "Researching";
// Estimated = total budget × % for the category, rounded to the dollar (same as the spreadsheet)
const catEst = c => cents(Math.round((Number(S.budget) || 0) * (Number(c.pct) || 0) / 100));
const vendorPaid = v => S.pays.filter(p => p.vendor === v.id).reduce((s, p) => s + cents(p.amount), 0);
const vendorBal = v => booked(v) ? Math.max(0, cents(v.total) - vendorPaid(v)) : 0;
const catBooked = c => S.vendors.filter(v => v.cat === c.id && booked(v)).reduce((s, v) => s + cents(v.total), 0);
const catPaid = c => S.vendors.filter(v => v.cat === c.id).reduce((s, v) => s + vendorPaid(v), 0);
function catRow(c) {
  const est = catEst(c), bk = catBooked(c), pd = catPaid(c);
  return { est, booked: bk, paid: pd, still: Math.max(0, bk - pd), left: est - bk, status: bk === 0 ? "none" : bk > est ? "over" : "ok", over: Math.max(0, bk - est) };
}
function budgetTotals() {
  const rows = S.cats.map(catRow), sum = k => rows.reduce((s, r) => s + r[k], 0);
  const pct = Math.round(S.cats.reduce((s, c) => s + (Number(c.pct) || 0), 0) * 100) / 100;
  return { budget: cents(S.budget), pct, est: sum("est"), booked: sum("booked"), paid: sum("paid"), still: S.vendors.reduce((s, v) => s + vendorBal(v), 0), left: cents(S.budget) - sum("booked") };
}
// What's due next for a vendor: the deposit if it isn't covered yet, then the balance by the final due date
function nextDue(v) {
  if (!booked(v)) return null;
  const paid = vendorPaid(v), dep = cents(v.deposit), tot = cents(v.total);
  if (dep > paid && v.depositDue) return { kind: "Deposit", amount: dep - paid, date: v.depositDue };
  if (tot - paid > 0) return { kind: dep > 0 ? "Balance" : "Payment", amount: tot - paid, date: v.finalDue || "" };
  return null;
}
const dueState = d => !d ? "" : dayDiff(today(), parse(d)) < 0 ? "overdue" : dayDiff(today(), parse(d)) <= 30 ? "soon" : "";
function upcoming() { return S.vendors.map(v => [v, nextDue(v)]).filter(([, n]) => n).sort((a, b) => (a[1].date || "9999").localeCompare(b[1].date || "9999")); }
// Guests: a declined guest doesn't take a seat; everyone else counts at their table
const seatsOf = g => g.rsvp === "Declined" ? 0 : Math.max(1, Math.round(Number(g.size) || 1));
const people = g => Math.max(1, Math.round(Number(g.size) || 1));
function headcount() {
  const r = { total: 0, invited: 0, attending: 0, awaiting: 0, declined: 0, notyet: 0, parties: S.guests.length };
  S.guests.forEach(g => { const n = people(g); r.total += n; if (g.rsvp !== "Not invited yet") r.invited += n; if (g.rsvp === "Attending") r.attending += n; if (g.rsvp === "Invited") r.awaiting += n; if (g.rsvp === "Declined") r.declined += n; if (g.rsvp === "Not invited yet") r.notyet += n; });
  return r;
}
function meals() { const m = {}; MEALS.forEach(x => m[x] = 0); m["Not chosen"] = 0; S.guests.filter(g => g.rsvp === "Attending").forEach(g => m[g.meal && m[g.meal] != null ? g.meal : "Not chosen"] += people(g)); return m; }
const tableSeated = t => S.guests.filter(g => g.table === t.id).reduce((s, g) => s + seatsOf(g), 0);
function seating() {
  const seats = S.tables.reduce((s, t) => s + (Number(t.seats) || 0), 0), seated = S.tables.reduce((s, t) => s + tableSeated(t), 0);
  const need = S.guests.filter(g => g.rsvp === "Attending" && !tabOf(g.table)).reduce((s, g) => s + people(g), 0);
  return { seats, seated, need, over: S.tables.filter(t => tableSeated(t) > (Number(t.seats) || 0)).length, used: S.tables.filter(t => tableSeated(t) > 0).length };
}
// Checklist: target date = wedding date minus the days before
const taskDue = t => S.date ? addDays(parse(S.date), -(Number(t.days) || 0)) : null;
function taskState(t) { if (t.done) return "done"; const d = taskDue(t); if (!d) return ""; const n = dayDiff(today(), d); return n < 0 ? "overdue" : n <= 7 ? "week" : ""; }
const daysToGo = () => S.date ? dayDiff(today(), parse(S.date)) : null;
const tableNo = id => S.tables.findIndex(t => t.id === id) + 1;
const tableLabel = id => { const t = tabOf(id); return t ? "Table " + tableNo(id) + (t.name ? " · " + t.name : "") : ""; };
const sideName = s => s === "p1" ? (S.p1 || "Partner 1") : s === "p2" ? (S.p2 || "Partner 2") : "Both";

/* ---------- formatting ---------- */
function money(v, dec) {
  const n = Math.round(Math.abs(v) * 100) / 100, neg = v < 0 && n > 0 ? "-" : "";
  const d = dec ?? (Math.round(n * 100) % 100 ? 2 : 0);
  return neg + S.currency + n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
}
const mc = (c, dec) => money(c / 100, dec);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2200); }
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
function ringSVG(pct, big, small, size = 132) {
  const r = 52, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct));
  return `<svg class="ring" viewBox="0 0 132 132" width="${size}" height="${size}" role="img" aria-label="${Math.round(p * 100)}%"><circle class="tr" cx="66" cy="66" r="${r}"/><circle class="pr" cx="66" cy="66" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - p)).toFixed(1)}" transform="rotate(-90 66 66)"/><text x="66" y="70" text-anchor="middle">${big}</text><text class="rs" x="66" y="90" text-anchor="middle">${small}</text></svg>`;
}
function tableSVG(t, size = 74) {
  const n = Math.max(0, Math.min(24, Number(t.seats) || 0)), used = tableSeated(t), R = 30, cx = 40, cy = 40;
  let dots = "";
  for (let i = 0; i < Math.max(n, Math.min(24, used)); i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / Math.max(n, used, 1); dots += `<circle class="seat ${i >= n ? "x" : i < used ? "on" : ""}" cx="${(cx + R * Math.cos(a)).toFixed(1)}" cy="${(cy + R * Math.sin(a)).toFixed(1)}" r="6"/>`; }
  return `<svg class="tsvg" viewBox="0 0 80 80" width="${size}" height="${size}" aria-hidden="true"><circle class="top" cx="40" cy="40" r="20"/>${dots}<text x="40" y="45" text-anchor="middle">${tableNo(t.id)}</text></svg>`;
}

/* --- floor plan: seats --- */
function byTable() { const m = new Map(); S.guests.forEach(g => { if (g.table) { if (!m.has(g.table)) m.set(g.table, []); m.get(g.table).push(g); } }); return m; }
// Who sits where: guests with a chosen seat keep it (a party takes the seats next to it), the rest fill the free seats in order.
// Spots past the table's seats are "over capacity". Declined guests still at the table come last (they hold a seat until you unseat them).

  act.forEach(g => {
    const n = people(g), st = g.seat;

      const idx = []; for (let k = 0; k < n; k++) idx.push((st + k) % cap);

    }

/* --- floor plan: drawing (SVG in feet) --- */
function planTable(t, list, print) {

const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v), f2 = c => (c / 100).toFixed(2);
